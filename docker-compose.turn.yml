version: '3.8'

services:
  # خادم الإشارات (RemoteBridge Signaling Server) - يعمل عبر خادم ر_render فقط
  signaling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: remotebridge-signaling
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=10000
    ports:
      - "10000:10000"
      - "9090:9090"

volumes: {}