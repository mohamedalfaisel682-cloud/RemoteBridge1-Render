            // B5 — وضع التفاصيل: صفوف نصية (الاسم • النوع • الحجم • التاريخ) بدون شبكة صور
            if (studioViewSize === 'details') {
                grid.innerHTML = filtered.map((it, fi) => {
                    const icon = it.kind === "audio" ? "🎵" : (it.kind === "video" ? "🎞" : "🖼");
                    const sizeTxt = it.size ? (it.size >= 1048576 ? (it.size / 1048576).toFixed(1) + "MB" : (it.size / 1024).toFixed(0) + "KB") : "";
                    const dateTxt = it.dateMs ? new Date(it.dateMs).toLocaleString('ar-EG', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "";
                    const rowThumb = it.thumb ? `<img class="fb-row-thumb" src="${it.thumb}" alt="">` : `<span class="fb-row-thumb flex items-center justify-center text-xl">${icon}</span>`;
                    return `<div class="fb-row" onclick="openStudioPreview(${fi})">${rowThumb}<button onclick="event.stopPropagation();mpFromStudio(${fi})" title="تشغيل في المشغل الاحترافي (مقاطع/صوت كامل)" class="shrink-0 text-[10px] font-bold bg-emerald-700/80 hover:bg-emerald-600 text-white px-1.5 py-1 rounded-lg transition">▶</button>
                        <div class="flex-1 min-w-0">
                            <div class="text-[11px] font-bold text-slate-200 truncate">${escHtml(it.name || "(بدون اسم)")}</div>
                            <div class="text-[9px] text-slate-500">${icon}${durationTxt(it.durationMs)}${sizeTxt ? " • " + sizeTxt : ""}${dateTxt ? " • " + dateTxt : ""}</div>
                        </div>
                        <span class="text-[10px] text-emerald-300">معاينة 🔍</span>
                    </div>`;
                }).join("");
                return;
            }
            grid.innerHTML = filtered.map((it, fi) => {
                const icon = it.kind === "audio" ? "🎵" : (it.kind === "video" ? "🎞" : "🖼");
                const dur = it.durationMs ? Math.round(it.durationMs / 1000) + "ث" : "";
                const sizeTxt = it.size ? (it.size >= 1048576 ? (it.size / 1048576).toFixed(1) + "MB" : (it.size / 1024).toFixed(0) + "KB") : "";
                const thumb = it.thumb
                    ? `<img class="studio-thumb" src="${it.thumb}" alt="">`
                    : `<div class="w-full h-full flex items-center justify-center text-4xl opacity-60">${icon}</div>`;
                return `<div class="studio-card relative" onclick="openStudioPreview(${fi})">${thumb}<button onclick="event.stopPropagation();mpFromStudio(${fi})" title="تشغيل في المشغل الاحترافي" class="absolute bottom-1 left-1 z-10 text-[10px] font-bold bg-emerald-700/85 hover:bg-emerald-600 text-white px-1.5 py-0.5 rounded-lg transition">▶</button><span class="studio-type-badge">${icon}${dur ? " " + dur : ""}</span><div class="studio-meta">${escHtml(it.name || "")} • ${sizeTxt}</div></div>`;
            }).join("");
        }

        // B5 — نص مدة موحد لصفوف التفاصيل
        function durationTxt(ms) {
            if (!ms) return "";
            const s = Math.round(ms / 1000);
            return " • " + (s >= 60 ? Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") : s + "ث");
        }

        function fetchStudioMedia() {
            if (!studioFolders || studioFolders.length === 0) {
                openStudioFolderPicker();
                return;
            }
            studioLoading = true;
            renderStudioGrid();
            const paths = studioFolders.map(f => f.path || f.label);
            sendRPCCommand("media_items", { folders: paths, limit: 300 }, { timeout: 18000 }).catch(() => {
                studioLoading = false;
                renderStudioGrid();
                showHintOnce("studio-fetch-fail", "تعذر جلب الوسائط — تأكد من اتصال الجهاز المضيف وتحديث التطبيق");
            });
        }

        function openStudioFolderPicker() {
            studioPendingSel = studioFolders.map(f => ({ ...f }));
            const modalHost = document.getElementById("studio-folder-modal-host");
            if (!modalHost) {
                const newHost = document.createElement("div");
                newHost.id = "studio-folder-modal-host";
                document.body.appendChild(newHost);
            }
            const hostEl = document.getElementById("studio-folder-modal-host");
            hostEl.innerHTML = `<div id="studio-folder-modal" class="fixed inset-0 z-[60] bg-black/75 flex items-end sm:items-center justify-center p-3">
                <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-h-[80vh] flex flex-col">
                    <div class="p-3 border-b border-slate-800 space-y-2">                        <div class="flex items-center justify-between">
                            <p class="text-sm font-bold text-emerald-300">📂 المجلدات الحاوية على وسائط</p>
                            <button onclick="closeStudioFolderPicker()" class="text-slate-400 hover:text-white px-1 text-sm">✕</button>
                        </div>
                        <div class="relative">
                            <input id="studio-folder-search" type="text" oninput="filterStudioFolderSearch()" onfocus="filterStudioFolderSearch()" autocomplete="off" placeholder="🔍 ابحث عن مجلد (اقتراحات فورية عند الكتابة)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                            <div id="studio-folder-suggest" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-xl z-10 hidden"></div>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <button onclick="selectStudioAll()" class="bg-sky-800/70 hover:bg-sky-700 text-sky-200 text-[11px] font-bold px-2.5 py-1 rounded-lg">✅ تحديد الكل (المطابقة للبحث)</button>
                            <span class="text-[9px] text-slate-500">حفظ التحديد يبقى بعد الإغلاق لتجنب اختياره كل مرة</span>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1" id="studio-folder-list">
                        <div class="text-[11px] text-slate-400 text-center py-6 animate-pulse">جارٍ جلب قائمة المجلدات من الهاتف...</div>
                    </div>
                    <div class="p-3 border-t border-slate-800 flex items-center justify-between gap-2">
                        <span id="studio-folder-count" class="text-[10px] text-slate-400"></span>
                        <div class="flex gap-1.5">
                            <button onclick="clearStudioFolders()" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-xl">تفريغ</button>
                            <button onclick="saveAndCloseStudioFolders()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold">حفظ وعرض</button>
                        </div>
                    </div>
                </div>
            </div>`;
            updateStudioFolderCountText();
            studioFolderQuery = ""; // تصفير بحث الفينيت عند كل فتح للنافذة
            sendRPCCommand("media_folders", null, { timeout: 9000 }).catch(() => {
                showHintOnce("studio-unsupported", "تطبيق الهاتف المضيف يحتاج التحديث لدعم قسم الاستوديو");
            });
        }

        let studioLastFoldersList = [];
        let studioFolderQuery = "";

        function filteredStudioFolders() {
            const q = (studioFolderQuery || '').trim().toLowerCase();
            return (studioLastFoldersList || []).map((f, i) => ({ f, i }))
                .filter(({ f }) => !q || (((f.label || f.path || '') + ' ' + (f.path || '')).toLowerCase().includes(q)));
        }

        function renderStudioFolderPicker(list) {
            const hostEl = document.getElementById("studio-folder-modal-host");
            if (!hostEl) return;
            const listEl = document.getElementById("studio-folder-list");
            if (!listEl) return;
            studioLastFoldersList = list || [];
            const selSet = new Set((studioPendingSel || []).map(s => s.path));
            const visible = filteredStudioFolders();
            listEl.innerHTML = visible.map(({ f, i }) => {
                const checked = selSet.has(f.path);
                return `<div id="stfd-${i}" onclick="toggleStudioFolder(${i})" class="stfd-row p-2 rounded-xl border cursor-pointer flex items-center justify-between transition ${checked ? "border-emerald-500/70 bg-emerald-950/30" : "border-slate-800 bg-slate-900/60"}">
                    <div class="flex items-center gap-2 text-[11px] text-slate-200">
                        <span class="stfd-check w-4 h-4 rounded border border-emerald-500 flex items-center justify-center text-emerald-400 text-[10px] font-bold">${checked ? "✓" : ""}</span>
                        <span>📁 ${escHtml(f.label || f.path)}</span>
                    </div>
                    <span class="text-[9px] text-slate-400 whitespace-nowrap">${f.img || 0} صور • ${f.vid || 0} فيديو • ${f.aud || 0} صوت</span>
                </div>`;
            }).join("") || `<div class="text-[11px] text-slate-400 text-center py-6">${(studioLastFoldersList || []).length === 0 ? "لم يُعثر على مجلدات وسائط على الهاتف." : "لا نتائج مطابقة للبحث الحالي."}</div>`;
            updateStudioFolderCountText();
        }

        // ============================================================
        // B5 — متصفح مجلدات الهاتف (تنقل هرمي متداخل + أوضاع عرض S/M/L/تفاصيل)
        // يعتمد على media_folders (مسارات نسبية حقيقية تشمل المجلدات المتداخلة)
        // + media_items لجلب محتوى المجلد الحالي مع المصغرات — التصفح محسوب
        // منطقياً في لوحة المتحكم بلا أي تعديل على المضيف.
        // ============================================================
        let __fbTrail = [];
        let __fbItems = [];
        let __fbLoading = false;
        let __fbLoadedFor = "";
        window.__fbPending = false;
        window.__fbFoldersCache = window.__fbFoldersCache || [];

        function __fbReadView() {
            try { return localStorage.getItem('rb_fb_view_v1') || 'm'; } catch (_) { return 'm'; }
        }

        function openMediaFolderBrowser() {
            __fbTrail = [];
            __fbItems = [];
            __fbLoading = false;
            __fbLoadedFor = "";
            let host = document.getElementById('fb-overlay-host');
            if (!host) {
                host = document.createElement('div');
                host.id = 'fb-overlay-host';
                document.body.appendChild(host);
            }
            host.innerHTML = `
                <div class="fixed inset-0 z-[70] bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-2 sm:p-4" onclick="if(event.target===this)closeMediaFolderBrowser()">
                    <div class="w-full max-w-2xl bg-slate-950 border border-slate-700 rounded-2xl shadow-2xl max-h-[85vh] flex flex-col overflow-hidden">
                        <div class="p-3 border-b border-slate-800 bg-slate-900/60">
                            <div class="flex items-center justify-between gap-2">
                                <p class="text-sm font-bold text-emerald-300">🗂 متصفح مجلدات الهاتف المضيف</p>
                                <button onclick="closeMediaFolderBrowser()" class="text-slate-400 hover:text-white px-2 text-lg leading-none">✕</button>
                            </div>
                            <div id="fb-breadcrumbs" class="flex items-center flex-wrap gap-0.5 mt-1.5 overflow-x-auto custom-scrollbar"></div>
                            <div class="flex items-center gap-1 mt-1.5">
                                <span class="text-[9px] text-slate-500">حجم العرض:</span>
                                <button id="fb-vs-s" class="viewsize-btn ${__fbReadView() === 's' ? 'vs-active' : ''}" onclick="fbSetView('s')">S</button>
                                <button id="fb-vs-m" class="viewsize-btn ${__fbReadView() === 'm' ? 'vs-active' : ''}" onclick="fbSetView('m')">M</button>
                                <button id="fb-vs-l" class="viewsize-btn ${__fbReadView() === 'l' ? 'vs-active' : ''}" onclick="fbSetView('l')">L</button>
                                <button id="fb-vs-details" class="viewsize-btn ${__fbReadView() === 'details' ? 'vs-active' : ''}" onclick="fbSetView('details')">☰ تفاصيل</button>
                            </div>
                        </div>
                        <div id="fb-body" class="flex-1 overflow-y-auto custom-scrollbar p-3"></div>
                    </div>
                </div>`;
            if ((window.__fbFoldersCache || []).length > 0) {
                renderFolderBrowser();
            } else {
                renderFolderBrowserBody();
                window.__fbOnFolders = function () {
                    window.__fbOnFolders = null;
                    if (document.getElementById('fb-body')) renderFolderBrowser();
                };
                sendRPCCommand("media_folders", null, { timeout: 9000 }).catch(() => {
                    showHintOnce("fb-fetch-fail", "تعذر جلب قائمة المجلدات — تأكد من اتصال الهاتف المضيف وتحديث تطبيقه");
                });
            }
        }

        function closeMediaFolderBrowser() {
            const host = document.getElementById('fb-overlay-host');
            if (host) host.innerHTML = "";
            window.__fbPending = false;
            window.__fbOnFolders = null;
        }

        function __fbCurPath() { return __fbTrail.join("/"); }

        function __fbNorm(p) { return String(p || "").replace(/^\/+|\/+$/g, ""); }

        // المجلدات العليا: تجميع كل المسارات حسب القطعة الأولى
        function __fbTopSegments() {
            const map = new Map();
            for (const f of (window.__fbFoldersCache || [])) {
                const p = __fbNorm(f.path || f.label);
                if (!p) continue;
                const seg = p.split("/")[0];
                const agg = map.get(seg) || { img: 0, vid: 0, aud: 0, last: 0, count: 0 };
                agg.img += f.img || 0;
                agg.vid += f.vid || 0;
                agg.aud += f.aud || 0;
                agg.last = Math.max(agg.last, f.lastMs || 0);
                agg.count++;
                map.set(seg, agg);
            }
            return Array.from(map.entries()).map(([seg, agg]) => ({ seg, ...agg })).sort((a, b) => b.last - a.last);
        }

        // المجلدات الفرعية المباشرة تحت مسار كامل معين
        function __fbChildFolders(fullPath) {
            const kids = [];
            const seen = new Set();
            for (const f of (window.__fbFoldersCache || [])) {
                const p = __fbNorm(f.path);
                if (!p || p === fullPath || !p.startsWith(fullPath + "/")) continue;
                const seg = p.slice(fullPath.length + 1).split("/")[0];
                if (!seg || seen.has(seg)) continue;
                seen.add(seg);
                kids.push({ seg, fullPath: fullPath + "/" + seg, f });
            }
            return kids;
        }

        function __fbHasExactFolder(fullPath) {
            return (window.__fbFoldersCache || []).some(f => __fbNorm(f.path) === fullPath);
        }

        function fbBreadcrumbTo(i) {
            // -1 = الجذر، وإلا اجتز المسار حتى الطول i+1
            __fbTrail = i < 0 ? [] : __fbTrail.slice(0, i + 1);
            __fbItems = [];
            __fbLoadedFor = "";
            renderFolderBrowser();
        }

        function fbEnter(seg) {
            __fbTrail.push(seg);
            __fbItems = [];
            __fbLoadedFor = "";
            renderFolderBrowser();
        }

        function fbSetView(mode) {
            try { localStorage.setItem('rb_fb_view_v1', mode); } catch (_) {}
            renderFolderBrowser();
        }

        function renderFolderBrowser() {
            const bc = document.getElementById('fb-breadcrumbs');
            if (!bc) return;
            const cur = __fbCurPath();
            // فتات التخبزة
            let html = `<span class="fb-bc ${__fbTrail.length === 0 ? 'fb-bc-cur' : ''}" onclick="fbBreadcrumbTo(-1)">🏠 الذاكرة المشتركة</span>`;
            __fbTrail.forEach((seg, i) => {
                html += `<span class="fb-bc-sep">›</span><span class="fb-bc ${i === __fbTrail.length - 1 ? 'fb-bc-cur' : ''}" onclick="fbBreadcrumbTo(${i})">${escHtml(seg)}</span>`;
            });
            bc.innerHTML = html;
            // أزرار الحجم
            const view = __fbReadView();
            ['s', 'm', 'l', 'details'].forEach(m => {
                const btn = document.getElementById('fb-vs-' + m);
                if (btn) btn.classList.toggle('vs-active', view === m);
            });
            renderFolderBrowserBody();
        }

        function renderFolderBrowserBody() {
            const body = document.getElementById('fb-body');
            if (!body) return;
            const view = __fbReadView();
            const cur = __fbCurPath();
            const cache = window.__fbFoldersCache || [];

            if (__fbLoading && cur) {
                body.innerHTML = `<div class="text-[11px] text-slate-400 text-center py-8 animate-pulse">جارٍ جلب محتوى المجلد من الهاتف...</div>`;
                return;
            }

            if (!cur) {
                // عرض الجذر: المجلدات العليا فقط
                const tops = __fbTopSegments();
                if (tops.length === 0) {
                    body.innerHTML = `<div class="text-[11px] text-slate-400 text-center py-8">${cache.length === 0 ? "لا قائمة مجلدات بعد — أعد المحاولة بعد التأكد من اتصال الهاتف المضيف." : "لا مسارات وسائط على الهاتف."}</div>`;
                    return;
                }
                body.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">${tops.map(t => `
                    <div class="fb-card fb-folder-card h-24" onclick="fbEnter(${escAttr(t.seg)})" title="دخول مجلد ${escHtml(t.seg)}">
                        <span class="text-3xl">📁</span>
                        <span class="text-[11px] font-bold text-slate-200 truncate max-w-full px-1 text-center">${escHtml(t.seg)}</span>
                        <span class="text-[9px] text-slate-500">${t.img} صور • ${t.vid} فيديو • ${t.aud} صوت</span>
                    </div>`).join("")}</div>`;
                return;
            }

            // داخل مجلد: مجلدات فرعية + عناصر المجلد الحالي
            const kids = __fbChildFolders(cur);
            const hasExact = __fbHasExactFolder(cur);
            if (hasExact && __fbLoadedFor !== cur) {
                window.__fbPending = true;
                __fbLoading = true;
                sendRPCCommand("media_items", { folders: [cur], limit: 300 }, { timeout: 18000 }).catch(() => {
                    window.__fbPending = false;
                    __fbLoading = false;
                    renderFolderBrowserBody();
                    showHintOnce("fb-items-fail", "تعذر جلب محتوى المجلد — تأكد من اتصال الهاتف المضيف");
                });
            }

            const kidsHtml = kids.length > 0 ? `<div class="mb-2 text-[10px] font-bold text-sky-300">📂 مجلدات فرعية (${kids.length}):</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-3">${kids.map(k => `
                    <div class="fb-card fb-folder-card h-20" onclick="fbEnter(${escAttr(k.seg)})" title="دخول ${escHtml(k.seg)}">
                        <span class="text-2xl">📂</span>
                        <span class="text-[10px] font-bold text-slate-200 truncate max-w-full px-1 text-center">${escHtml(k.seg)}</span>
                    </div>`).join("")}</div>` : "";

            const items = __fbItems || [];
            let itemsHtml = "";
            if (!hasExact) {
                itemsHtml = `<div class="text-[11px] text-slate-400 text-center py-6">لا وسائط مباشرة في هذا المجلد — تابع التصفح للمجلدات الفرعية.</div>`;
            } else if (items.length === 0) {
                if (__fbLoadedFor !== cur) itemsHtml = `<div class="text-[11px] text-slate-400 text-center py-6 animate-pulse">جارٍ جلب محتوى المجلد...</div>`;
                else itemsHtml = `<div class="text-[11px] text-slate-400 text-center py-6">المجلد فارغ من الوسائط.</div>`;
            } else if (view === 'details') {
                itemsHtml = `<div class="text-[10px] font-bold text-emerald-300 mb-1.5">🎞 عناصر المجلد (${items.length}):</div>
                    ${items.map((it, fi) => {
                        const icon = it.kind === "audio" ? "🎵" : (it.kind === "video" ? "🎞" : "🖼");
                        const sizeTxt = it.size ? (it.size >= 1048576 ? (it.size / 1048576).toFixed(1) + "MB" : (it.size / 1024).toFixed(0) + "KB") : "";
                        const dateTxt = it.dateMs ? new Date(it.dateMs).toLocaleString('ar-EG', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "";
                        const rowThumb = it.thumb ? `<img class="fb-row-thumb" src="${it.thumb}" alt="">` : `<span class="fb-row-thumb flex items-center justify-center text-lg">${icon}</span>`;
                        return `<div class="fb-row" onclick="fbPreview(${fi})">${rowThumb}<button onclick="event.stopPropagation();mpFromFb(${fi})" title="تشغيل في المشغل الاحترافي (مقاطع/صوت كامل)" class="shrink-0 text-[10px] font-bold bg-emerald-700/80 hover:bg-emerald-600 text-white px-1.5 py-1 rounded-lg transition">▶</button>
                            <div class="flex-1 min-w-0">
                                <div class="text-[11px] font-bold text-slate-200 truncate">${escHtml(it.name || "(بدون اسم)")}</div>
                                <div class="text-[9px] text-slate-500">${icon}${durationTxt(it.durationMs)}${sizeTxt ? " • " + sizeTxt : ""}${dateTxt ? " • " + dateTxt : ""}</div>
                            </div>
                            <span class="text-[10px] text-emerald-300">معاينة 🔍</span>
                        </div>`;
                    }).join("")}`;
            } else {
                itemsHtml = `<div class="text-[10px] font-bold text-emerald-300 mb-1.5">🎞 عناصر المجلد (${items.length}):</div>
                    <div class="fb-grid ${view === 's' ? 'vs-s' : view === 'l' ? 'vs-l' : ''}">${items.map((it, fi) => {
                        const icon = it.kind === "audio" ? "🎵" : (it.kind === "video" ? "🎞" : "🖼");
                        const thumb = it.thumb ? `<img class="fb-cover" src="${it.thumb}" alt="">` : `<div class="w-full h-full flex items-center justify-center text-3xl opacity-60">${icon}</div>`;
                        const dur = it.durationMs ? Math.round(it.durationMs / 1000) + "ث" : "";
                        const sizeTxt = it.size ? (it.size >= 1048576 ? (it.size / 1048576).toFixed(1) + "MB" : (it.size / 1024).toFixed(0) + "KB") : "";
                        return `<div class="fb-card relative" onclick="fbPreview(${fi})">${thumb}<button onclick="event.stopPropagation();mpFromFb(${fi})" title="تشغيل في المشغل الاحترافي" class="absolute bottom-1 left-1 z-10 text-[10px] font-bold bg-emerald-700/85 hover:bg-emerald-600 text-white px-1.5 py-0.5 rounded-lg transition">▶</button><span class="studio-type-badge">${icon}${dur ? " " + dur : ""}</span><div class="studio-meta">${escHtml(it.name || "")} • ${sizeTxt}</div></div>`;
                    }).join("")}</div>`;
            }
            body.innerHTML = kidsHtml + itemsHtml;
        }

        // معاينة داخل متصفح المجلدات (طبقة مستقلة أعلى التراكب)
        function fbPreview(idx) {
            const it = (__fbItems || [])[idx];
            if (!it) return;
            let host = document.getElementById('fb-preview-host');
            if (!host) {
                host = document.createElement('div');
                host.id = 'fb-preview-host';
                document.body.appendChild(host);
            }
            const sizeTxt = it.size ? (it.size >= 1048576 ? (it.size / 1048576).toFixed(1) + "MB" : (it.size / 1024).toFixed(0) + "KB") : "";
            const dateTxt = it.dateMs ? new Date(it.dateMs).toLocaleString('ar-EG', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : "";
            const ph = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
            let media = `<div class="w-40 h-40 flex items-center justify-center text-6xl opacity-70">${it.kind === "audio" ? "🎵" : it.kind === "video" ? "🎞" : "🖼"}</div>`;
            if (it.thumb && it.kind === "image") media = `<img class="max-w-full max-h-[55vh] rounded-xl border border-slate-700 object-contain" src="${it.thumb}" alt="">`;
            else if (it.thumb && it.kind === "video") media = `<div class="max-w-full max-h-[55vh] rounded-xl border border-slate-700 overflow-hidden aspect-video"><img class="w-full h-full object-cover" src="${it.thumb}" alt=""></div>`;
            else if (it.thumb) media = `<img class="max-w-full max-h-[55vh] rounded-xl border border-slate-700 object-contain" src="${it.thumb}" alt="">`;
            host.innerHTML = `
                <div class="fixed inset-0 z-[80] bg-black/90 flex items-center justify-center p-4" onclick="if(event.target===this)fbClosePreview()">
                    <div class="bg-slate-950 border border-slate-700 rounded-2xl p-4 max-w-xl w-full shadow-2xl max-h-[85vh] overflow-y-auto custom-scrollbar">
                        <div class="flex items-center justify-between mb-3">
                            <p class="text-xs font-bold text-emerald-300 truncate max-w-[75%]">🔍 ${escHtml(it.name || "")}</p>
                            <button onclick="fbClosePreview()" class="text-slate-400 hover:text-white text-lg">✕</button>
                        </div>
                        <div class="text-center bg-slate-900/60 rounded-xl p-2 mb-3">${media}</div>
                        <div class="flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-400 bg-slate-900/60 rounded-xl px-3 py-2">
                            <span>النوع: ${it.kind === "audio" ? "🎵 صوت" : it.kind === "video" ? "🎞 فيديو" : "🖼 صورة"}</span>
                            <span>${sizeTxt ? "الحجم: " + sizeTxt : ""}</span>
                            <span>${dateTxt ? "التاريخ: " + dateTxt : ""}</span>
                        </div>
                        <div class="mt-3 text-[9px] text-slate-500 text-center">المعاينة مستخدمة المصغرة المتاحة من الهاتف — الفيديو والصوت يُفتحان كاملاً من الاستوديو (أوضاع كبيرة).</div>
                    </div>
                </div>`;
            void ph;
        }

        function fbClosePreview() {
            const host = document.getElementById('fb-preview-host');
            if (host) host.innerHTML = "";
        }

        // B5 — تمرير آمن لأسماء المجلدات داخل معالجات onclick
        function escAttr(v) { return JSON.stringify(String(v || "")); }

        // B4 — بحث تنبؤي + اقتراحات فورية داخل نافذة اختيار المجلدات
        function filterStudioFolderSearch() {
            const inp = document.getElementById("studio-folder-search");
            studioFolderQuery = inp ? inp.value : "";
            renderStudioFolderPicker(studioLastFoldersList);
            const box = document.getElementById("studio-folder-suggest");
            if (!box) return;
            const q = (studioFolderQuery || '').trim().toLowerCase();
            const suggestions = [];
            if (q) {
                for (const f of (studioLastFoldersList || [])) {
                    const label = String(f.label || f.path || "");
                    if (label.toLowerCase().includes(q) && !suggestions.includes(label)) suggestions.push(label);
                    if (suggestions.length >= 6) break;
                }
            }
            if (suggestions.length > 0) {
                box.innerHTML = suggestions.map(s => `
                    <button onclick="pickStudioSuggestion(this.textContent)" class="w-full text-right px-3 py-1.5 text-[11px] text-slate-200 hover:bg-slate-800 flex items-center gap-2">🔍 ${escHtml(s)}</button>
                `).join("");
                box.classList.remove("hidden");
            } else {
                box.classList.add("hidden");
            }
        }

        function pickStudioSuggestion(labelText) {
            const inp = document.getElementById("studio-folder-search");
            if (inp) inp.value = (labelText || "").replace(/^🔍\s*/, "");
            filterStudioFolderSearch();
            const box = document.getElementById("studio-folder-suggest");
            if (box) box.classList.add("hidden");
        }

        function selectStudioAll() {
            const visible = filteredStudioFolders();
            const cur = new Set((studioPendingSel || []).map(s => s.path));
            visible.forEach(({ f }) => cur.add(f.path));
            studioPendingSel = [...cur].map(p => {
                const found = (studioLastFoldersList || []).find(f => f.path === p);
                return { path: p, label: (found && found.label) || p };
            });
            renderStudioFolderPicker(studioLastFoldersList);
            showToast(`تم تحديد ${visible.length} مجلد مطابق ✓`, 'success');
        }

        function toggleStudioFolder(i) {
            const f = studioLastFoldersList[i];
            if (!f) return;
            const cur = studioPendingSel || [];
            const ix = cur.findIndex(s => s.path === f.path);
            if (ix >= 0) cur.splice(ix, 1); else cur.push({ path: f.path, label: f.label || f.path });
            studioPendingSel = cur;
            const row = document.getElementById("stfd-" + i);
            if (row) {
                const checked = cur.some(s => s.path === f.path);
                const chk = row.querySelector(".stfd-check");
                if (chk) chk.textContent = checked ? "✓" : "";
                row.classList.toggle("border-emerald-500/70", checked);
                row.classList.toggle("bg-emerald-950/30", checked);
                row.classList.toggle("border-slate-800", !checked);
            }
            updateStudioFolderCountText();
        }

        function clearStudioFolders() {
            studioPendingSel = [];
            document.querySelectorAll("#studio-folder-list .stfd-row").forEach(r => {
                const chk = r.querySelector(".stfd-check");
                if (chk) chk.textContent = "";
                r.classList.remove("border-emerald-500/70", "bg-emerald-950/30");
                r.classList.add("border-slate-800");
            });
            updateStudioFolderCountText();
        }

        function updateStudioFolderCountText() {
            const c = document.getElementById("studio-folder-count");
            if (c) c.textContent = ((studioPendingSel || []).length) + " مجلد مختار";
        }

        function saveAndCloseStudioFolders() {
            studioFolders = (studioPendingSel || []).map(x => ({ ...x }));
            saveStudioFolders();
            closeStudioFolderPicker();
            if (typeof studioItems !== "undefined" && studioItems.length === 0) fetchStudioMedia();
            else renderStudioGrid();
        }

        function closeStudioFolderPicker() {
            const m = document.getElementById("studio-folder-modal");
            if (m) m.remove();
        }

        function openStudioPreview(fi) {
            const list = window.__stFiltered || [];
            const it = list[fi];
            if (!it) return;
            let host = document.getElementById("studio-preview-host");
            if (!host) {
                host = document.createElement("div");
                host.id = "studio-preview-host";
                document.body.appendChild(host);
            }
            const icon = it.kind === "audio" ? "🎵" : (it.kind === "video" ? "🎞" : "🖼");
            const kindTxt = it.kind === "image" ? "صورة" : (it.kind === "video" ? "فيديو" : "صوت");
            const body = it.kind === "audio"
                ? `<div class="text-6xl">🎵</div>`
                : `<img id="studio-preview-img" class="max-w-full" style="max-height:62vh" src="${it.thumb || "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"}" alt="">`;
            host.innerHTML = `<div class="fixed inset-0 z-[70] bg-black/85 flex items-center justify-center p-4" onclick="closeStudioPreview()">
                <div class="w-full max-w-lg bg-slate-900 border border-slate-700 rounded-2xl p-3 shadow-2xl" onclick="event.stopPropagation()">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <p class="text-xs text-slate-200 font-bold truncate">${icon} ${escHtml(it.name || "")}</p>
                        <button onclick="closeStudioPreview()" class="text-slate-400 hover:text-white px-2 text-sm">✕</button>
                    </div>
                    <div class="flex items-center justify-center bg-slate-950/60 rounded-xl overflow-hidden" style="min-height:200px">${body}</div>
                    <p class="text-[10px] text-slate-400 mt-2 text-center"><span class="ts-en">${fmtEnTime(it.dateMs || Date.now())}</span> • ${kindTxt}</p>
                </div>
            </div>`;
            if ((it.kind === "image" || it.kind === "video") && !it.thumb) {
                sendRPCCommand("file_thumbnail", { id: it.id, kind: it.kind, size: "large" }, { timeout: 9000 }).then(res => {
                    const url = res && res.thumbnail;
                    const imgEl = document.getElementById("studio-preview-img");
                    if (url && imgEl) imgEl.src = url;
                }).catch(() => {});
            }
        }

        function closeStudioPreview() {
            const h = document.getElementById("studio-preview-host");
            if (h) h.remove();
        }

        // تفعيل افتراضي عند تحميل الصفحة: الفحص التلقائي يعمل مرة واحدة عند البداية
        window.addEventListener("load", () => {
            try {
                setTimeout(() => {
                    if (autoScanGloballyEnabled && !autoDiscoveryIntervalId && typeof autoDiscoverAndConnectHosts === "function") {
                        autoDiscoverAndConnectHosts();
                    }
                    if (typeof applyAutoScanVisual === "function") applyAutoScanVisual();
                }, 1200);
            } catch (_) {}
        });

        // WebRTC Diagnostic State & Live Monitor
        let localCandidatesCount = 0;
        let remoteCandidatesCount = 0;
        let lastCandidateType = "غير محدد";
        let remoteMediaStream = null;

        function updateWebRTCDiagnosticUI() {
            const iceEl = document.getElementById("webrtc-ice-state");
            const iceDot = document.getElementById("webrtc-ice-dot");
            const gatherEl = document.getElementById("webrtc-gather-state");
            const gatherDot = document.getElementById("webrtc-gather-dot");
            const connEl = document.getElementById("webrtc-conn-state");
            const connDot = document.getElementById("webrtc-conn-dot");
            const dcEl = document.getElementById("webrtc-dc-state");
            const dcDot = document.getElementById("webrtc-dc-dot");
            const localEl = document.getElementById("webrtc-local-candidates");
            const remoteEl = document.getElementById("webrtc-remote-candidates");
            const typeEl = document.getElementById("webrtc-candidate-type");
            const hintEl = document.getElementById("webrtc-diag-hint");

            const iceState = pc ? pc.iceConnectionState : "disconnected";
            const gatherState = pc ? pc.iceGatheringState : "new";
            const connState = pc ? pc.connectionState : "new";
            const dcState = dataChannel ? dataChannel.readyState : "closed";

            const stateColors = {
                connected: { text: "text-emerald-400", dot: "bg-emerald-400 shadow-md shadow-emerald-500/50" },
                completed: { text: "text-emerald-400", dot: "bg-emerald-400 shadow-md shadow-emerald-500/50" },
                checking: { text: "text-amber-400 animate-pulse", dot: "bg-amber-400 animate-pulse" },
                gathering: { text: "text-blue-400 animate-pulse", dot: "bg-blue-400 animate-pulse" },
                complete: { text: "text-emerald-400", dot: "bg-emerald-400" },
                open: { text: "text-emerald-400", dot: "bg-emerald-400 shadow-md shadow-emerald-500/50" },
                connecting: { text: "text-blue-400 animate-pulse", dot: "bg-blue-400 animate-pulse" },
                failed: { text: "text-rose-400", dot: "bg-rose-400 shadow-md shadow-rose-500/50" },
                disconnected: { text: "text-orange-400", dot: "bg-orange-400" },
                closed: { text: "text-slate-400", dot: "bg-slate-500" },
                new: { text: "text-slate-400", dot: "bg-slate-500" }
            };

            if (iceEl) {
                iceEl.innerText = iceState;
                const c = stateColors[iceState] || stateColors.new;
                iceEl.className = `font-mono font-bold text-xs ${c.text}`;
                if (iceDot) iceDot.className = `w-2 h-2 rounded-full ${c.dot}`;
            }

            if (gatherEl) {
                gatherEl.innerText = gatherState;
                const c = stateColors[gatherState] || stateColors.new;
                gatherEl.className = `font-mono font-bold text-xs ${c.text}`;
                if (gatherDot) gatherDot.className = `w-2 h-2 rounded-full ${c.dot}`;
            }

            if (connEl) {
                connEl.innerText = connState;
                const c = stateColors[connState] || stateColors.new;
                connEl.className = `font-mono font-bold text-xs ${c.text}`;
                if (connDot) connDot.className = `w-2 h-2 rounded-full ${c.dot}`;
            }

            if (dcEl) {
                dcEl.innerText = dcState;
                const c = stateColors[dcState] || stateColors.closed;
                dcEl.className = `font-mono font-bold text-xs ${c.text}`;
                if (dcDot) dcDot.className = `w-2 h-2 rounded-full ${c.dot}`;
            }

            if (localEl) localEl.innerText = localCandidatesCount;
            if (remoteEl) remoteEl.innerText = remoteCandidatesCount;
            if (typeEl) typeEl.innerText = lastCandidateType;

            // B4 — ملخص السطر الواحد في رأس اللوحة المطوية (يعمل حتى مع التفاصيل مخفية)
            const mini = document.getElementById('p2p-mini-summary');
            if (mini) {
                const isLive = (iceState === 'connected' || iceState === 'completed' || dcState === 'open');
                const label = dcState === 'open' ? 'DC:open' : iceState;
                mini.innerHTML = `<span class="ts-en">${label}</span>`;
                mini.className = 'text-[10px] px-1.5 py-0.5 rounded-md whitespace-nowrap ' + (isLive
                    ? 'bg-emerald-950/80 border border-emerald-500/50'
                    : (iceState === 'checking' ? 'bg-amber-950/80 border border-amber-500/50 animate-pulse'
                        : 'bg-slate-950/80 border border-slate-800'));
            }

            if (hintEl) {
                if (iceState === 'connected' || iceState === 'completed') {
                    hintEl.innerHTML = `<span class="text-emerald-400 font-bold">● اتصال P2P مباشر نشط وبأعلى سرعة ونقل حي</span>`;
                } else if (iceState === 'checking') {
                    hintEl.innerHTML = `<span class="text-amber-400 font-bold animate-pulse">● جارٍ فحص منافذ UDP وتبادل عناوين STUN...</span>`;
                } else if (iceState === 'failed') {
                    hintEl.innerHTML = `<span class="text-rose-400 font-bold">● تعذر الاتصال المباشر (تحقق من UDP/جدار الحماية)</span>`;
                } else {
                    hintEl.innerText = "بانتظار بدء المصافحة أو اختيار الجهاز المضيف";
                }
            }
        }

        // View 1: Dashboard View
        function renderDashboardView() {
            const batteryText = latestDeviceInfo ? `${latestDeviceInfo.batteryLevel}%${latestDeviceInfo.isCharging ? ' (جارٍ الشحن ⚡)' : ' (على البطارية)'}` : 'جارٍ جلب البيانات...';

                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2.5 flex items-center justify-between">

        // View 2: File Explorer View with Thumbnails & Single/Bulk Selection
        let fileSearchQuery = "";
        let fileTypeFilter = "all";
        let fileSortBy = "name";
        let fileSortAsc = true;

        // ============================================================
        //   Phase 2 — التنقل في مستكشف الملفات + أوضاع العرض + مصغرات حقيقية
        // ============================================================
        let filesLoading = false;

        // فتح مجلد جديد بالفعل = إعادة إرسال طلب الاستكشاف (هذا كان الخلل الأساسي)
        function navigateExplorerPath(path) {
            const p = path || '/';
            currentExplorerPath = (p === '/' ? '/' : (p.endsWith('/') ? p : p + '/'));
            filesLoading = true;
            window.__filesViewItems = [];
            renderFilesExplorerView();
            sendRPCCommand('storage_explore', { path: currentExplorerPath }, { timeout: 12000 })
                .catch(() => showToast("تعذر قراءة محتويات المجلد من الهاتف المضيف", "warning"));
        }

        function enterFileFolder(idx) {
            const f = (window.__filesViewItems || [])[idx];
            if (!f) return;
            navigateExplorerPath(currentExplorerPath + f.name + '/');
        }

        function openFileListItem(idx) {
            const f = (window.__filesViewItems || [])[idx];
            if (!f) return;
            if (isDirectory(f)) { enterFileFolder(idx); return; }
            const isImage = (f.mimeType || '').startsWith('image/');
            const isVideo = (f.mimeType || '').startsWith('video/');
            const cached = fileThumbnailCache.get(f.id);
            if ((isImage || isVideo) && cached) {
                openModal(f.name, cached);
            } else if ((isImage || isVideo)) {
                showToast("بانتظار تحميل المصغرة الحقيقية... حاول المعاينة بعد لحظات", "info");
                requestFileThumbnail(f);
            } else {
                showToast("معاينة مباشرة متاحة للصور والفيديوهات فقط حالياً", "info");
            }
        }

        function toggleFileSelectionIdx(idx, checked) {
            const f = (window.__filesViewItems || [])[idx];
            if (f) toggleFileSelection(f.id, checked);
        }

        // زر رأس ترحيل ومسارات القشرة العلوية (Breadcrumbs)
        function breadcrumbHtml(path) {
            const parts = (path || '/').split('/').filter(Boolean);
            let crumb = `<button onclick="navigateExplorerPath('/')" class="text-emerald-400 hover:underline">الرئيسية 🏠</button>`;
            let acc = '';
            parts.forEach(p => {
                acc += p + '/';
                const target = '/' + acc;
                crumb += `<span class="text-slate-600 mx-0.5">/</span><button onclick="navigateExplorerPath('${target.replace(/'/g, "")}')" class="text-emerald-400 hover:underline">${p}</button>`;
            });
            return crumb;
        }

        function renderFilesExplorerView() {
            const panel = document.getElementById("panel-content");
            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-2.5 mb-2.5 border-b border-slate-800 gap-2">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-emerald-300">📁 مستكشف ملفات وذاكرة الهاتف</h2>
                        <p class="text-xs text-slate-400">تصفح مجلدات الجهاز فتحاً مباشراً + معاينة مصغرات حقيقية + تنزيل أرشيف ZIP</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="navigateExplorerPath(currentExplorerPath)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                            <span>جلب البيانات 🔄</span>
                        </button>
                    </div>
                </div>

                <!-- Breadcrumb Path Bar -->
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl px-3 py-1.5 mb-2.5 flex items-center justify-between text-xs font-mono text-emerald-400">
                    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
                        <span class="text-slate-400 font-bold">المسار:</span>
                        ${breadcrumbHtml(currentExplorerPath)}
                    </div>
                    ${currentExplorerPath !== '/' ? `
                        <button onclick="navigateExplorerPath('/')" class="text-[10px] text-amber-400 hover:underline shrink-0">الرئيسية 🏠</button>
                    ` : ''}
                </div>

                <!-- Single / Bulk Selection Bar -->
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 mb-2.5 flex flex-wrap items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-1.5 font-bold text-slate-200 cursor-pointer">
                            <input type="checkbox" id="files-select-all" onchange="toggleSelectAllFiles(this.checked)" class="w-4 h-4 accent-emerald-500 rounded">
                            <span>تحديد الكل</span>
                        </label>
                        <span class="text-[11px] text-emerald-400 font-mono" id="files-selected-count">(0 محدد)</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="downloadSelectedFilesZip()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1 rounded-lg font-bold transition flex items-center gap-1">
                            <span>📦 تنزيل المحدّد (ZIP)</span>
                        </button>
                        <button onclick="clearFilesSelection()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1 rounded-lg font-medium transition">
                            إلغاء التحديد
                        </button>
                    </div>
                </div>

                <!-- Controls -->
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 mb-2.5 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                    <div>
                        <input type="text" id="file-search-input" value="${fileSearchQuery}" oninput="updateFileFilters()" placeholder="بحث بالاسم..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <select id="file-type-select" onchange="updateFileFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="all" ${fileTypeFilter === 'all' ? 'selected' : ''}>كافة الأنواع</option>
                            <option value="folder" ${fileTypeFilter === 'folder' ? 'selected' : ''}>📁 مجلدات</option>
                            <option value="image" ${fileTypeFilter === 'image' ? 'selected' : ''}>🖼️ صور</option>
                            <option value="video" ${fileTypeFilter === 'video' ? 'selected' : ''}>🎬 فيديو</option>
                            <option value="document" ${fileTypeFilter === 'document' ? 'selected' : ''}>📄 مستندات</option>
                        </select>
                    </div>
                    <div>
                        <select id="file-sort-select" onchange="updateFileFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="name" ${fileSortBy === 'name' ? 'selected' : ''}>الاسم</option>
                            <option value="size" ${fileSortBy === 'size' ? 'selected' : ''}>الحجم</option>
                            <option value="date" ${fileSortBy === 'date' ? 'selected' : ''}>التاريخ</option>
                        </select>
                    </div>
                    <div>
                        <button onclick="toggleFileSortDirection()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2 rounded-lg font-bold transition text-[11px]">
                            ${fileSortAsc ? 'تصاعدي ⬆️' : 'تنازلي ⬇️'}
                        </button>
                    </div>
                    ${renderModeButtons('files')}
                </div>

                <!-- Files List Container -->
                <div id="files-list-container" class="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1">
                    <!-- Populated by applyFilesFilterAndSort -->
                </div>
            `;
            applyFilesFilterAndSort();
        }

        function updateFileFilters() {
            const searchEl = document.getElementById("file-search-input");
            const typeEl = document.getElementById("file-type-select");
            const sortEl = document.getElementById("file-sort-select");

            if (searchEl) fileSearchQuery = searchEl.value.trim().toLowerCase();
            if (typeEl) fileTypeFilter = typeEl.value;
            if (sortEl) fileSortBy = sortEl.value;
            applyFilesFilterAndSort();
        }

        function toggleFileSortDirection() {
            fileSortAsc = !fileSortAsc;
            renderFilesExplorerView();
        }

        function toggleSelectAllFiles(checked) {
            selectedFileIds.clear();
            if (checked) {
                filesData.forEach(f => selectedFileIds.add(f.id));
            }
            applyFilesFilterAndSort();
        }

        function toggleFileSelection(id, checked) {
            if (checked) selectedFileIds.add(id);
            else selectedFileIds.delete(id);

            const countEl = document.getElementById("files-selected-count");
            if (countEl) countEl.innerText = `(${selectedFileIds.size} محدد)`;
        }

        function clearFilesSelection() {
            selectedFileIds.clear();
            const selectAllEl = document.getElementById("files-select-all");
            if (selectAllEl) selectAllEl.checked = false;
            applyFilesFilterAndSort();
        }

        function downloadSelectedFilesZip() {
            if (selectedFileIds.size === 0) {
                showToast("يرجى تحديد ملف أو عدة ملفات أولاً لتنزيل أرشيف ZIP", "warning");
                return;
            }
            showToast(`جارٍ تجميع وتنسيق الأرشيف المضغوط (ZIP) لـ ${selectedFileIds.size} ملف...`, "success");
        }

        function applyFilesFilterAndSort() {
            const container = document.getElementById("files-list-container");
            if (!container) return;

            if (filesData.length > 0) filesLoading = false;

            const countEl = document.getElementById("files-selected-count");
            if (countEl) countEl.innerText = `(${selectedFileIds.size} محدد)`;

            if (filesLoading && filesData.length === 0) {
                container.innerHTML = `
                    <div class="p-6 text-center text-xs text-amber-300 bg-slate-900/40 rounded-xl border border-amber-700/40 animate-pulse">
                        ⏳ جارٍ قراءة محتويات المجلد الحية من الهاتف المضيف...
                    </div>
                `;
                return;
            }

            if (filesData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">
                        <div class="text-3xl mb-2">📁</div>
                        <p class="font-bold text-slate-300 text-sm">المجلد فارغ أو لا يمكن قراءته</p>
                        <p class="text-slate-500 mt-1">تأكد من منح إذن الملفات للهاتف المضيف واضغط "جلب البيانات 🔄"</p>
                    </div>
                `;
                return;
            }

            let filtered = filesData.filter(f => {
                const matchesSearch = (f.name || '').toLowerCase().includes(fileSearchQuery);
                const isDir = isDirectory(f);
                const mime = f.mimeType || '';
                let matchesType = true;
                if (fileTypeFilter === 'folder') matchesType = isDir;
                else if (fileTypeFilter === 'image') matchesType = mime.startsWith('image/');
                else if (fileTypeFilter === 'video') matchesType = mime.startsWith('video/');
                else if (fileTypeFilter === 'audio') matchesType = mime.startsWith('audio/');
                else if (fileTypeFilter === 'document') matchesType = mime.includes('pdf') || mime.includes('doc') || mime.includes('zip') || mime.includes('text');
                return matchesSearch && matchesType;
            });

            filtered.sort((a, b) => {
                let comparison = 0;
                if (fileSortBy === 'name') comparison = (a.name || '').localeCompare(b.name || '', 'ar');
                else if (fileSortBy === 'size') comparison = (a.size || 0) - (b.size || 0);
                else if (fileSortBy === 'date') comparison = (a.dateAdded || 0) - (b.dateAdded || 0);
                // المجلدات دائماً أولاً
                const dirDiff = (isDirectory(b) === isDirectory(a)) ? 0 : (isDirectory(b) ? 1 : -1);
                return dirDiff !== 0 ? dirDiff : (fileSortAsc ? comparison : -comparison);
            });

            // المرجع المفهرس للنقر الآمن (بلا حقن نصوص في onclick)
            window.__filesViewItems = filtered;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد ملفات تطابق نتائج البحث المحددة.</div>`;
                return;
            }

            const fileMode = listModes.files || 'details';

            // ===== عرض شبكي بمصغرات حقيقية (صغير/متوسط/كبير) =====
            if (fileMode !== 'details') {
                const gridClass = fileMode === 'small' ? 'files-flex-grid' : `files-flex-grid vm-${fileMode}`;
                let renderedCount = 0;
                container.className = `${gridClass} max-h-[420px] overflow-y-auto custom-scrollbar pr-1 flex-1`;
                container.innerHTML = filtered.map((f, idx) => {
                    const isSelected = selectedFileIds.has(f.id);
                    const isDir = isDirectory(f);
                    const isImage = (f.mimeType || '').startsWith('image/');
                    const isVideo = (f.mimeType || '').startsWith('video/');
                    const cached = fileThumbnailCache.get(f.id);
                    const formattedSize = isDir ? 'مجلد' : ((f.size || 0) > 1048576 ? ((f.size / 1048576).toFixed(1) + ' MB') : ((f.size / 1024).toFixed(1) + ' KB'));

                    let innerVisual;
                    if (isDir) {
                        innerVisual = `<div class="file-thumb-img flex items-center justify-center text-2xl">📁</div>`;
                    } else if ((isImage || isVideo)) {
                        if (cached) {
                            innerVisual = `<img id="thumb-img-${f.id}" src="${cached}" class="file-thumb-img" loading="lazy">`;
                        } else {
                            innerVisual = `<div class="file-thumb-img flex items-center justify-center text-xl ${isVideo ? '🎬' : '🖼️'}" id="thumb-box-${f.id}">${isVideo ? '🎬' : '🖼️'}</div>`;
                            if (renderedCount < 120) { requestFileThumbnail(f); renderedCount++; }
                        }
                    } else {
                        innerVisual = `<div class="file-thumb-img flex items-center justify-center text-2xl">📄</div>`;
                    }

                    return `
                        <div class="file-thumb-card ${isSelected ? 'selected' : ''}" onclick="openFileListItem(${idx})">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleFileSelectionIdx(${idx}, this.checked)" class="file-thumb-select">
                            ${innerVisual}
                            <div class="file-thumb-name">${f.name || ''}</div>
                            <div class="text-[9px] text-slate-500 pb-1 text-center">${formattedSize}</div>
                        </div>
                    `;
                }).join('');
                return;
            }

            // ===== عرض التفاصيل (القائمة الكلاسيكية المصححة) =====
            container.className = 'space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1';
            container.innerHTML = filtered.map((f, idx) => {
                const isSelected = selectedFileIds.has(f.id);
                const isDir = isDirectory(f);
                const isImage = (f.mimeType || '').startsWith('image/');
                const isVideo = (f.mimeType || '').startsWith('video/');
                const cached = fileThumbnailCache.get(f.id);
                const icon = isDir ? '📁' : isImage ? '🖼️' : isVideo ? '🎬' : '📄';
                const formattedSize = isDir ? 'مجلد' : ((f.size || 0) > 1048576 ? ((f.size / 1048576).toFixed(1) + ' MB') : ((f.size / 1024).toFixed(1) + ' KB'));
                const formattedDate = fmtEnDate(f.dateAdded || 0);

                const thumbCell = (isImage || isVideo) && cached
                    ? `<img src="${cached}" class="w-10 h-10 rounded-lg object-cover border border-slate-700/80 cursor-pointer hover:border-emerald-400" onclick="openFileListItem(${idx})">`
                    : `<span class="text-xl shrink-0 cursor-pointer ${isImage || isVideo ? 'hover:scale-125 transition inline-block' : ''}" onclick="openFileListItem(${idx})">${icon}</span>`;

                return `
                    <div class="p-2.5 bg-slate-900/80 hover:bg-slate-800/80 border ${isSelected ? 'border-emerald-500/80 bg-emerald-950/20' : 'border-slate-800'} rounded-xl flex items-center justify-between transition">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleFileSelectionIdx(${idx}, this.checked)" class="w-4 h-4 accent-emerald-500 rounded shrink-0">
                            ${thumbCell}

                        <div class="flex items-center gap-1.5 shrink-0">
                            ${!isDir ? `
                                <button onclick="openFileListItem(${idx})" class="bg-slate-800 text-slate-200 border border-slate-700 px-2 py-1 rounded-lg text-[10px] font-bold">
                                    معاينة 🔍

                                <button onclick="showToast('جارٍ تحميل ' + __filesViewItems[${idx}].name + '...', 'info')" class="bg-emerald-600/30 hover:bg-emerald-600/50 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-lg text-[11px] font-bold transition">

                                    فتح 📂
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // تطبيق سياسة الكتم على عناصر الوسائط في الصفحة
        function applyStreamMuteToElements() {
            try {
                const audioEl = document.getElementById("remote-audio");
                if (!audioEl) return;
                const shouldMute = streamState.audioEnabled !== true;
                audioEl.muted = shouldMute;
                if (!shouldMute) {
                    const p = audioEl.play();
                    if (p && p.catch) p.catch(() => {});
                }
            } catch (e) { console.warn('mute apply failed', e); }
        }

        function toggleScreenStream() {
            if (streamState.active && streamState.mode === 'screen') {
                stopLiveStream();
                return;
            }
            streamState.mode = 'screen';
            streamState.active = false;
            // ☝️ سياسة الكتم الافتراضي: يغلب أي حالة قديمة مهما كانت
            streamState.audioEnabled = false;
            applyStreamMuteToElements();
            sendRPCCommand('start_screen_stream');
            showToast("تم إرسال طلب بدء بث شاشة الجوال المباشرة... (الصوت مكتوم افتراضياً)", "info");
            if (activeTab === 'camera') renderCameraStreamView();
        }

        function toggleLiveCameraStream() {
            if (streamState.active && streamState.mode === 'camera') {
                stopLiveStream();
                return;
            }
            streamState.mode = 'camera';
            streamState.active = false;
            // ☝️ سياسة الكتم الافتراضي حتى لو كانت أيقونة الصوت مفعّلة سابقاً
            streamState.audioEnabled = false;
            applyStreamMuteToElements();
            sendRPCCommand('start_camera_stream', { front: streamState.isFront, audio: true });
            showToast("تم إرسال أمر بدء بث الكاميرا — الصوت مكتوم افتراضياً (انقر مكبر الصوت للتفعيل)", "success");
            if (activeTab === 'camera') renderCameraStreamView();
        }

        function startAudioOnlyStream() {
            if (streamState.active && streamState.mode === 'audio') {
                stopLiveStream();
                return;
            }
            streamState.mode = 'audio';
            streamState.active = false;
            streamState.audioEnabled = true;   // بث الصوت فقط يعمل مفعلاً بشكل طبيعي
            applyStreamMuteToElements();
            sendRPCCommand('start_audio_stream');
            showToast("تم إرسال أمر بدء بث الصوت فقط من الميكروفون", "success");
            if (activeTab === 'camera') renderCameraStreamView();
        }

        function stopLiveStream() {
            sendRPCCommand('stop_camera_stream');
            streamState.active = false;
            streamState.mode = 'none';
            showToast("تم إيقاف كافة وسائل البث المباشر", "info");
            if (activeTab === 'camera') renderCameraStreamView();
        }

        function switchLiveCameraLens() {
            streamState.isFront = !streamState.isFront;
            if (streamState.active && streamState.mode === 'camera') {
                sendRPCCommand('switch_camera');
                showToast(`جاري التبديل إلى الكاميرا: ${streamState.isFront ? 'الأمامية' : 'الخلفية'}...`, "info");
            } else {
                showToast(`الكاميرا المختارة للبث القادم: ${streamState.isFront ? 'الأمامية' : 'الخلفية'}`, "info");
            }
            if (activeTab === 'camera') renderCameraStreamView();
        }

        function toggleLiveAudio() {
            streamState.audioEnabled = !streamState.audioEnabled;

            sendRPCCommand('toggle_audio', { enable: streamState.audioEnabled });
            showToast(`حالة الصوت: ${streamState.audioEnabled ? 'مفعّل' : 'مكتوم'}`, "info");

                    </div>
