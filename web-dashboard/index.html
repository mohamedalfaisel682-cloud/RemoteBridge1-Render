                        <button onclick="contactSortAsc = !contactSortAsc; renderContactsListView();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2 rounded-lg font-bold transition text-[11px]">
                            ${contactSortAsc ? 'تصاعدي ⬆️' : 'تنازلي ⬇️'}
                        </button>
                    </div>
                    ${renderModeButtons('contacts')}
                </div>

                <!-- Contacts Cards Container -->
                <div id="contacts-list-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1">
                    <!-- Populated by applyContactsFilterAndSort -->
                </div>
            `;
            applyContactsFilterAndSort();
        }

        function updateContactFilters() {
            const searchEl = document.getElementById("contact-search-input");
            const sortEl = document.getElementById("contact-sort-select");

            if (searchEl) contactSearchQuery = searchEl.value.trim().toLowerCase();
            if (sortEl) contactSortBy = sortEl.value;
            applyContactsFilterAndSort();
        }

        function applyContactsFilterAndSort() {
            const container = document.getElementById("contacts-list-container");
            if (!container) return;

            if (contactsData.length === 0) {
                container.innerHTML = `
                    <div class="col-span-2 p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">
                        <div class="text-3xl mb-2">📇</div>
                        <p class="font-bold text-slate-300 text-sm">القائمة خالية تماماً من البيانات الافتراضية</p>
                        <p class="text-slate-500 mt-1">اضغط على زر "جلب البيانات 🔄" لجلب جهات اتصال الهاتف المضيف الحقيقية</p>
                    </div>
                `;
                return;
            }

            let filtered = contactsData.filter(c => {
                const matchesName = c.displayName.toLowerCase().includes(contactSearchQuery);
                const matchesPhone = c.phoneNumbers && c.phoneNumbers.some(p => p.includes(contactSearchQuery));
                return matchesName || matchesPhone;
            });

            filtered.sort((a, b) => {
                let comp = 0;
                if (contactSortBy === 'name') comp = a.displayName.localeCompare(b.displayName, 'ar');
                else if (contactSortBy === 'numbers') comp = (a.phoneNumbers ? a.phoneNumbers.length : 0) - (b.phoneNumbers ? b.phoneNumbers.length : 0);
                return contactSortAsc ? comp : -comp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-2 p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد جهات اتصال مطابقة للبحث.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const cMode = listModes.contacts || 'details';
                const nameSize = cMode === 'small' ? 'text-[10px]' : cMode === 'large' ? 'text-base' : 'text-xs';
                const avatarSize = cMode === 'small' ? 'w-7 h-7' : cMode === 'large' ? 'w-12 h-12 text-base' : 'w-9 h-9';
                const pad = cMode === 'small' ? 'p-2' : cMode === 'large' ? 'p-4' : 'p-3';
                return `
                <div class="${pad} bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl flex items-start gap-2.5 transition">
                    <div class="${avatarSize} rounded-full bg-emerald-600/20 border border-emerald-500/30 flex items-center justify-center text-emerald-300 font-bold text-xs shrink-0">
                        ${c.displayName ? c.displayName.charAt(0) : '?'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="${nameSize} font-bold text-slate-100 truncate">${escHtml(c.displayName || '')}</p>
                        <div class="mt-1 space-y-0.5">
                            ${c.phoneNumbers ? c.phoneNumbers.map(p => `
                                <div class="flex items-center justify-between text-[11px] font-mono text-slate-400">
                                    <span>${escHtml(p)}</span>
                                    <button onclick="navigator.clipboard.writeText('${p}'); showToast('تم نسخ الرقم: ${p}', 'info');" class="text-emerald-400 hover:text-emerald-300 text-[10px]">نسخ 📋</button>
                                </div>
                            `).join('') : ''}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // View 5: SMS Messages List View
        let smsSearchQuery = "";
        let smsFilterType = "all";
        let smsSortBy = "date";
        let smsSortAsc = false;

        // ============================================================
        //    Phase 2 — الرسائل مجمّعة بجهة الاتصال + نافذة الدردشة
        // ============================================================
        function escHtml(str) {
            return String(str === undefined || str === null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function buildSmsThreads() {
            const threads = {};
            smsData.forEach(s => {
                const key = normNum(s.address) || ('mid' + s.id);
                if (!threads[key]) threads[key] = { key: key, address: s.address || '', messages: [] };
                threads[key].messages.push(s);
            });
            return Object.values(threads).map(t => {
                t.name = ((t.messages.find(m => m.contactName) || {}).contactName) || resolveContactName(t.address);
                t.messages.sort((a, b) => (a.date || 0) - (b.date || 0));
                const last = t.messages[t.messages.length - 1] || {};
                t.last = last.body || '';
                t.lastDate = last.date || 0;
                t.count = t.messages.length;
                t.lastIncoming = last.type !== 2;
                return t;
            });
        }

        function filterSmsThreads(threads) {
            if (!smsSearchQuery) return threads;
            return threads.filter(t =>
                (t.name || '').toLowerCase().includes(smsSearchQuery) ||
                (t.address || '').toLowerCase().includes(smsSearchQuery) ||
                (t.last || '').toLowerCase().includes(smsSearchQuery)
            );
        }

        // إغلاق النوافذ العلوية (دردشة/مجموعة إشعارات)
        function closeWindowOverlay() {
            const el = document.getElementById('overlay-live-window');
            if (el) el.remove();
            document.removeEventListener('keydown', window.__overlayEscHandler || (() => {}));
            window.__overlayEscHandler = null;
            window.__rbChatRailTarget = null;
        }

        // B9 — تنقّل نافذة الدردشة (بداية/سابق/تالي/نهاية) بأسلوب تطبيقات الدردشة الحديثة
        function rbChatRailScroll(dir) {
            const body = window.__rbChatRailTarget;
            if (!body) return;
            const page = Math.max(140, body.clientHeight * 0.8);
            if (dir === 'top') body.scrollTo({ top: 0, behavior: 'smooth' });
            else if (dir === 'bottom') body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
            else if (dir === 'up') body.scrollBy({ top: -page, behavior: 'smooth' });
            else body.scrollBy({ top: page, behavior: 'smooth' });
        }
        // B9 — طيّ الرسائل الطويلة: 10 أسطر + زر «إظهار الكل» أسفل السطور
        function rbChatRailClampLongMessages(body) {
            try {
                body.querySelectorAll('.bubble').forEach(b => {
                    if (b.querySelector('.rb-more-btn')) return;
                    let span = null;
                    for (const n of Array.from(b.childNodes)) {
                        if (n.nodeType === 3 && (n.textContent || '').trim()) {
                            if (!span) span = document.createElement('span');
                            span.appendChild(n.cloneNode(true));
                            n.remove();
                        }
                    }
                    if (!span) return;
                    b.insertBefore(span, b.querySelector('.bubble-time'));
                    const st = getComputedStyle(span);
                    const lh = parseFloat(st.lineHeight) || (parseFloat(st.fontSize) || 13) * 1.65;
                    // عناصر السطر (display:inline) تعيد scrollHeight=0 في Chrome — نعتمد الارتفاع الحقيقي من getBoundingClientRect
                    const naturalH = Math.max(span.scrollHeight, span.getBoundingClientRect().height);
                    if (naturalH > lh * 10 + 10) {
                        span.classList.add('rb-msg-clamped', 'rb-msg-fade');
                        const btn = document.createElement('button');
                        btn.className = 'rb-more-btn';
                        btn.type = 'button';
                        btn.textContent = 'إظهار الكل ▾';
                        btn.setAttribute('onclick', 'rbMsgToggle(this)');
                        b.insertBefore(btn, b.querySelector('.bubble-time'));
                    }
                });
            } catch (_) {}
        }
        function rbMsgToggle(btn) {
            try {
                const span = btn.previousElementSibling;
                if (!span) return;
                const clamped = span.classList.toggle('rb-msg-clamped');
                span.classList.toggle('rb-msg-fade', clamped);
                btn.textContent = clamped ? 'إظهار الكل ▾' : 'طَيّ ▴';
            } catch (_) {}
        }

        function mountWindowOverlay(innerHtml) {
            closeWindowOverlay();
            const wrap = document.createElement('div');
            wrap.id = 'overlay-live-window';
            wrap.className = 'overlay-window';
            wrap.innerHTML = `
                <div class="chat-window">${innerHtml}
                    <div class="text-center text-[10px] text-slate-500 pb-2">نافذة معاينة حية من هاتف المضيف — لا يُرسل من هنا في هذه المرحلة</div>
                </div>
            `;
            wrap.addEventListener('click', (e) => { if (e.target === wrap) closeWindowOverlay(); });
            document.body.appendChild(wrap);
            // B9 — شريط تنقّل جانبي (بداية/سابق/تالي/نهاية) + طيّ الرسائل الطويلة — يُخصّ نكل نوافذ الدردشة تلقائياً
            try {
                const winW = wrap.querySelector('.chat-window');
                const bodyW = wrap.querySelector('.chat-body');
                if (winW && bodyW) {
                    winW.classList.add('rb-rail-ready');
                    const rail = document.createElement('div');
                    rail.className = 'rb-chat-rail';
                    rail.innerHTML = '<button onclick="rbChatRailScroll(\'top\')" title="بداية الدردشة">⏮️</button>' +
                        '<button onclick="rbChatRailScroll(\'up\')" title="انتقال للأعلى (صفحة)">⬆️</button>' +
                        '<button onclick="rbChatRailScroll(\'down\')" title="انتقال للأسفل (صفحة)">⬇️</button>' +
                        '<button onclick="rbChatRailScroll(\'bottom\')" title="نهاية الدردشة">⏭️</button>';
                    winW.appendChild(rail);
                    rbChatRailClampLongMessages(bodyW);
                    window.__rbChatRailTarget = bodyW;
                    bodyW.scrollTop = 0;
                }
            } catch (_) {}
            window.__overlayEscHandler = (e) => { if (e.key === 'Escape') closeWindowOverlay(); };
            document.addEventListener('keydown', window.__overlayEscHandler);
        }

        // نافذة الدردشة المتقدمة لخيوط الرسائل
        function openSmsChatWindow(key) {
            const thread = (window.__smsThreads || []).find(t => t.key === key);
            if (!thread) { showToast("انتهت صلاحية هذه المحادثة — أعد جلب الرسائل", "warning"); return; }
            const title = thread.name || thread.address || 'محادثة';
            const sub = thread.name ? (thread.address || '') : '';
            // B4 — فقاعات شبيه واتساب: فواصل أيام + تسمية الواردة/الصادرة + بصمة وقت إنجليزية واضحة
            const bubbles = (() => {
                let html = '';
                let prevDay = '';
                for (const m of thread.messages) {
                    const ms = Number(m.date) || Date.now();
                    const dKey = fmtEnDate(ms);
                    if (dKey !== prevDay) {
                        html += `<div class="flex justify-center w-full"><span class="ts-date-sep"><span class="ts-en">${escHtml(dKey)}</span> — ${escHtml(fmtEnDateLabel(ms))}</span></div>`;
                        prevDay = dKey;
                    }
                    const incoming = m.type !== 2;
                    html += `
                        <div class="bubble-wrap ${incoming ? 'in' : 'out'}">
                            <div class="bubble ${incoming ? 'in' : 'out'}">
                                <span class="text-[9px] font-bold ${incoming ? 'text-blue-300' : 'text-emerald-300'} mb-1 block" title="${incoming ? 'رسالة مستلمة' : 'رسالة مرسلة'}">${incoming ? '📥 واردة' : '📤 صادرة'}</span>
                                ${escHtml(m.body)}
                                <div class="bubble-time"><span class="ts-en ${incoming ? 'on-slate' : 'on-green'}">${fmtEnTime(m.date || Date.now())}</span></div>
                            </div>
                        </div>
                    `;
                }
                return html;
            })();

            mountWindowOverlay(`
                <div class="chat-header">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-9 h-9 rounded-full bg-emerald-600/25 border border-emerald-500/50 flex items-center justify-center text-sm font-bold text-emerald-300 shrink-0">${escHtml((title || '؟').charAt(0))}</div>
                        <div class="min-w-0">
                            <p class="text-sm font-bold text-slate-100 truncate">${escHtml(title)}</p>
                            ${sub ? `<p class="text-[10px] font-mono text-slate-500 truncate">${escHtml(sub)}</p>` : ''}
                        </div>
                    </div>
                    <button onclick="closeWindowOverlay()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-rose-600/80 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-sm font-bold transition">✕</button>
                </div>
                <div class="chat-body custom-scrollbar" id="chat-body-scroll">${bubbles || '<p class="text-center text-xs text-slate-500">لا توجد رسائل في هذه المحادثة</p>'}</div>
                <div class="chat-input-row">
                    <input type="text" disabled placeholder="الرد عبر الهاتف المضيف (قيد التنصيب في مرحلة قادمة)" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-500 focus:outline-none">
                    <button disabled class="bg-slate-800 text-slate-500 border border-slate-700 rounded-xl px-3 py-2 text-xs font-bold cursor-not-allowed">إرسال ➤</button>
                </div>
            `);
            const body = document.getElementById('chat-body-scroll');
            if (body) body.scrollTop = body.scrollHeight;
        }

        function renderSmsListView() {
            const panel = document.getElementById("panel-content");
            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-2.5 mb-2.5 border-b border-slate-800 gap-2">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-emerald-300">💬 الرسائل القصيرة (SMS)</h2>
                        <p class="text-xs text-slate-400">مجمّعة حسب جهة الاتصال المحفوظة — انقر محادثة للفتح كنافذة دردشة</p>
                    </div>
                    <button onclick="sendRPCCommand('sms_list'); showToast('جاري طلب جلب قائمة الرسائل النصية...', 'info');" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                        <span>جلب البيانات 🔄</span>
                    </button>
                </div>

                <!-- Controls -->
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 mb-2.5 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                    <div>
                        <input type="text" id="sms-search-input" value="${smsSearchQuery}" oninput="updateSmsFilters()" placeholder="بحث بالنص..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <select id="sms-type-select" onchange="updateSmsFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="all" ${smsFilterType === 'all' ? 'selected' : ''}>كافة الرسائل</option>
                            <option value="incoming" ${smsFilterType === 'incoming' ? 'selected' : ''}>📩 واردة</option>
                            <option value="outgoing" ${smsFilterType === 'outgoing' ? 'selected' : ''}>📤 صادرة</option>
                        </select>
                    </div>
                    <div>
                        <select id="sms-sort-select" onchange="updateSmsFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="date" ${smsSortBy === 'date' ? 'selected' : ''}>التاريخ</option>
                            <option value="sender" ${smsSortBy === 'sender' ? 'selected' : ''}>المرسل</option>
                        </select>
                    </div>
                    <div>
                        <button onclick="smsSortAsc = !smsSortAsc; renderSmsListView();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2 rounded-lg font-bold transition text-[11px]">
                            ${smsSortAsc ? 'الأقدم أولاً ⬆️' : 'الأحدث أولاً ⬇️'}
                        </button>
                    </div>
                    ${renderModeButtons('sms')}
                </div>

                <!-- Messages List -->
                <div id="sms-list-container" class="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1">
                    <!-- Populated by applySmsFilterAndSort -->
                </div>
            `;
            applySmsFilterAndSort();
        }

        function updateSmsFilters() {
            const searchEl = document.getElementById("sms-search-input");
            const typeEl = document.getElementById("sms-type-select");
            const sortEl = document.getElementById("sms-sort-select");

            if (searchEl) smsSearchQuery = searchEl.value.trim().toLowerCase();
            if (typeEl) smsFilterType = typeEl.value;
            if (sortEl) smsSortBy = sortEl.value;
            applySmsFilterAndSort();
        }

        function applySmsFilterAndSort() {
            const container = document.getElementById("sms-list-container");
            if (!container) return;

            if (smsData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">
                        <div class="text-3xl mb-2">💬</div>
                        <p class="font-bold text-slate-300 text-sm">صندوق الرسائل خالي حالياً</p>
                        <p class="text-slate-500 mt-1">قم بالاتصال بالهاتف المضيف والضغط على "جلب البيانات 🔄" لمزامنة الرسائل</p>
                    </div>
                `;
                return;
            }

            const smsMode = listModes.sms || 'threads';

            // ===== وضع المحادثات المجمّعة (الافتراضي الجديد) =====
            if (smsMode === 'threads') {
                window.__smsThreads = filterSmsThreads(buildSmsThreads()).sort((a, b) => (b.lastDate || 0) - (a.lastDate || 0));
                if (window.__smsThreads.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد محادثات مطابقة للبحث.</div>`;
                    return;
                }
                container.innerHTML = window.__smsThreads.map((t, idx) => `
                    <div onclick="openSmsChatWindow('${t.key.replace(/'/g, "")}')" class="p-3 bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl transition cursor-pointer group">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-full bg-emerald-600/25 border border-emerald-500/40 flex items-center justify-center text-xs font-bold text-emerald-300 shrink-0">${escHtml((t.name || t.address || '؟').charAt(0))}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-2">
                                    <p class="text-xs font-bold text-slate-100 truncate">${escHtml(t.name || t.address || 'غير معروف')}</p>
                                    <span class="text-[9px] shrink-0"><span class="ts-en">${fmtEnTime(t.lastDate || 0)}</span></span>
                                </div>
                                <div class="flex items-center justify-between gap-2 mt-0.5">
                                    <p class="text-[11px] text-slate-400 truncate">${t.lastIncoming ? '' : '📤 '}${escHtml((t.last || '').slice(0, 80))}</p>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-emerald-950 border border-emerald-600/50 text-emerald-300 font-bold shrink-0">${t.count} رسالة</span>
                                </div>
                            </div>
                            <span class="text-slate-600 group-hover:text-emerald-400 transition shrink-0">‹</span>
                        </div>
                    </div>
                `).join('');
                return;
            }

            // ===== أوضاع القائمة الموحدة (تفاصيل/صغير/متوسط/كبير) =====
            let filtered = smsData.filter(s => {
                const matchesSearch = (s.body || '').toLowerCase().includes(smsSearchQuery) || (s.address || '').includes(smsSearchQuery) || ((s.contactName || '').toLowerCase().includes(smsSearchQuery));
                let matchesType = true;
                if (smsFilterType === 'incoming') matchesType = s.type === 1;
                else if (smsFilterType === 'outgoing') matchesType = s.type === 2;
                return matchesSearch && matchesType;
            });

            filtered.sort((a, b) => {
                let comp = 0;
                if (smsSortBy === 'date') comp = (a.date || 0) - (b.date || 0);
                else if (smsSortBy === 'sender') comp = (resolveContactName(a.address) || a.address || '').localeCompare(resolveContactName(b.address) || b.address || '');
                return smsSortAsc ? comp : -comp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد رسائل مطابقة.</div>`;
                return;
            }

            container.innerHTML = filtered.map((s, idx) => {
                const isIncoming = s.type === 1;
                const dateStr = fmtEnTime(s.date || 0);
                const threadKey = normNum(s.address) || ('mid' + s.id);
                const contactName = s.contactName || resolveContactName(s.address);
                const textSize = smsMode === 'small' ? 'text-[10px]' : smsMode === 'large' ? 'text-sm' : 'text-xs';
                const pad = smsMode === 'small' ? 'p-2' : smsMode === 'large' ? 'p-4' : 'p-3';
                return `
                    <div class="${pad} bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl transition">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-bold ${isIncoming ? 'bg-emerald-950 border border-emerald-500/30 text-emerald-300' : 'bg-blue-950 border border-blue-500/30 text-blue-300'} shrink-0">
                                    ${isIncoming ? '📩 واردة' : '📤 صادرة'}
                                </span>
                                <span class="text-xs font-bold text-slate-200 truncate">${escHtml(contactName || s.address || 'غير معروف')}</span>
                            </div>
                            <span class="text-[10px] shrink-0"><span class="ts-en">${dateStr}</span></span>
                        </div>
                        <div class="flex items-start justify-between gap-2">
                            <p class="${textSize} text-slate-300 leading-relaxed bg-slate-950/40 p-2 rounded-lg border border-slate-800/60 flex-1 min-w-0">${escHtml(s.body || '')}</p>
                            <button onclick="openSmsChatWindow('${threadKey.replace(/'/g, "")}')" class="${smsMode === 'small' ? 'text-[9px]' : 'text-[10px]'} bg-emerald-600/25 hover:bg-emerald-600/45 text-emerald-300 border border-emerald-500/30 px-2 py-1 rounded-lg font-bold shrink-0 transition">دردشة 💬</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View 6: Call Logs View
        let callSearchQuery = "";
        let callTypeFilter = "all";
        let callSortBy = "date";
        let callSortAsc = false;
        let callsPermissionWarning = "";

        function renderCallsListView() {
            const panel = document.getElementById("panel-content");
            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-2.5 mb-2.5 border-b border-slate-800 gap-2">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-emerald-300">📞 سجل المكالمات</h2>
                        <p class="text-xs text-slate-400">سجل المكالمات الواردة والصادرة والفائتة الحية</p>
                    </div>
                    <button onclick="sendRPCCommand('calls_list'); showToast('جاري طلب جلب سجل المكالمات...', 'info');" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                        <span>جلب البيانات 🔄</span>
                    </button>
                </div>

                <!-- Controls -->
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 mb-2.5 grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                    <div>
                        <input type="text" id="call-search-input" value="${callSearchQuery}" oninput="updateCallFilters()" placeholder="بحث بالاسم أو الرقم..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <select id="call-type-select" onchange="updateCallFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="all" ${callTypeFilter === 'all' ? 'selected' : ''}>كافة المكالمات</option>
                            <option value="1" ${callTypeFilter === '1' ? 'selected' : ''}>🟢 واردة</option>
                            <option value="2" ${callTypeFilter === '2' ? 'selected' : ''}>🔵 صادرة</option>
                            <option value="3" ${callTypeFilter === '3' ? 'selected' : ''}>🔴 فائتة</option>
                        </select>
                    </div>
                    <div>
                        <select id="call-sort-select" onchange="updateCallFilters()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="date" ${callSortBy === 'date' ? 'selected' : ''}>التاريخ</option>
                            <option value="duration" ${callSortBy === 'duration' ? 'selected' : ''}>المدة</option>
                        </select>
                    </div>
                    <div>
                        <button onclick="callSortAsc = !callSortAsc; renderCallsListView();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2 rounded-lg font-bold transition text-[11px]">
                            ${callSortAsc ? 'الأقدم أولاً ⬆️' : 'الأحدث أولاً ⬇️'}
                        </button>
                    </div>
                    ${renderModeButtons('calls')}
                </div>

                <!-- Call Logs List -->
                <div id="calls-list-container" class="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1">
                    <!-- Populated by applyCallFilters -->
                </div>
            `;
            applyCallFilters();
        }

        function updateCallFilters() {
            const searchEl = document.getElementById("call-search-input");
            const typeEl = document.getElementById("call-type-select");
            const sortEl = document.getElementById("call-sort-select");

            if (searchEl) callSearchQuery = searchEl.value.trim().toLowerCase();
            if (typeEl) callTypeFilter = typeEl.value;
            if (sortEl) callSortBy = sortEl.value;
            applyCallFilters();
        }

        function applyCallFilters() {
            const container = document.getElementById("calls-list-container");
            if (!container) return;

            if (callsData.length === 0 && callsPermissionWarning) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-amber-300 bg-amber-950/30 rounded-xl border border-amber-700/50">
                        <div class="text-3xl mb-2">⛔</div>
                        <p class="font-bold text-amber-200 text-sm">إذن قراءة سجل المكالمات غير ممنوح على الهاتف المضيف</p>
                        <p class="text-amber-400/80 mt-1">${escHtml(callsPermissionWarning)}</p>
                        <p class="text-amber-400/60 mt-2">افتح تطبيق "الجسر" على الهاتف المضيف → معالج الأذونات → اسمح بـ "سجل المكالمات" ثم أعد "جلب البيانات 🔄"</p>
                    </div>
                `;
                return;
            }

            if (callsData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">
                        <div class="text-3xl mb-2">📞</div>
                        <p class="font-bold text-slate-300 text-sm">سجل المكالمات فارغ لا يحتوي بيانات افتراضية</p>
                        <p class="text-slate-500 mt-1">اضغط على "جلب البيانات 🔄" لقراءة سجلات المكالمات الفعلية من الهاتف</p>
                    </div>
                `;
                return;
            }

            let filtered = callsData.filter(c => {
                const matchesSearch = String(c.number || '').includes(callSearchQuery) || String(c.name || '').toLowerCase().includes(callSearchQuery) || String(resolveContactName(c.number) || '').toLowerCase().includes(callSearchQuery);
                let matchesType = true;
                if (callTypeFilter !== 'all') matchesType = String(c.type) === callTypeFilter;
                return matchesSearch && matchesType;
            });

            filtered.sort((a, b) => {
                let comp = 0;
                if (callSortBy === 'date') comp = (a.date || 0) - (b.date || 0);
                else if (callSortBy === 'duration') comp = (a.durationSec || 0) - (b.durationSec || 0);
                return callSortAsc ? comp : -comp;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد مكالمات مطابقة.</div>`;
                return;
            }

            container.innerHTML = filtered.map(c => {
                const typeVal = Number(c.type);
                const badge = typeVal === 1 ? '🟢 واردة' : typeVal === 2 ? '🔵 صادرة' : typeVal === 3 ? '🔴 فائتة' : typeVal === 4 ? '🔴 مرفوضة' : typeVal === 5 ? '🟡 ردّ' : '📞 مكالمة';
                const dur = c.durationSec || 0;
                const formattedDuration = dur > 0 ? `${Math.floor(dur / 60)}د ${dur % 60}ث` : 'لم يتم الرد';
                const dateStr = fmtEnTime(c.date || 0);
                const displayName = c.name || resolveContactName(c.number) || c.number || 'غير معروف';

                return `
                    <div class="p-2.5 bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl flex items-center justify-between transition">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <span class="text-[10px] px-2 py-0.5 rounded font-bold bg-slate-950 border border-slate-800 shrink-0">${badge}</span>
                            <div class="min-w-0">
                                <p class="text-xs font-bold text-slate-200 truncate">${escHtml(displayName)}</p>
                                <p class="text-[10px] truncate"><span class="ts-en">${dateStr}</span>${c.number && c.number !== displayName ? ' • ' + escHtml(c.number) : ''}</p>
                            </div>
                        </div>
                        <span class="text-[11px] font-mono text-emerald-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800 shrink-0">${formattedDuration}</span>
                    </div>
                `;
            }).join('');
        }

        // View 7: Notifications List View
        let notifSearchQuery = "";
        let notifSortAsc = false;

        // ============================================================
        //      Phase 2 — الإشعارات مجمّعة حسب التطبيق + نافذة تزلج
        // ============================================================
        function buildNotifGroups() {
            const groups = {};
            notificationsData.forEach(n => {
                const pkg = n.packageName || 'unknown';
                if (!groups[pkg]) groups[pkg] = { packageName: pkg, items: [] };
                groups[pkg].items.push(n);
            });
            return Object.values(groups).map(g => {
                g.items.sort((a, b) => (b.postTime || 0) - (a.postTime || 0));
                g.count = g.items.length;
                g.latest = g.items[0] || { title: '', text: '', postTime: 0 };
                g.friendly = packageNameFriendly[g.packageName] || g.packageName;
                return g;
            });
        }

        function filterNotifGroups(groups) {
            if (!notifSearchQuery) return groups;
            return groups.filter(g =>
                (g.friendly || '').toLowerCase().includes(notifSearchQuery) ||
                (g.packageName || '').toLowerCase().includes(notifSearchQuery) ||
                g.items.some(n => (n.title || '').toLowerCase().includes(notifSearchQuery) || (n.text || '').toLowerCase().includes(notifSearchQuery))
            );
        }

        function openNotifGroupWindow(pkg) {
            const group = (window.__notifGroups || []).find(g => g.packageName === pkg);
            if (!group) { showToast("انتهت صلاحية هذه المجموعة — أعد جلب الإشعارات", "warning"); return; }
            const rows = group.items.map(n => `
                <div class="p-3 bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl transition">
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="text-sm shrink-0">🔔</span>
                            <p class="text-xs font-bold text-slate-100 truncate">${escHtml(n.title || '')}</p>
                        </div>
                        <span class="text-[10px] shrink-0"><span class="ts-en">${fmtEnTime(n.postTime || 0)}</span></span>
                    </div>
                    <p class="text-xs text-slate-300 leading-relaxed pr-5">${escHtml(n.text || '')}</p>
                </div>
            `).join('');

            mountWindowOverlay(`
                <div class="chat-header">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-9 h-9 rounded-full bg-amber-600/25 border border-amber-500/50 flex items-center justify-center text-sm shrink-0">🔔</div>
                        <div class="min-w-0">
                            <p class="text-sm font-bold text-slate-100 truncate">${escHtml(group.friendly || pkg)}</p>
                            <p class="text-[10px] font-mono text-slate-500 truncate">${escHtml(pkg)} • ${group.count} إشعار</p>
                        </div>
                    </div>
                    <button onclick="closeWindowOverlay()" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-rose-600/80 border border-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-sm font-bold transition">✕</button>
                </div>
                <div class="chat-body custom-scrollbar" style="gap: 8px;">
                    ${rows || '<p class="text-center text-xs text-slate-500">لا توجد إشعارات</p>'}
                </div>
            `);
        }

        function renderNotificationsListView() {
            const panel = document.getElementById("panel-content");
            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-2.5 mb-2.5 border-b border-slate-800 gap-2">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-emerald-300">🔔 الإشعارات الحية</h2>
                        <p class="text-xs text-slate-400">مجمّعة حسب التطبيق — انقر المجموعة لفتح نافذة إشعاراتها كاملة</p>
                    </div>
                    <button onclick="sendRPCCommand('notifications_list'); showToast('جاري جلب إشعارات المضيف الحية...', 'info');" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                        <span>جلب البيانات 🔄</span>
                    </button>
                </div>

                <!-- Search Controls -->
                <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 mb-2.5 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <div>
                        <input type="text" id="notif-search-input" value="${notifSearchQuery}" oninput="notifSearchQuery = this.value.trim().toLowerCase(); applyNotifFilters();" placeholder="بحث في محتوى الإشعارات..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <button onclick="notifSortAsc = !notifSortAsc; renderNotificationsListView();" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1 px-2 rounded-lg font-bold transition text-[11px]">
                            ${notifSortAsc ? 'الأقدم أولاً ⬆️' : 'الأحدث أولاً ⬇️'}
                        </button>
                    </div>
                    ${renderModeButtons('notifications')}
                </div>

                <!-- Notifications List -->
                <div id="notifs-list-container" class="space-y-2 max-h-[350px] overflow-y-auto custom-scrollbar pr-1 flex-1">
                    <!-- Populated by applyNotifFilters -->
                </div>
            `;
            applyNotifFilters();
        }

        function applyNotifFilters() {
            const container = document.getElementById("notifs-list-container");
            if (!container) return;

            if (notificationsData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">
                        <div class="text-3xl mb-2">🔔</div>
                        <p class="font-bold text-slate-300 text-sm">لا توجد إشعارات مسجلة حالياً</p>
                        <p class="text-slate-500 mt-1">تأكد من تفعيل إذن المستمع في هاتف المضيف واضغط على "جلب البيانات 🔄"</p>
                    </div>
                `;
                return;
            }

            const notifMode = listModes.notifications || 'groups';

            // ===== وضع المجموعات حسب التطبيق (الافتراضي الجديد) =====
            if (notifMode === 'groups') {
                window.__notifGroups = filterNotifGroups(buildNotifGroups());
                if (window.__notifGroups.length === 0) {
                    container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد إشعارات مطابقة للبحث.</div>`;
                    return;
                }
                container.innerHTML = window.__notifGroups.map(g => `
                    <div onclick="openNotifGroupWindow('${(g.packageName || '').replace(/'/g, "")}')" class="p-3 bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl transition cursor-pointer group">
                        <div class="flex items-center gap-2.5">
                            <div class="w-9 h-9 rounded-full bg-amber-600/25 border border-amber-500/40 flex items-center justify-center text-base shrink-0">🔔</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between gap-2">
                                    <p class="text-xs font-bold text-slate-100 truncate">${escHtml(g.friendly || g.packageName)}</p>
                                    <span class="text-[9px] shrink-0"><span class="ts-en">${fmtEnTime(g.latest.postTime || 0)}</span></span>
                                </div>
                                <div class="flex items-center justify-between gap-2 mt-0.5">
                                    <p class="text-[11px] text-slate-400 truncate">${escHtml((g.latest.title || '') + ' — ' + (g.latest.text || '')).slice(0, 90)}</p>
                                    <span class="text-[9px] px-1.5 py-0.5 rounded-full bg-amber-950 border border-amber-600/50 text-amber-300 font-bold shrink-0">${g.count} إشعار</span>
                                </div>
                            </div>
                            <span class="text-slate-600 group-hover:text-amber-400 transition shrink-0">‹</span>
                        </div>
                    </div>
                `).join('');
                return;
            }

            // ===== الأوضاع المسطحة (تفاصيل/صغير/متوسط/كبير) =====
            let filtered = notificationsData.filter(n => {
                return (n.title || '').toLowerCase().includes(notifSearchQuery) || (n.text || '').toLowerCase().includes(notifSearchQuery) || (n.packageName || '').toLowerCase().includes(notifSearchQuery);
            });

            filtered.sort((a, b) => notifSortAsc ? (a.postTime || 0) - (b.postTime || 0) : (b.postTime || 0) - (a.postTime || 0));

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-500 bg-slate-900/40 rounded-xl border border-slate-800">لا توجد إشعارات مطابقة.</div>`;
                return;
            }

            container.innerHTML = filtered.map(n => {
                const dateStr = fmtEnTime(n.postTime || 0);
                const tSize = notifMode === 'small' ? 'text-[10px]' : notifMode === 'large' ? 'text-sm' : 'text-xs';
                const pad = notifMode === 'small' ? 'p-2' : notifMode === 'large' ? 'p-4' : 'p-3';
                const friendly = packageNameFriendly[n.packageName] || n.packageName || 'unknown';
                return `
                    <div class="${pad} bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800 rounded-xl transition">
                        <div class="flex items-center justify-between mb-1">
                            <div class="flex items-center gap-1.5 min-w-0">
                                <span class="text-sm shrink-0">🔔</span>
                                <p class="${notifMode === 'large' ? 'text-sm' : 'text-xs'} font-bold text-slate-100 truncate">${escHtml(n.title || '')}</p>
                                <span class="text-[9px] font-mono text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded truncate shrink-0">${escHtml(friendly)}</span>
                            </div>
                            <span class="text-[10px] shrink-0"><span class="ts-en">${dateStr}</span></span>
                        </div>
                        <p class="${tSize} text-slate-300 leading-relaxed pr-5">${escHtml(n.text || '')}</p>
                    </div>
                `;
            }).join('');
        }

        // View 8: Settings View
        function renderSettingsView() {
            return `
                <div class="pb-2.5 mb-2.5 border-b border-slate-800">
                    <h2 class="text-lg md:text-xl font-bold text-emerald-300">⚙️ إعدادات الربط والخيارات السريعة</h2>
                    <p class="text-xs text-slate-400 mt-0.5">تخصيص عناوين السيرفر وحفظ البيانات تلقائياً</p>
                </div>

                <div class="space-y-3.5 max-w-xl text-xs">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">عنوان خادم الإشارات (Signaling Server URL):</label>
                        <input type="text" id="cfg-server-url" oninput="saveWebSettings(true)" value="${appConfig.serverUrl}" placeholder="ws://<Local-IP>:10000/ws أو wss://..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono focus:outline-none focus:border-emerald-500 transition">
                        
                        <div class="grid grid-cols-3 gap-2 mt-2">
                            <button onclick="setPreset('render')" class="text-[10px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700/80 px-2 py-1.5 rounded-xl text-purple-300 transition">
                                ☁️ Render
                            </button>
                            <button onclick="setPreset('fly')" class="text-[10px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700/80 px-2 py-1.5 rounded-xl text-emerald-300 transition">
                                🌐 Fly.io
                            </button>
                            <button onclick="setPreset('local')" class="text-[10px] font-bold bg-slate-800 hover:bg-slate-700 border border-slate-700/80 px-2 py-1.5 rounded-xl text-amber-300 transition">
                                💻 محلي LAN
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">اسم جهاز الويب (Dashboard Name):</label>
                        <input type="text" id="cfg-device-name" oninput="saveWebSettings(true)" value="${appConfig.deviceName}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">بروفايلات وأنماط نقل البيانات والاتصال:</label>
                        <select id="cfg-profile" onchange="setConnectionProfile(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                            <option value="HYBRID" ${appConfig.connectionProfile === 'HYBRID' ? 'selected' : ''}>1. هجين متكامل (WebRTC P2P + Cloud) [الافتراضي والسرعة الأعلى]</option>
                            <option value="RENDER_ONLY" ${appConfig.connectionProfile === 'RENDER_ONLY' ? 'selected' : ''}>2. خادم Render فقط (للإشارات والأوامر والبث والبيانات معاً)</option>
                            <option value="FLY_ONLY" ${appConfig.connectionProfile === 'FLY_ONLY' ? 'selected' : ''}>3. خادم Fly.io فقط (للإشارات والأوامر والبث والبيانات معاً)</option>
                            <option value="LOCAL_LAN" ${appConfig.connectionProfile === 'LOCAL_LAN' ? 'selected' : ''}>4. شبكة محلية LAN فقط (بدون إنترنت، ربط داخلي مباشر)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">خادم الـ STUN الخاص بـ WebRTC:</label>
                        <input type="text" id="cfg-stun" oninput="saveWebSettings(true)" value="${appConfig.stunServer}" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 font-mono focus:outline-none focus:border-emerald-500 transition">
                        <div class="mt-2 flex flex-wrap items-center gap-2">
                            <button type="button" onclick="testStunConnectivity()" class="text-[11px] font-bold bg-sky-950/80 hover:bg-sky-900/90 text-sky-300 border border-sky-500/40 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 shadow">
                                <span>🌐 فحص Google STUN ومنافذ UDP</span>
                            </button>
                            <span class="text-[10px] text-slate-400 font-mono">أو عبر الكونسول: <code class="text-sky-300 bg-slate-950 px-1.5 py-0.5 rounded">testStunConnectivity()</code></span>
                        </div>
                    </div>

                    <!-- B4 — العرض والواجهة: نمط العرض + تخصيص الأقسام السريعة -->
                    <div class="pt-3 border-t border-slate-800/80">

        function setPreset(key) {
            if (PRESETS[key]) {
                const url = PRESETS[key];
                const inputEl = document.getElementById("cfg-server-url");
                if (inputEl) inputEl.value = url;
                appConfig.serverUrl = url;
                saveWebSettings(false);
                showToast(`تم التبديل للسيرفر: ${key.toUpperCase()}`, "success");
            }
        }

        function setConnectionProfile(profile) {
            appConfig.connectionProfile = profile;
            if (profile === 'RENDER_ONLY') setPreset('render');
            else if (profile === 'FLY_ONLY') setPreset('fly');
            else if (profile === 'LOCAL_LAN') setPreset('local');
            saveWebSettings(false);
            showToast(`تم تفعيل البروفايل: ${profile}`, "success");
        }

        function saveWebSettings(silent = false) {
            const urlInput = document.getElementById("cfg-server-url");
            const nameInput = document.getElementById("cfg-device-name");
            const stunInput = document.getElementById("cfg-stun");

            if (urlInput) appConfig.serverUrl = urlInput.value.trim();
            if (nameInput) appConfig.deviceName = nameInput.value.trim();
            if (stunInput) appConfig.stunServer = stunInput.value.trim();

            localStorage.setItem('remotebridge_config', JSON.stringify(appConfig));
            if (!silent) showToast("تم حفظ البيانات في المتصفح بنجاح!", "success");
        }

        function saveCurrentTargetProfile() {
            const targetEl = document.getElementById("target-device-id");
            const targetId = targetEl ? targetEl.value.trim() : "";
            if (!targetId) return;

            appConfig.targetDeviceId = targetId;
            localStorage.setItem('remotebridge_config', JSON.stringify(appConfig));
            showToast(`تم حفظ المعرف الافتراضي: ${targetId}`, "success");
        }

        function openModal(title, imgUrl) {
            const titleEl = document.getElementById("modal-title");
            const imgEl = document.getElementById("modal-img");
            const dlEl = document.getElementById("modal-download");

            if (titleEl) titleEl.innerText = title;
            if (imgEl) imgEl.src = imgUrl;
            if (dlEl) dlEl.href = imgUrl;

            const modalEl = document.getElementById("image-modal");
            if (modalEl) modalEl.classList.replace("hidden", "flex");
        }

        function closeModal() {
            const modalEl = document.getElementById("image-modal");
            if (modalEl) modalEl.classList.replace("flex", "hidden");
        }

        // Full Connectivity Diagnostic Engine & Interactive Tracker
        let isDiagnosticRunning = false;

        async function startFullConnectivityDiagnostic() {
            if (isDiagnosticRunning) return;
            isDiagnosticRunning = true;

            const modalEl = document.getElementById("connectivity-diagnostic-modal");
            const stepsContainer = document.getElementById("diag-steps-container");
            const summaryBox = document.getElementById("diag-summary-box");
            const runningStatus = document.getElementById("diag-running-status");

            if (modalEl) modalEl.classList.replace("hidden", "flex");
            if (summaryBox) summaryBox.className = "hidden";
            if (runningStatus) runningStatus.innerText = "⚡ جارٍ بدء فحص الاتصال وتتبع مسار الحزم المباشر...";

            stepsContainer.innerHTML = `
                ${renderDiagStepHTML('ws', '1. خادم الإشارات (Signaling Server WebSocket)', 'جارٍ الربط واختبار سرعة الاستجابة بالخادم...', 'pending')}
                ${renderDiagStepHTML('reg', '2. تسجيل المتحكم واكتشاف المضيف (Host Device Discovery)', 'جارٍ فحص ظهور الهواتف المتاحة في القائمة...', 'pending')}
                ${renderDiagStepHTML('stun', '3. فحص خادم STUN ومنافذ UDP (NAT Traversal)', 'جارٍ اختبار منافذ UDP واستعراض مرشحات STUN الخارجية...', 'pending')}
                ${renderDiagStepHTML('webrtc', '4. مصافحة WebRTC P2P (SDP Handshake)', 'جارٍ إنشاء العرض وانتظار إجابة الجوال المضيف...', 'pending')}
                ${renderDiagStepHTML('rpc', '5. اختبار جلب البيانات والحاسوب المضيف (RPC & Hardware)', 'جارٍ استدعاء أمر device_info واختبار جلب البطارية والعتاد...', 'pending')}
            `;

            let diagResults = {
                wsOk: false,
                hostOnline: false,
                stunOk: false,
                webrtcOk: false,
                rpcOk: false,
                targetId: "",
                errors: []
            };

            // STEP 1: WebSocket Test
            updateDiagStepUI('ws', 'running', 'جارٍ الاتصال برابط الخادم: ' + (appConfig.serverUrl || PRESETS.render));
            const wsStartTime = Date.now();
            try {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    toggleServerConnection();
                    await new Promise(r => setTimeout(r, 1200));
                }
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const wsLatency = Date.now() - wsStartTime;
                    diagResults.wsOk = true;
                    updateDiagStepUI('ws', 'success', `تم الاتصال بنجاح بخادم الإشارات (${wsLatency}ms) عبر TLS/WSS ✅`);
                } else {
                    diagResults.errors.push("فشل الاتصال بخادم الإشارات عبر WebSocket. تحقق من الاتصال بالإنترنت أو رابط السيرفر.");
                    updateDiagStepUI('ws', 'error', 'تعذر فتح اتصال WebSocket بخادم الإشارات ❌');
                }
            } catch (err) {
                diagResults.errors.push("خطأ في WebSocket: " + err.message);
                updateDiagStepUI('ws', 'error', 'خطأ في الربط: ' + err.message);
            }

            await new Promise(r => setTimeout(r, 400));

            // STEP 2: Host Discovery Test
            updateDiagStepUI('reg', 'running', 'جارٍ فحص المضيف في قائمة الهواتف المتصلة أونلاين...');
            refreshHostList();
            await new Promise(r => setTimeout(r, 800));

            const targetInput = document.getElementById("target-device-id");
            let targetId = (targetInput && targetInput.value.trim()) || appConfig.targetDeviceId;

            if (!targetId && onlineHosts && onlineHosts.length > 0) {
                targetId = onlineHosts[0].deviceId;
                selectHost(targetId);
            }
            diagResults.targetId = targetId;

            const isHostInList = onlineHosts.some(h => h.deviceId === targetId);

            if (targetId && isHostInList) {
                diagResults.hostOnline = true;
                updateDiagStepUI('reg', 'success', `الجهاز المضيف [${targetId}] نشط ومسجل أونلاين على السيرفر بنجاح ✅`);
            } else if (targetId) {
                diagResults.hostOnline = false;
                diagResults.errors.push(`المعرف المستهدف [${targetId}] غير متصل أونلاين حالياً. تأكد من تشغيل خدمة المضيف على الهاتف وتطابق المعرف.`);
                updateDiagStepUI('reg', 'error', `المضيف [${targetId}] غير مسجل أونلاين على خادم الإشارات ❌`);
            } else {
                diagResults.hostOnline = false;
                diagResults.errors.push("لم يتم تحديد أو اكتشاف أي هاتف مضيف. قم بتشغيل خدمة المضيف في الهاتف وإدخال المعرف.");
                updateDiagStepUI('reg', 'error', 'لم يتم العثور على أجهزة مضيفة أونلاين ❌');
            }

            await new Promise(r => setTimeout(r, 400));

            // STEP 3: STUN & UDP Test
            updateDiagStepUI('stun', 'running', 'جارٍ فحص خادم Google STUN واستكشاف منافذ UDP...');
            try {
                const stunResult = await testStunConnectivity();
                if (stunResult && stunResult.success) {
                    diagResults.stunOk = true;
                    updateDiagStepUI('stun', 'success', `نجح فحص STUN! منافذ UDP مفتوحة وتستقبل مرشحات الخارجية (${stunResult.reflexiveCandidates.length} مرشح) ✅`);
                } else {
                    diagResults.stunOk = false;
                    diagResults.errors.push("لم يتم العثور على مرشحات Reflexive عبر STUN. قد تكون منافذ UDP محظورة أو خلف جدار ناري.");
                    updateDiagStepUI('stun', 'warning', 'منافذ UDP قد تكون مقيدة أو خلف جدار حماية (يمكن الاعتماد على خادم الإشارات كـ Relay) ⚠️');
                }
            } catch (e) {
                diagResults.stunOk = false;
                updateDiagStepUI('stun', 'warning', 'فحص STUN اكتمل مع تحذير: ' + e.message);
            }

            await new Promise(r => setTimeout(r, 400));

            // STEP 4: WebRTC P2P Handshake Test — فحص الحالة القائمة أولاً دون زعزعة الاتصال
            if (diagResults.hostOnline) {
                updateDiagStepUI('webrtc', 'running', 'جارٍ فحص القناة المباشرة P2P الحالية...');
                try {
                    const dcNow0 = dataChannel ? dataChannel.readyState : 'closed';
                    const cNow0 = pc ? pc.connectionState : 'none';
                    const iNow0 = pc ? pc.iceConnectionState : 'none';

                    if (dcNow0 === 'open' && cNow0 === 'connected') {
                        diagResults.webrtcOk = true;
                        updateDiagStepUI('webrtc', 'success', `الربط المباشر P2P نشط وقوي (قناة البيانات: open • الاتصال: connected) — لا حاجة لمصافحة جديدة ✅`);
                    } else {
                        // مصافحة جديدة فقط إذا لم يكن هناك اتصال قائم/جارٍ — لا نعيد التفاوض فوق بث نشط
                        if (!(pc && (cNow0 === 'connecting' || cNow0 === 'connected'))) {
                            createWebRTCOffer(targetId);
                        }
                        let ok = false;
                        let st = '';
                        for (let waited = 0; waited < 7000; waited += 700) {
                            await new Promise(r => setTimeout(r, 700));
                            const i2 = pc ? pc.iceConnectionState : 'none';
                            const c2 = pc ? pc.connectionState : 'none';
                            const d2 = dataChannel ? dataChannel.readyState : 'closed';
                            st = `ICE: ${i2} • Conn: ${c2} • DC: ${d2}`;
                            if (d2 === 'open' && c2 === 'connected') { ok = true; break; }
                            if (c2 === 'failed' || i2 === 'failed') { break; }
                        }
                        if (ok) {
                            diagResults.webrtcOk = true;
                            updateDiagStepUI('webrtc', 'success', `تمت المصافحة وتأكيد القناة المباشرة P2P مع المضيف (${st}) ✅`);
                        } else {
                            const stillGoing = st.includes('checking') || st.includes('connecting');
                            diagResults.webrtcOk = false;
                            diagResults.errors.push(`لم تكتمل مصافحة P2P خلال مهلة الفحص (${st})${stillGoing ? ' — التفاوض مستمر وسيكتمل تلقائياً' : ''}.`);
                            updateDiagStepUI('webrtc', 'warning', `حالة القناة بعد مهلة الفحص: ${st} — الاتصال يعمل عبر خادم الإشارات للـ RPC مؤقتاً وبدون مشاكل ⚠️`);
                        }
                    }
                } catch (e) {
                    diagResults.webrtcOk = false;
                    updateDiagStepUI('webrtc', 'error', 'خطأ المصافحة: ' + e.message);
                }
            } else {
                updateDiagStepUI('webrtc', 'error', 'تم التخطي لأن الهاتف المضيف غير متصل ❌');
            }

            await new Promise(r => setTimeout(r, 400));

            // STEP 5: RPC Command Test (device_info & battery)
            if (diagResults.hostOnline) {
                updateDiagStepUI('rpc', 'running', 'جارٍ إرسال أمر device_info واختبار جلب نسبة البطارية والبيانات...');
                try {
                    sendRPCCommand('device_info');
                    const fetchedInfo = await waitForDeviceInfoResponse(3500);

                    if (fetchedInfo && fetchedInfo.batteryLevel !== undefined) {
                        diagResults.rpcOk = true;
                        const batText = `${fetchedInfo.batteryLevel}%${fetchedInfo.isCharging ? ' (شحن)' : ''}`;
                        updateDiagStepUI('rpc', 'success', `نجح جلب بيانات الهاتف المضيف! (البطارية: ${batText} • المساحة: ${(fetchedInfo.storageFreeBytes / 1073741824).toFixed(1)} GB • ${fetchedInfo.model || 'أندرويد'}) ✅`);
                    } else {
                        diagResults.rpcOk = false;
                        diagResults.errors.push("تم إرسال الطلب لكن لم تصل استجابة بيانات البطارية والهاتف بعد. تأكد من تفعيل الأذونات وإبقاء الخدمة تعمل على الهاتف.");
                        updateDiagStepUI('rpc', 'warning', 'بانتظار استجابة المضيف أو استكمال التصاريح ⚠️');
                    }
                } catch (e) {
                    diagResults.rpcOk = false;
                    updateDiagStepUI('rpc', 'error', 'خطأ في جلب البيانات: ' + e.message);
                }
            } else {
                updateDiagStepUI('rpc', 'error', 'تم التخطي لأن الهاتف المضيف غير متصل ❌');
            }

            // Render Final Summary Card
            renderDiagSummaryReport(diagResults);
            if (runningStatus) runningStatus.innerText = "اكتمل فحص وتتبع الاتصال.";
            isDiagnosticRunning = false;
        }

        function renderDiagStepHTML(id, title, desc, status) {
            return `
                <div id="diag-card-${id}" class="bg-slate-950/80 rounded-xl border border-slate-800/80 overflow-hidden transition-all shadow-sm">
                    <!-- Clickable Step Header Box -->
                    <div onclick="toggleDiagStepDetails('${id}')" class="p-2.5 flex items-center justify-between gap-2 cursor-pointer hover:bg-slate-900/60 transition select-none">
                        <div class="flex items-center gap-2 min-w-0">
                            <div id="diag-icon-${id}" class="w-6 h-6 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-xs shrink-0 text-slate-400">
                                ⏳
                            </div>
                            <span class="text-xs font-bold text-slate-200 truncate">${title}</span>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span id="diag-badge-${id}" class="text-[9px] px-2 py-0.5 rounded-full font-bold bg-slate-800 text-slate-400">انتظار</span>
                            <span id="diag-chevron-${id}" class="text-[10px] text-slate-500 font-bold transition-transform">▼</span>
                        </div>
                    </div>
                    <!-- Collapsible Details Body -->
                    <div id="diag-details-${id}" class="px-3 pb-2.5 pt-1 text-[11px] text-slate-300 border-t border-slate-800/40 bg-slate-900/40 leading-relaxed hidden">
                        <p id="diag-desc-${id}">${desc}</p>
                    </div>
                </div>
            `;
        }

        function toggleDiagStepDetails(id) {
            const detailsEl = document.getElementById(`diag-details-${id}`);
            const chevronEl = document.getElementById(`diag-chevron-${id}`);
            if (!detailsEl) return;

            const isHidden = detailsEl.classList.contains("hidden");
            if (isHidden) {
                detailsEl.classList.remove("hidden");
                if (chevronEl) chevronEl.style.transform = "rotate(180deg)";
            } else {
                detailsEl.classList.add("hidden");
                if (chevronEl) chevronEl.style.transform = "rotate(0deg)";
            }
        }

        function updateDiagStepUI(id, status, text, badgeText) {
            const cardEl = document.getElementById(`diag-card-${id}`);
            const iconEl = document.getElementById(`diag-icon-${id}`);
            const descEl = document.getElementById(`diag-desc-${id}`);
            const badgeEl = document.getElementById(`diag-badge-${id}`);
            const detailsEl = document.getElementById(`diag-details-${id}`);
            const chevronEl = document.getElementById(`diag-chevron-${id}`);

            if (descEl) descEl.innerText = text;

            if (status === 'running') {
                if (cardEl) cardEl.className = "bg-purple-950/20 rounded-xl border border-purple-500/40 overflow-hidden transition-all shadow-sm animate-pulse";
                if (iconEl) {
                    iconEl.className = "w-6 h-6 rounded-lg bg-purple-500/20 text-purple-300 border border-purple-500/40 flex items-center justify-center font-bold text-xs shrink-0 animate-spin";
                    iconEl.innerText = "⚙️";
                }
                if (badgeEl) {
                    badgeEl.className = "text-[9px] px-2 py-0.5 rounded-full font-bold bg-purple-950 text-purple-300 border border-purple-500/30";
                    badgeEl.innerText = badgeText || "جارٍ...";
                }
                if (detailsEl) {
                    detailsEl.classList.remove("hidden");
                    if (chevronEl) chevronEl.style.transform = "rotate(180deg)";
                }
            } else if (status === 'success') {
                if (cardEl) cardEl.className = "bg-emerald-950/20 rounded-xl border border-emerald-500/30 overflow-hidden transition-all shadow-sm";
                if (iconEl) {
                    iconEl.className = "w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 flex items-center justify-center font-bold text-xs shrink-0";
                    iconEl.innerText = "✅";
                }
                if (badgeEl) {
                    badgeEl.className = "text-[9px] px-2 py-0.5 rounded-full font-bold bg-emerald-950 text-emerald-300 border border-emerald-500/30";
                    badgeEl.innerText = badgeText || "نجح ✅";
                }
                // Auto-collapse successful steps to save window space!
                if (detailsEl) {
                    detailsEl.classList.add("hidden");
                    if (chevronEl) chevronEl.style.transform = "rotate(0deg)";
                }
            } else if (status === 'warning') {
                if (cardEl) cardEl.className = "bg-amber-950/30 rounded-xl border border-amber-500/40 overflow-hidden transition-all shadow-sm";
                if (iconEl) {
                    iconEl.className = "w-6 h-6 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 flex items-center justify-center font-bold text-xs shrink-0";
                    iconEl.innerText = "⚠️";
                }
                if (badgeEl) {
                    badgeEl.className = "text-[9px] px-2 py-0.5 rounded-full font-bold bg-amber-950 text-amber-300 border border-amber-500/30";
                    badgeEl.innerText = badgeText || "تنبيه ⚠️";
                }
                // Keep details expanded for warnings/errors so details are immediately visible!
                if (detailsEl) {
                    detailsEl.classList.remove("hidden");
                    if (chevronEl) chevronEl.style.transform = "rotate(180deg)";
                }
            } else if (status === 'error') {
                if (cardEl) cardEl.className = "bg-rose-950/30 rounded-xl border border-rose-500/40 overflow-hidden transition-all shadow-sm";
                if (iconEl) {
                    iconEl.className = "w-6 h-6 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40 flex items-center justify-center font-bold text-xs shrink-0";
                    iconEl.innerText = "❌";
                }
                if (badgeEl) {

        // ============================================================
        //    🎬 الدفعة الجديدة: اللقطة + التسجيل المجدول + المجلدات + خريطة الموقع + مزامنة الخادم
        // ============================================================
        const recPending = {};      // kind -> قيد التأكيد
        const recActiveM = {};      // kind -> تسجيل جارٍ
        let recordingsFolderCurrent = null;
        let recordingsCache = [];
        let locationPointsCache = [];
        let locationTrackingInfo = false;
        let locationSnapshotBuffer = null;   // لحظة مخزنة من الخادم (تعمل عند انقطاع المضيف)
        let rbLocMap = null;
        let rbLocMarkersLayer = null;

        function recKindLabel(kind) {
            return kind === 'camera' ? 'الكاميرا' : kind === 'audio' ? 'الميكروفون' : kind === 'screenshot' ? 'اللقطات' : 'الشاشة';
        }

        function getRecPrefs(kind) {
            try {
                const all = JSON.parse(localStorage.getItem('rb_rec_sched_v1') || '{}');
                return all[kind] || { delaySec: 0, segmentSec: 180, intervalSec: 0, repeatCount: 1, front: false, audio: true };
            } catch (_) { return { delaySec: 0, segmentSec: 180, intervalSec: 0, repeatCount: 1, front: false, audio: true }; }
        }

        function saveRecPrefs(kind, prefs) {
            try {
                const all = JSON.parse(localStorage.getItem('rb_rec_sched_v1') || '{}');
                all[kind] = prefs;
                localStorage.setItem('rb_rec_sched_v1', JSON.stringify(all));
            } catch (_) {}
        }

        function refreshRecButtons() {
            if (activeTab === 'camera') renderCameraStreamView();
        }

        // ——— إعادة التفاوض الذكية بعد نبض stream_started (تنقيح التزاحم مع عرض 400ms الأساسي) ———
        let streamRenegotiateTimer = null;
        function ensureStreamRenegotiation() {
            if (streamRenegotiateTimer) clearTimeout(streamRenegotiateTimer);
            streamRenegotiateTimer = setTimeout(() => {
                streamRenegotiateTimer = null;
                if (!streamState.active || !activeTargetDeviceId) return;
                try {
                    if (!pc || pc.connectionState === 'closed' || pc.connectionState === 'failed') {
                        initPeerConnection(activeTargetDeviceId);
                    }
                    // 🔧 B5 — القناة تُنشأ داخل initPeerConnection، والعرض صريح واحد بلا عواصف
                    if (pc.signalingState === 'stable') {
                        createWebRTCOffer(activeTargetDeviceId);
                    } else {
                        // إعادة تفاوض سابقة قيد الإنجاز — انتظار قصير ثم محاولة أخيرة
                        setTimeout(() => {
                            if (streamState.active && pc && pc.signalingState === 'stable') {
                                createWebRTCOffer(activeTargetDeviceId);
                            } else if (streamState.active) {
                                showToast("تعذر إطلاق تفاوض البث تلقائياً — أعد الضغط على زر نوع البث مرة أخرى", "warning");
                            }
                        }, 2500);
                    }
                } catch (e) { console.warn('renegotiate error', e); }
            }, 1000);
        }

        // ——— بدء/إيقاف التسجيل ———
        function toggleRec(kind) {
            if (recActiveM[kind] || recPending[kind]) {
                showToast(`⏹ إيقاف تسجيل ${recKindLabel(kind)}...`, 'info');
                sendRPCCommand('rec_stop', { kind }, { timeout: 9000 }).catch(() => {});
                recPending[kind] = true;
                refreshRecButtons();
                setTimeout(() => { delete recPending[kind]; }, 4000);
                return;
            }
            applyRecStart(kind, getRecPrefs(kind));
        }

        function applyRecStart(kind, prefs) {
            const targetId = activeTargetDeviceId || appConfig.targetDeviceId;
            if (!targetId) { showToast('اختر جهازاً مضيفاً أولاً', 'warning'); return; }
            recPending[kind] = true;
            refreshRecButtons();
            setTimeout(() => { delete recPending[kind]; }, 9000);
            const payload = {
                kind,
                front: prefs.front === true,
                audio: prefs.audio !== false,
                delaySec: Number(prefs.delaySec) || 0,
                segmentSec: Number(prefs.segmentSec) || 180,
                intervalSec: Number(prefs.intervalSec) || 0,
                repeatCount: (prefs.repeatCount !== undefined && prefs.repeatCount !== null) ? Number(prefs.repeatCount) : 1
            };
            sendRPCCommand('rec_start', payload, { timeout: 12000 }).catch(() => {
                delete recPending[kind];
                refreshRecButtons();
            });
        }

                document.getElementById('rb-sched-front').checked = p.front === true;
                document.getElementById('rb-sched-audio').checked = p.audio !== false;
                document.getElementById('rb-sched-camopts').style.display = kindSel.value === 'camera' ? 'flex' : 'none';

            kindSel.addEventListener('change', fillPrefs);
            fillPrefs();

            const kind = document.getElementById('rb-sched-kind').value;

                delaySec: parseInt(document.getElementById('rb-sched-delay').value, 10) || 0,

                intervalSec: parseInt(document.getElementById('rb-sched-interval').value, 10) || 0,
                repeatCount: parseInt(document.getElementById('rb-sched-repeat').value, 10),
                front: document.getElementById('rb-sched-front').checked,
                audio: document.getElementById('rb-sched-audio').checked
            };
            saveRecPrefs(kind, prefs);

        function recFmtSize(bytes) {
            const u = ['B', 'KB', 'MB', 'GB'];
            let i = 0, v = bytes || 0;
            while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
            return (i > 0 && v < 10 ? v.toFixed(1) : Math.round(v)) + ' ' + u[i];
        }

        function recFmtDate(ms) {
            try { return fmtEnTime(ms); }
            catch (_) { return '' + ms; }
        }

            const grid = document.getElementById('rb-rec-content');
            if (!grid || recordingsFolderCurrent === 'location') return;
            const kind = recordingsFolderCurrent;
            const items = (recordingsCache || []).filter(it => it.recKind === kind);
            if (!items.length) {
                grid.innerHTML = `<div class="text-center text-slate-500 text-xs py-8">لا توجد تسجيلات ${recKindLabel(kind)} بعد — بدّئ التسجيل من شريط الأدوات ▶️</div>`;
                return;
