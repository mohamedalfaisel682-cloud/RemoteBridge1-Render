<!DOCTYPE html>
<html lang="ar" dir="rtl" class="overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RBstudio - Control &amp; Monitoring Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(16, 185, 129, 0.8);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ===== Phase 2: شارات العدادات داخل دوائر ===== */
        .tab-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 17px;
            height: 17px;
            padding: 0 4px;
            border-radius: 999px;
            background: #e11d48;
            color: #fff;
            font-size: 9.5px;
            font-weight: 800;
            line-height: 1;
            border: 1.5px solid rgba(255,255,255,0.35);
            box-shadow: 0 0 0 1px rgba(15,23,42,0.85);
        }
        .tab-badge[hidden] { display: none; }

        /* ===== Phase 2: أيقونة مكبر الصوت في نافذة البث ===== */
        @keyframes speaker-live-flash {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55), 0 0 14px 2px rgba(16,185,129,0.45); }
            50%      { box-shadow: 0 0 0 6px rgba(16,185,129,0.10), 0 0 24px 6px rgba(16,185,129,0.55); }
        }
        .speaker-btn-on {
            background: rgba(16,185,129,0.25) !important;
            border: 1.5px solid rgba(16,185,129,0.9) !important;
            color: #6ee7b7 !important;
            animation: speaker-live-flash 1.4s ease-in-out infinite;
        }
        .speaker-btn-off {
            background: rgba(225,29,72,0.22) !important;
            border: 1.5px solid rgba(244,63,94,0.9) !important;
            color: #fda4af !important;
        }
        .speaker-btn-off .speaker-slash { display: block; }
        .speaker-slash { display: none; }

        /* ===== Phase 2: أوضاع عرض القوائم ===== */
        .vm-btn { transition: all .2s; }
        .vm-btn.vm-active {
            background: rgba(16,185,129,0.25) !important;
            border-color: rgba(16,185,129,0.65) !important;
            color: #6ee7b7 !important;
        }
        .files-flex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
        .files-flex-grid.vm-medium { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        .files-flex-grid.vm-large { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .file-thumb-card {
            background: rgba(15,23,42,0.85);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: border-color .2s, transform .15s;
            cursor: pointer;
        }
        .file-thumb-card:hover { border-color: rgba(16,185,129,0.8); transform: translateY(-2px); }
        .file-thumb-card.selected { border-color: rgba(16,185,129,1); box-shadow: 0 0 0 2px rgba(16,185,129,0.35); }
        .file-thumb-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #0b1220; }
        .file-thumb-name { font-size: 10px; color: #cbd5e1; padding: 4px 6px 6px; direction: ltr; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-thumb-select { position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; accent-color: #10b981; }

        /* ===== Phase 2: نافذة الدردشة/المجموعة ===== */
        .overlay-window {
            position: fixed;
            inset: 0;
            z-index: 70;
            background: rgba(2,6,23,0.78);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .chat-window {
            width: 100%;
            max-width: 640px;
            height: min(88vh, 760px);
            background: linear-gradient(180deg, #0f172a 0%, #0b1220 100%);
            border: 1px solid rgba(51,65,85,0.9);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
        }
        .chat-header { display:flex; align-items:center; justify-content:space-between; padding: 12px 14px; border-bottom:1px solid rgba(51,65,85,0.8); background: rgba(15,23,42,0.9); }
        .chat-body { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(rgba(148,163,184,0.05) 1px, transparent 1px); background-size: 18px 18px; }
        .bubble-wrap { display: flex; width: 100%; }
        .bubble-wrap.in  { justify-content: flex-start; }  /* واردة: يمين في الواجهة العربية */
        .bubble-wrap.out { justify-content: flex-end; }    /* صادرة: يسار */
        .bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.65;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .bubble.in  { background: rgba(51,65,85,0.55); border: 1px solid rgba(71,85,105,0.8); color: #e2e8f0; border-start-start-radius: 4px; }
        .bubble.out { background: rgba(16,185,129,0.22); border: 1px solid rgba(16,185,129,0.55); color: #d1fae5; border-start-end-radius: 4px; }
        .bubble-time { font-size: 9.5px; opacity: .75; margin-top: 4px; text-align: left; font-family: monospace; }
        .chat-input-row { display:flex; gap:8px; padding: 10px 12px; border-top: 1px solid rgba(51,65,85,0.8); background: rgba(15,23,42,0.9); }

        /* ===== B4 — الوقت/التاريخ بالأرقام الإنجليزية وخط أوضح يتفق مع الخلفية ===== */
        .ts-en {
            font-family: "Consolas", "Menlo", ui-monospace, monospace;
            font-weight: 700;
            color: #fbbf24;               /* عشوائي واضح على الخلفيات الداكنة */
            letter-spacing: .25px;
            direction: ltr;
            unicode-bidi: isolate;
            text-shadow: 0 1px 2px rgba(0,0,0,.65);
        }
        .ts-en.on-green { color: #ecfdf5; text-shadow: 0 1px 2px rgba(2,44,34,.8); }   /* داخل فقاعة صادرة */
        .ts-en.on-slate { color: #93c5fd; text-shadow: 0 1px 2px rgba(6,18,38,.8); }   /* داخل فقاعة واردة */
        .ts-en.on-panel { color: #a7f3d0; }                                            /* على بطاقات شرم */
        .ts-date-sep {
            display: inline-flex; align-items: center; gap: 8px;
            margin: 6px auto 2px; padding: 2.5px 10px;
            border-radius: 999px;
            background: rgba(56,189,248,0.12);
            border: 1px solid rgba(56,189,248,0.35);
            color: #7dd3fc; font-size: 10px; font-weight: 800;
            font-family: "Consolas", ui-monospace, monospace;
            direction: ltr; unicode-bidi: isolate;
            box-shadow: 0 0 12px rgba(56,189,248,0.15);
        }

        /* ===== B9 — شريط تنقّل جانبي (أول/سابق/تالي/آخر) لكل نوافذ الدردشة ===== */
        .chat-window.rb-rail-ready { position: relative; }
        .rb-chat-rail {
            position: absolute; top: 50%; transform: translateY(-50%);
            right: 3px; z-index: 20;
            display: flex; flex-direction: column; gap: 4px;
            padding: 4px; border-radius: 12px;
            background: rgba(2, 6, 23, 0.74);
            border: 1px solid rgba(51, 65, 85, 0.9);
            backdrop-filter: blur(6px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        }
        .rb-chat-rail button {
            width: 26px; height: 26px; font-size: 11px; line-height: 1;
            border-radius: 8px; color: #7dd3fc;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(56, 189, 248, 0.25);
            transition: transform .15s, background .15s;
        }
        .rb-chat-rail button:hover { background: rgba(56, 189, 248, 0.2); transform: scale(1.14); }

        /* ===== B9 — طيّ الرسائل الطويلة: 10 أسطر ثم «إظهار الكل» ===== */
        .rb-msg-clamped {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 10;
            overflow: hidden;
        }
        .rb-msg-fade { -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%); }
        .rb-more-btn {
            margin-top: 5px; padding: 1px 8px; font-size: 9.5px; font-weight: 800;
            border-radius: 999px; color: #7dd3fc;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            transition: background .15s;
        }
        .rb-more-btn:hover { background: rgba(56, 189, 248, 0.24); }

        /* ===== B9 — منصة البث الحي الاحترافية ===== */
        .rb-stream-stage {
            background: linear-gradient(180deg, #020617 0%, #0b1220 100%);
            border: 1px solid rgba(51, 65, 85, 0.9);
            transition: box-shadow .35s, border-color .35s;
        }
        .rb-stream-stage.rb-live-glow {
            border-color: rgba(16, 185, 129, 0.65);
            box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.35), 0 0 34px rgba(16, 185, 129, 0.18), 0 18px 50px rgba(0, 0, 0, 0.55);
        }
        .rb-stream-stage .rb-state-chip {
            position: absolute; top: 8px; left: 8px; z-index: 10;
            display: flex; align-items: center; gap: 5px;
            padding: 2.5px 9px; border-radius: 999px;
            font-size: 9.5px; font-weight: 800; font-family: "Consolas", ui-monospace, monospace;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(51, 65, 85, 0.95);
            backdrop-filter: blur(6px);
            letter-spacing: .3px;
        }
        .rb-stream-card {
            padding: 12px 11px; border-radius: 16px;
            border: 1px solid rgba(51, 65, 85, 0.95);
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.96));
            color: #cbd5e1;
            display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
            transition: transform .22s, border-color .22s, box-shadow .22s;
            text-align: right;
        }
        .rb-stream-card:hover {
            transform: translateY(-2px);
            border-color: rgba(45, 212, 191, 0.5);
            box-shadow: 0 10px 28px rgba(45, 212, 191, 0.09);
        }
        .rb-stream-card.rb-stream-card-on {
            border-color: rgba(16, 185, 129, 0.72);
            background: linear-gradient(180deg, rgba(6, 78, 59, 0.38), rgba(2, 6, 23, 0.92));
            box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.35), 0 0 26px rgba(16, 185, 129, 0.16);
        }
        .rb-stream-ico { font-size: 22px; line-height: 1; }
        .rb-stream-t { font-weight: 800; font-size: 12px; color: #e2e8f0; }
        .rb-stream-d { font-size: 9.5px; color: #64748b; letter-spacing: .1px; }
        .rb-stream-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .rb-stream-chip-hint {
            font-size: 10px; color: #64748b;
            padding: 6px 10px; border-radius: 12px;
            border: 1px dashed rgba(71, 85, 105, 0.6);
        }

        /* ===== B4 — تأثير مرئي للتبويب/الأيقونة النشطة (توهج نابض + شريط سفلي) ===== */
        .tab-btn, .tab-btn-mobile { position: relative; transition: box-shadow .25s, background .2s, color .2s; }
        .active-tab {
            background: rgba(16,185,129,0.22) !important;
            color: #34d399 !important;
            font-weight: 800;
            box-shadow: 0 0 0 1px rgba(16,185,129,0.55), 0 0 14px 2px rgba(16,185,129,0.35);
        }
        .active-tab::after {
            content: "";
            position: absolute;
            bottom: 3px; left: 18%; right: 18%;
            height: 2.5px; border-radius: 3px;
            background: linear-gradient(90deg, transparent, #34d399, transparent);
            animation: activeTabPulse 1.6s ease-in-out infinite;
        }
        @keyframes activeTabPulse {
            0%, 100% { opacity: .55; transform: scaleX(.85); }
            50%      { opacity: 1;   transform: scaleX(1); }
        }

        /* ===== B4 — أيقونة نابضة تدل على وجود تفاصيل مخفية ===== */
        @keyframes blinkPillDot {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(56,189,248,0.65), 0 0 10px 1px rgba(56,189,248,0.5); }
            50%      { opacity: .45; box-shadow: 0 0 0 5px rgba(56,189,248,0.06), 0 0 4px 1px rgba(56,189,248,0.25); }
        }
        .blink-pill { animation: blinkPillDot 1.5s ease-in-out infinite; cursor: pointer; }
        .p2p-panel-collapsed { overflow: hidden; }

        /* ===== B4 — نمط العرض الفاتح (عكس منعكس مع إعادة عكس الوسائط) ===== */
        body.ui-light {
            filter: invert(0.92) hue-rotate(180deg) saturate(.92);
            background: #e2e8f0;
        }
        body.ui-light img, body.ui-light video, body.ui-light canvas,
        body.ui-light #rb-loc-map, body.ui-light .leaflet-tile-pane {
            filter: invert(1) hue-rotate(180deg) saturate(1.08);
        }
    </style>
    <style id="bridge-host-studio-css">
        /* ===== الإطار الوامض للجهاز المضيف المختار والمتصل (أخضر فاتح ↔ أبيض) ===== */
        .host-flash {
            animation: hostFlashAnim 1.5s ease-in-out infinite;
        }
        @keyframes hostFlashAnim {
            0%, 100% {
                border-color: rgba(134, 239, 172, .95);
                box-shadow: 0 0 0 2px rgba(134, 239, 172, .70), 0 0 14px 4px rgba(134, 239, 172, .40);
            }
            50% {
                border-color: rgba(255, 255, 255, .95);
                box-shadow: 0 0 0 2px rgba(255, 255, 255, .70), 0 0 14px 4px rgba(255, 255, 255, .35);
            }
        }
        .host-status-dot {
            width: 9px; height: 9px; border-radius: 9999px; flex-shrink: 0;
        }
        .host-status-dot.on {
            background: #22c55e;
            box-shadow: 0 0 7px rgba(34, 197, 94, .95);
            animation: hostDotPulse 1.6s ease-in-out infinite;
        }
        .host-status-dot.off {
            background: #ef4444;
            box-shadow: 0 0 5px rgba(239, 68, 68, .8);
        }
        /* B6 — الدائرة البرتقالية: غير متصل لكن له اتصال سابق وبيانات مخزنة على خادم Render */
        .host-status-dot.offline-seen {
            background: #f59e0b;
            box-shadow: 0 0 6px rgba(245, 158, 11, .9);
            animation: hostDotPulse 2.4s ease-in-out infinite;
        }
        /* B6 — الدائرة نفسها تفتح نافذة الحالة عند النقر (مساحة نقر أوسع + تكبير عند التحويم) */
        .host-dot-btn {
            cursor: pointer !important;
            transition: transform .15s ease;
        }
        .host-dot-btn:hover {
            transform: scale(1.45);
            filter: brightness(1.25);
        }
        @keyframes hostDotPulse {
            0%, 100% { transform: scale(.9); opacity: .85; }
            50% { transform: scale(1.25); opacity: 1; }
        }
        /* ===== زر الفحص التلقائي (أيقونة + نص + مؤشر نابض أخضر/أبيض) ===== */
        .auto-scan-on {
            background: rgba(34, 197, 94, .16);
            border: 1px solid rgba(34, 197, 94, .45);
            color: #6ee7b7;
            animation: hostFlashAnim 1.5s ease-in-out infinite;
        }
        .auto-scan-off {
            background: rgba(100, 116, 139, .14);
            border: 1px solid rgba(100, 116, 139, .45);
            color: #94a3b8;
        }
        .scan-pulse-dot {
            width: 8px; height: 8px; border-radius: 9999px;
            background: #22c55e;
            box-shadow: 0 0 6px 1px rgba(34, 197, 94, .85);
            animation: scanPulseDot 1.1s ease-in-out infinite;
            flex-shrink: 0;
        }
        .scan-pulse-dot.off {
            background: #64748b;
            box-shadow: none;
            animation: none;
        }
        @keyframes scanPulseDot {
            0%, 100% { background: #22c55e; box-shadow: 0 0 6px 1px rgba(34, 197, 94, .85); }
            50% { background: #ffffff; box-shadow: 0 0 10px 3px rgba(255, 255, 255, .9); }
        }
        /* ===== B5: أوضاع عرض الاستوديو ومتصفح المجلدات (صغير S / متوسط M / كبير L / تفاصيل) ===== */
        .viewsize-btn {
            background: rgba(15, 23, 42, .8);
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: .55rem;
            padding: 3px 9px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all .18s;
        }
        .viewsize-btn:hover { border-color: rgba(52, 211, 153, .6); color: #a7f3d0; }
        .viewsize-btn.vs-active {
            background: rgba(16, 185, 129, .28);
            border-color: rgba(16, 185, 129, .8);
            color: #6ee7b7;
        }
        /* شبكة الاستوديو متعددة الأحجام — B5 */
        #studio-grid { gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
        @media (min-width: 640px) { #studio-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (min-width: 768px) { #studio-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
        #studio-grid.vs-s { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (min-width: 640px) { #studio-grid.vs-s { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
        @media (min-width: 768px) { #studio-grid.vs-s { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
        #studio-grid.vs-l { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        @media (min-width: 640px) { #studio-grid.vs-l { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (min-width: 768px) { #studio-grid.vs-l { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        #studio-grid.vs-details { grid-template-columns: 1fr; gap: 6px; }
        #studio-grid.vs-details .studio-card {
            aspect-ratio: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
        }
        #studio-grid.vs-details .studio-thumb {
            width: 52px !important; height: 52px !important;
            border-radius: .6rem;
            flex: 0 0 auto;
        }
        #studio-grid.vs-details .studio-type-badge { position: static; background: rgba(30,41,59,.9); border-radius: .4rem; padding: 1px 5px; font-size: 9px; }
        #studio-grid.vs-details .studio-meta {
            position: static;
            background: none;
            padding: 0;
            font-size: 11px;
            color: #cbd5e1;
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* متصفح المجلدات — B5 */
        .fb-grid { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0,1fr)); }
        .fb-grid.vs-s { grid-template-columns: repeat(4, minmax(0,1fr)); }
        @media (min-width: 640px) { .fb-grid.vs-s { grid-template-columns: repeat(6, minmax(0,1fr)); } }
        .fb-grid.vs-l { grid-template-columns: repeat(2, minmax(0,1fr)); }
        @media (min-width: 640px) { .fb-grid.vs-l { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        .fb-grid.vs-details { grid-template-columns: 1fr; gap: 6px; }
        .fb-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px;
            border-radius: .75rem;
            background: rgba(15, 23, 42, .85);
            border: 1px solid #1e293b;
            cursor: pointer;
            transition: border-color .15s, transform .12s;
        }
        .fb-row:hover { border-color: rgba(52, 211, 153, .6); transform: scale(1.01); }
        .fb-row-thumb {
            width: 44px; height: 44px;
            border-radius: .55rem;
            object-fit: cover;
            flex: 0 0 auto;
            background: #0b1220;
        }
        .fb-card {
            position: relative;
            border-radius: .7rem;
            overflow: hidden;
            background: #0f172a;
            border: 1px solid #1e293b;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            transition: transform .14s ease, border-color .14s ease;
        }
        .fb-card:hover { transform: scale(1.04); border-color: rgba(52, 211, 153, .65); }
        .fb-card .fb-cover { width: 100%; height: 100%; object-fit: cover; display: block; }
        .fb-folder-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: rgba(15, 23, 42, .85);
        }
        .fb-bc {
            color: #94a3b8;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: .4rem;
            transition: all .15s;
            white-space: nowrap;
        }
