    <script>
        // State Management
        let ws = null;
        let pc = null;
        let dataChannel = null;
        let myDeviceId = "pc-web-controller-" + Math.floor(1000 + Math.random() * 9000);
        let pingInterval = null;
        let lastPingTime = 0;
        let activeTab = 'dashboard';
        let onlineHosts = [];

        // CLEAN DEFAULT DATA STORES (Zero Fake Items by Default)
        let filesData = [];
        let contactsData = [];
        let smsData = [];
        let callsData = [];
        let notificationsData = [];

        // Selection Stores for Single / Bulk Select All
        let selectedFileIds = new Set();
        let selectedContactIds = new Set();
        let selectedSmsIds = new Set();
        let selectedCallIds = new Set();
        let selectedNotifIds = new Set();
        let latestDeviceInfo = null;
        let activeTargetDeviceId = "";

        // Streaming state
        let streamState = {
            active: false,
            isFront: false,
            audioEnabled: true
        };

        // Current Directory for File Explorer
        let currentExplorerPath = "/";

        // Preset Configurations
        const PRESETS = {
            render: "wss://remotebridge1.onrender.com/ws",
            fly: "wss://my-ai-bridge-app.fly.dev/ws",
            local: "ws://localhost:10000/ws"
        };

        const DEFAULT_CONFIG = {
            serverUrl: PRESETS.render,
            deviceName: "RBstudio Web Controller",
            targetDeviceId: "",
            stunServer: "stun:stun.l.google.com:19302",
            connectionProfile: "HYBRID"
        };

        let appConfig = JSON.parse(localStorage.getItem('remotebridge_config')) || DEFAULT_CONFIG;

        // ترقية لمرة واحدة: الافتراضي القديم كان RENDER_ONLY — نرقّيه إلى HYBRID (P2P + Render)
        if (!localStorage.getItem('remotebridge_profile_migrated_v2')) {
            if (appConfig.connectionProfile === 'RENDER_ONLY') {
                appConfig.connectionProfile = 'HYBRID';
                try { localStorage.setItem('remotebridge_config', JSON.stringify(appConfig)); } catch (e) {}
            }
            try { localStorage.setItem('remotebridge_profile_migrated_v2', '1'); } catch (e) {}
        }
        if (!appConfig.serverUrl || appConfig.serverUrl.includes("remotebridge.onrender.com")) {
            appConfig.serverUrl = PRESETS.render;
            try { localStorage.setItem('remotebridge_config', JSON.stringify(appConfig)); } catch (e) {}
        }

        // Auto Battery Refresh Interval
        let batteryAutoRefreshTimer = null;

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            // B4 — استعادة نمط العرض المحفوظ (داكن/فاتح) قبل رسم أي شيء
            applyUiTheme(getUiTheme());
            const targetEl = document.getElementById("target-device-id");
            if (targetEl && appConfig.targetDeviceId) targetEl.value = appConfig.targetDeviceId;
            switchTab('dashboard');
            // Auto connect signaling server & discover host
            setTimeout(() => autoDiscoverAndConnectHosts(), 800);
        });

        function autoSaveInputs() {
            const targetEl = document.getElementById("target-device-id");
            if (targetEl) {
                appConfig.targetDeviceId = targetEl.value.trim();
                localStorage.setItem('remotebridge_config', JSON.stringify(appConfig));
            }
        }

        // ===== B4 — صيغة الوقت/التاريخ بالأرقام الإنجليزية (Latin digits) بخط أوضح =====
        // تُستخدم في كل ترويسة الوقت داخل لوحة الويب: رسائل/مكالمات/إشعارات/تسجيلات/الخريطة
        function fmtEnTime(ms) {
            try {
                const d = new Date(Number(ms) || Date.now());
                return d.toLocaleString('en-GB', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
                });
            } catch (_) { return String(ms || ''); }
        }
        function fmtEnDate(ms) {
            try {
                const d = new Date(Number(ms) || Date.now());
                return d.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
            } catch (_) { return String(ms || ''); }
        }
        function fmtEnDateLabel(ms) {
            try {
                const d = new Date(Number(ms));
                const today = new Date();
                const yest = new Date(); yest.setDate(today.getDate() - 1);
                const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
                if (sameDay(d, today)) return 'اليوم';
                if (sameDay(d, yest)) return 'أمس';
                return d.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch (_) { return ''; }
        }
        function fmtEnClock(ms) {
            try {
                const d = new Date(Number(ms) || Date.now());
                return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
            } catch (_) { return ''; }
        }

        // Toast Notification System
        // — نظام تلميحات موحّد ثمين:
        //   1) نفس الرسالة لا تظهر مرتين خلال 10 ثوانٍ (حتى مع النقر المتكرر على أيقونة الفحص التلقائي)
        //   2) التلميحات الإرشادية (showHintOnce) تظهر مرة واحدة فقط في الجلسة كاملة
        //   3) حد أقصى 3 تلميحات ظاهرة معاً — الأقدم يُحذف فوراً
        const toastHistory = new Map(); // مفتاح الرسالة -> آخر ظهور
        const seenOnceHints = new Set(); // تلميحات إرشادية ظهرت مرة واحدة في الجلسة
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            if (!container) return;
            const key = String(message || "").replace(/\s+/g, " ").trim();
            const now = Date.now();
            if (toastHistory.has(key) && now - toastHistory.get(key) < 10000) return; // منع التكرار لنفس النقطة
            toastHistory.set(key, now);
            if (toastHistory.size > 60) {
                for (const [k, t] of toastHistory) { if (now - t >= 10000) toastHistory.delete(k); }
                if (toastHistory.size > 120) { toastHistory.delete(toastHistory.keys().next().value); }
            }
            while (container.children.length >= 3) {
                container.firstElementChild.remove();
            }
            const toast = document.createElement("div");
            const colors = {
                info: "bg-slate-800 border-slate-700 text-slate-100",
                success: "bg-emerald-950/90 border-emerald-500/40 text-emerald-200",
                warning: "bg-amber-950/90 border-amber-500/40 text-amber-200",
                error: "bg-rose-950/90 border-rose-500/40 text-rose-200",
                hint: "bg-slate-900 border-emerald-600/30 text-emerald-100"
            };
            toast.className = `p-3 rounded-xl border shadow-xl text-xs font-medium flex items-center justify-between gap-3 transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white text-xs">✕</button>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
            const ttl = (type === "hint") ? 5000 : 3200;
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, ttl);
        }

        // تلميح إرشادي يُعرض مرة واحدة فقط في الجلسة مهما تكرر النقر على الأيقونة نفسها
        function showHintOnce(key, message) {
            const onceKey = "hint::" + key;
            if (seenOnceHints.has(onceKey)) return;
            seenOnceHints.add(onceKey);
            showToast(message, "hint");
        }

        // WebSocket Signaling Connection
        function toggleServerConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                ws.close();
                return;
            }

            const url = appConfig.serverUrl || PRESETS.render;
            const statusText = document.getElementById("status-text");
            if (statusText) {
                statusText.innerText = "جارٍ الاتصال...";
                statusText.className = "font-bold text-amber-400";
            }

            try {
                ws = new WebSocket(url);
            } catch (err) {
                showToast("فشل إنشاء اتصال WebSocket: " + err.message, "error");
                return;
            }

            ws.onopen = function() {
                updateConnectionUI(true, "متصل بالسيرفر");
                showToast("تم الاتصال بنجاح بخادم الإشارات", "success");

                ws.send(JSON.stringify({
                    type: "register",
                    deviceId: myDeviceId,
                    role: "controller",
                    deviceName: appConfig.deviceName
                }));

                startPing();
            };

            ws.onmessage = function(event) {
                try {
                    const msg = JSON.parse(event.data);
                    handleSignalingMessage(msg);
                } catch (e) {
                    console.error("Invalid JSON signaling msg:", event.data);
                }
            };

            ws.onclose = function() {
                updateConnectionUI(false, "منقطع عن الخادم");
                showToast("انقطع الاتصال بخادم الإشارات", "warning");
                stopPing();
            };

            ws.onerror = function() {
                showToast("خطأ في الاتصال بالخادم", "error");
            };
        }

        function ensureServerConnection() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
                return; // Connection is active or connecting - do NOT interrupt!
            }
            toggleServerConnection();
        }

        function updateConnectionUI(connected, statusMessage) {
            const ind = document.getElementById("connection-indicator");
            const pulse = document.getElementById("connection-pulse");
            const btn = document.getElementById("connect-btn");
            const statusText = document.getElementById("status-text");

            if (statusText) statusText.innerText = statusMessage;

            if (connected) {
                if (ind) ind.className = "w-3 h-3 bg-emerald-400 rounded-full";
                if (pulse) pulse.className = "w-3 h-3 bg-emerald-400 rounded-full absolute animate-ping opacity-75";
                if (btn) {
                    btn.className = "bg-rose-600 hover:bg-rose-500 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5";
                    btn.innerHTML = "<span>🛑 قطع الاتصال</span>";
                }
                if (statusText) statusText.className = "font-bold text-emerald-400";
            } else {
                if (ind) ind.className = "w-3 h-3 bg-rose-500 rounded-full";
                if (pulse) pulse.className = "hidden";
                if (btn) {
                    btn.className = "bg-emerald-600 hover:bg-emerald-500 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5";
                    btn.innerHTML = "<span>⚡ اتصال بخادم الإشارات</span>";
                }
                if (statusText) statusText.className = "font-bold text-amber-400";
            }
        }

        function startPing() {
            stopPing();
            pingInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    lastPingTime = Date.now();
                    ws.send(JSON.stringify({ type: "ping" }));
                }
            }, 10000);
        }

        function stopPing() {
            if (pingInterval) clearInterval(pingInterval);
        }

        function handleSignalingMessage(msg) {
            switch (msg.type) {
                case "registered":
                    showToast("تم تسجيل جهاز الويب كـ Controller بنجاح", "success");
                    break;
                case "hosts":
                    onlineHosts = msg.hosts || [];
                    renderHostList();
                    break;
                case "host_online":
                    showToast(`جهاز مضيف متصل: ${msg.host.deviceName}`, "info");
                    refreshHostList();
                    break;
                case "host_offline":
                    showToast(`انقطع المضيف: ${msg.deviceId}`, "warning");
                    refreshHostList();
                    break;
                case "push_event":
                    handlePushEvent(msg);
                    break;
                case "pong":
                    const latency = Date.now() - lastPingTime;
                    const pingText = document.getElementById("ping-text");
                    if (pingText) pingText.innerText = `${latency}ms`;
                    break;
                case "offer":
                    handleRemoteOffer(msg);
                    break;
                case "answer":
                    handleRemoteAnswer(msg);
                    break;
                case "ice":
                    handleRemoteCandidate(msg);
                    break;
                case "reject":
                    // 🔧 B5 — إظهار سبب الرفض الصريح من المضيف بدل الانتظار في الصمت
                    showToast("الربط المباشر مرفوض: " + (msg.reason || "سبب غير معروف من المضيف"), "warning");
                    if (pc && pc.connectionState !== 'connected') { try { pc.close(); } catch (_) {} }
                    break;
                case "rpc_response":
                    handleRPCResponse({
                        id: msg.requestId,
                        cmd: msg.cmd,
                        ok: msg.ok,
                        error: msg.error,
                        data: msg.data
                    });
                    break;
            }
        }

        function refreshHostList() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "register", deviceId: myDeviceId, role: "controller", deviceName: appConfig.deviceName }));
            }
        }

        let autoDiscoveryIntervalId = null;

        function autoDiscoverAndConnectHosts() {
            // تلميح واحد فقط في الجلسة — النقر المتكرر على «فحص تلقائي» لا يعرض تلميحاً جديداً
            showHintOnce("auto-discovery", "تم تفعيل الفحص التلقائي للهواتف المضيفة (كل 3 ثوانٍ)");

            // Execute scan immediately
            performHostScan();

            // Set up 3-second polling interval
            if (!autoDiscoveryIntervalId) {
                autoDiscoveryIntervalId = setInterval(() => {
                    performHostScan();
                }, 3000);
            }
        }

        let lastAutoReconnectAt = 0;

        function performHostScan() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                // إعادة الاتصال بمعدل معقول (كل 10 ثوانٍ) بدلاً من كل دورة فحص — يمنع تكرار تلميح «انقطع الاتصال»
                const now = Date.now();
                if (now - lastAutoReconnectAt > 10000) {
                    lastAutoReconnectAt = now;
                    ensureServerConnection();
                }
                return;
            }

            // Update host selection if none is currently selected
            if (!onlineHosts || onlineHosts.length === 0) {
                renderHostList();
            } else {
                const targetEl = document.getElementById("target-device-id");
                const currentTarget = (targetEl && targetEl.value.trim()) || activeTargetDeviceId || appConfig.targetDeviceId;
                const hostExists = onlineHosts.some(h => h.deviceId === currentTarget);

                if (!currentTarget || !hostExists) {
                    const firstHost = onlineHosts[0];
                    selectHost(firstHost.deviceId);
                    showHintOnce("auto-link::" + firstHost.deviceId, `تم اكتشاف المضيف [${firstHost.deviceName || firstHost.deviceId}] والربط به تلقائياً`);
                } else {
                    renderHostList();
                }
            }
        }

        function renderHostList() {
            const listEl = document.getElementById("hosts-list");
            if (!listEl) return;

            // حفظ الهوستات التي تم الاتصال بها مسبقاً + دمجها مع الأجهزة الأونلاين حالياً
            try {
                for (const h of (onlineHosts || [])) {
                    savedHosts.set(h.deviceId, {
                        deviceId: h.deviceId,
                        deviceName: h.deviceName || h.deviceId,
                        lastSeenAt: Date.now(),
                        online: true
                    });
                }
                for (const [id, rec] of savedHosts) {
                    if (rec.online && !(onlineHosts || []).some(x => x.deviceId === id)) {
                        rec.online = false;
                    }
                }
                localStorage.setItem("remotebridge_saved_hosts_v1", JSON.stringify([...savedHosts.values()]));
            } catch (_) {}

            const currentTarget = activeTargetDeviceId || appConfig.targetDeviceId;
            if (!currentTarget && (onlineHosts || []).length > 0) {
                selectHost(onlineHosts[0].deviceId);
            }

            // قائمة متحدة: الأجهزة الأونلاين أولاً ثم الهوستات المحفوظة (غير النشطة) بترتيب آخر ظهور
            const offlineSaved = [...savedHosts.values()]
                .filter(r => !r.online || !(onlineHosts || []).some(x => x.deviceId === r.deviceId))
                .sort((a, b) => (b.lastSeenAt || 0) - (a.lastSeenAt || 0));
            const offlineTotals = offlineSaved.filter(r => !(onlineHosts || []).some(x => x.deviceId === r.deviceId));

            if ((onlineHosts || []).length === 0 && offlineTotals.length === 0) {
                listEl.innerHTML = `<div class="text-[10px] text-slate-500 text-center py-2 bg-slate-900/40 rounded-xl border border-slate-800 animate-pulse">لا توجد أجهزة مضيفة أونلاين حالياً. جارٍ الفحص الدوري عبر السيرفر كل 3 ثوانٍ...</div>`;
                return;
            }

            const p2pAlive = isP2pAlive();
            // B6 — فحص كون الجهاز غير المتصل «شهد بيانات» محفوظة على خادم Render (أساس الدائرة البرتقالية)
            for (const r of offlineTotals) { try { probeServerDataPresence(r.deviceId); } catch (_) {} }
            const cardHtml = (deviceId, deviceName, isOnline) => {
                const selected = deviceId === currentTarget;
                const flash = selected && p2pAlive ? "host-flash" : "";
                // B6 — بلا أي نص حالة: أخضر = أونلاين • برتقالي = غير متصل لكن له اتصال سابق وبيانات مخزنة على الخادم • أحمر = أرق
                const seenOnServer = serverDataPresence[deviceId] === true;
                const dotCls = isOnline ? "host-status-dot on" : (seenOnServer ? "host-status-dot offline-seen" : "host-status-dot off");
                const dotTitle = isOnline
                    ? "متصل الآن — انقر الدائرة لفتح نافذة الحالة"
                    : seenOnServer
                        ? "غير متصل — لكن له اتصال سابق وبيانات مخزنة على خادم Render — انقر الدائرة لفتح نافذة الحالة"
                        : "غير متصل ولا توجد بيانات مخزنة بعد — انقر الدائرة لفتح نافذة الحالة";
                const border = selected ? "border-emerald-500/80 bg-emerald-950/25" : "border-slate-700/60 bg-slate-900/80";
                const modelInfo = hostModelCache[deviceId] ? `<p class="text-[9px] text-slate-500 font-mono">${hostModelCache[deviceId]}</p>` : "";
                const batt = hostBatteryChip[deviceId];
                const battText = (batt && typeof batt.level === 'number' && batt.level >= 0)
                    ? `<span class="text-[9px] px-1.5 py-0.5 rounded-md border ${batt.level <= 15 ? 'border-rose-500/60 text-rose-300 bg-rose-950/60' : 'border-emerald-500/40 text-emerald-300 bg-emerald-950/50'} font-bold" title="آخر بطارية معروفة">🔋 ${batt.level}%${batt.charging ? ' ⚡' : ''}</span>`
                    : "";
                return `
                <div onclick="selectAndConnectHost('${deviceId}')" class="p-2 ${border} ${flash} rounded-xl flex items-center justify-between cursor-pointer transition hover:bg-slate-800/90">
                    <div class="flex items-center gap-2">
                        <span class="host-dot-btn" onclick="event.stopPropagation(); openHostStatusWindow('${deviceId}')" title="${dotTitle}" style="width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;">
                            <div class="${dotCls}"></div>
                        </span>
                        <div>
                            <p class="text-xs font-bold text-slate-200">${deviceName}</p>
                            <p class="text-[10px] font-mono text-slate-400">${deviceId}</p>
                            ${modelInfo}
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1">
                        <div class="flex items-center gap-1 ${battText ? '' : 'hidden'}">${battText}</div>
                    </div>
                </div>`;
            };

            listEl.innerHTML =
                (onlineHosts || []).map(h => cardHtml(h.deviceId, h.deviceName || h.deviceId, true)).join("") +
                offlineTotals.map(r => cardHtml(r.deviceId, r.deviceName, false)).join("");
        }

        // مزامنة حالة الأونلاين عند وصول قائمة/أحداث الهاستات
        let autoFetchToastSuppressed = false;
        let autoFetchInFlight = false;
        const savedHosts = new Map(); // deviceId -> {deviceId, deviceName, lastSeenAt, online}
        const hostModelCache = {};    // deviceId -> "الموديل • Android xx" (من device_info عند الاتصال)
        // B6 — كشف وجود بيانات محفوظة على خادم Render للجهاز غير المتصل (أساس الدائرة البرتقالية)
        // فحص /api/state مرة كل ~60 ثانية لكل جهاز، وإعادة رسم القائمة فقط عند تغير النتيجة.
        const serverDataPresence = {}; // deviceId -> true|false (بعد الفحص) — undefined = لم يفحص بعد
        const serverDataProbeTs = {};  // deviceId -> آخر زمن فحص (خانق 60 ثانية)
        function probeServerDataPresence(deviceId) {
            try {
                if (!deviceId) return;
                const now = Date.now();
                if (serverDataProbeTs[deviceId] && (now - serverDataProbeTs[deviceId]) < 60000) return;
                serverDataProbeTs[deviceId] = now;
                const base = serverStateApiBase();
                if (!base) return;
                fetch(base + '/api/state?deviceId=' + encodeURIComponent(deviceId))
                    .then(r => r.ok ? r.json() : null)
                    .then(snap => {
                        const has = !!(snap && snap.data && (snap.ts || Object.keys(snap.data || {}).length));
                        const prev = serverDataPresence[deviceId];
                        serverDataPresence[deviceId] = has;
                        if (prev !== has) { try { renderHostList(); } catch (_) {} }
                    })
                    .catch(() => {
                        const prev = serverDataPresence[deviceId];
                        serverDataPresence[deviceId] = false;
                        if (prev !== false) { try { renderHostList(); } catch (_) {} }
                    });
            } catch (_) {}
        }
        try {
            for (const rec of (JSON.parse(localStorage.getItem("remotebridge_saved_hosts_v1") || "[]"))) {
                if (rec && rec.deviceId) savedHosts.set(rec.deviceId, { ...rec, online: false });
            }
        } catch (_) {}

        function isP2pAlive() {
            try {
                const dcOpen = dataChannel && dataChannel.readyState === "open";
                const connOk = pc && (pc.connectionState === "connected" || pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed");
                return !!(dcOpen && connOk);
            } catch (_) { return false; }
        }

        // خطاف حالة جهاز info: احفظ موديل آخر host تم جلبه (بطاقة الهاست في القائمة)
        const hostBatteryChip = {};   // deviceId -> {level, charging, ts}
        const origUpdateDashboardCards = updateDashboardCards;
        updateDashboardCards = function (data) {
            try {
                const hostId = activeTargetDeviceId || appConfig.targetDeviceId;
                if (hostId && data && (data.model || data.manufacturer)) {
                    hostModelCache[hostId] = `${data.model || ""}${data.manufacturer ? " • " + data.manufacturer : ""} • أندرويد ${data.androidVersion || ""}`.trim();
                }
                if (hostId && data && (data.batteryLevel !== undefined || data.battery !== undefined)) {
                    const lvl = data.batteryLevel !== undefined ? data.batteryLevel : data.battery;
                    hostBatteryChip[hostId] = { level: lvl, charging: data.isCharging === true, ts: Date.now() };
                    // B7 — إظهار أيقونة «جارٍ الشحن» تحت سعة البطارية في بطاقة نظام التشغيل عند اتصال الشاحن
                    try {
                        const ci = document.getElementById('dash-charge-icon');
                        if (ci) {
                            if (data.isCharging === true) ci.classList.remove('hidden');
                            else ci.classList.add('hidden');
                        }
                    } catch (_) {}
                }
                if (hostId && data) renderHostList();
            } catch (_) {}
            return origUpdateDashboardCards(data);
        };

        function selectAndConnectHost(deviceId) {
            if (!deviceId) return;
            const wasSame = activeTargetDeviceId === deviceId;
            const wasAlive = isP2pAlive();
            selectHost(deviceId); // يشغّل عرض WebRTC التلقائي عند تغيير الجهاز أو انقطاع الاتصال
            // الربط التلقائي: بعد النقر تُجلب كل القوائم تلقائياً دون نقر «جلب» في كل قائمة
            if (!(wasSame && wasAlive)) {
                showHintOnce("autolink::" + deviceId, "تم اختيار الجهاز — جارٍ الربط التلقائي بكل القنوات وجلب القوائم...");
            }
            autoFetchAllLists();
            renderHostList();
        }

        function autoFetchAllLists() {
            if (autoFetchInFlight || !activeTargetDeviceId) return;
            autoFetchInFlight = true;
            autoFetchToastSuppressed = true; // إسكات قيل «تم جلب القائمة» أثناء الجلب الشهودي التلقائي
            const run = (cmd, params, timeout) => {
                try {
                    if (cmd === "storage_explore") {
                        sendRPCCommand("storage_explore", params, { timeout: timeout }).catch(() => {});
                    } else {
                        sendRPCCommand(cmd, null, { timeout: timeout, retries: 1 }).catch(() => {});
                    }
                } catch (_) {}
            };
            // الأسماء أولاً (تعتمد عليها الرسائل والمكالمات) ثم بقية القوائم بتباعد بسيط
            run("contacts_list", null, 9000);
            setTimeout(() => run("sms_list", null, 9000), 900);
            setTimeout(() => run("calls_list", null, 9000), 1800);
            setTimeout(() => run("notifications_list", null, 9000), 2700);
            setTimeout(() => run("storage_explore", { path: currentExplorerPath }, 12000), 3600);
            setTimeout(() => {
                autoFetchInFlight = false;
                autoFetchToastSuppressed = false;
            }, 6500);
        }

        let autoScanGloballyEnabled = true; // الفحص التلقائي مفعّل افتراضياً

        function applyAutoScanVisual() {
            const btn = document.getElementById("auto-scan-toggle");
            const pulse = document.getElementById("auto-scan-pulse");
            const altBtn = document.getElementById("auto-scan-alt");
            if (btn) {
                btn.classList.toggle("auto-scan-on", autoScanGloballyEnabled);
                btn.classList.toggle("auto-scan-off", !autoScanGloballyEnabled);
                btn.classList.toggle("host-flash", autoScanGloballyEnabled);
            }
            if (pulse) pulse.classList.toggle("off", !autoScanGloballyEnabled);
            if (altBtn) {
                altBtn.classList.toggle("auto-scan-on", autoScanGloballyEnabled);
                altBtn.classList.toggle("auto-scan-off", !autoScanGloballyEnabled);
                altBtn.innerHTML = autoScanGloballyEnabled ? "🔍 تنقيب تلقائي — يعمل" : "🔍 تنقيب تلقائي — متوقف";
            }
        }

        function toggleAutoScan() {
            autoScanGloballyEnabled = !autoScanGloballyEnabled;
            applyAutoScanVisual();
            if (autoScanGloballyEnabled) {
                showHintOnce("auto-scan-on", "تم تفعيل الفحص التلقائي — يبحث عن الهواتف كل 3 ثوانٍ");
                autoDiscoverAndConnectHosts();
            } else {
                if (autoDiscoveryIntervalId) {
                    clearInterval(autoDiscoveryIntervalId);
                    autoDiscoveryIntervalId = null;
                }
                showHintOnce("auto-scan-off", "تم إيقاف البحث التلقائي — استخدم زر الفحص يدوياً");
            }
        }

        function selectHost(deviceId) {
            if (!deviceId) return;

            const isSameDevice = (activeTargetDeviceId === deviceId);
            const isConnectionAlive = (pc && (pc.connectionState === 'connected' || pc.connectionState === 'connecting'));

            activeTargetDeviceId = deviceId;
            appConfig.targetDeviceId = deviceId;

            const targetEl = document.getElementById("target-device-id");
            if (targetEl) targetEl.value = deviceId;
            autoSaveInputs();

            // منع إعادة إنشاء عرض WebRTC إذا لم يتغير الهدف والاتصال قائم
            if (!isSameDevice || !isConnectionAlive) {
                showToast(`تم اختيار الجهاز المضيف: ${deviceId}`, "info");
                createWebRTCOfferWithRetry(deviceId);
                sendRPCCommand('device_info');
            }
        }

        async function connectToSelectedHost() {
            const targetEl = document.getElementById("target-device-id");
            const targetId = targetEl ? targetEl.value.trim() : "";
            if (!targetId) {
                showToast("يرجى إدخال معرّف الجهاز المضيف المستهدف", "warning");
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showToast("يرجى الاتصال بخادم الإشارات أولاً", "warning");
                toggleServerConnection();
                setTimeout(() => createWebRTCOfferWithRetry(targetId), 1500);
                return;
            }

            await createWebRTCOfferWithRetry(targetId);
        }

        function createWebRTCOffer(targetId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                const err = new Error("WebSocket غير متصل");
                showToast("اضبط الاتصال بخادم الإشارات أولاً ثم أعد الربط", "warning");
                return Promise.reject(err);
            }

            // 🔧 B5 — تُبنى القناة والاتصال داخل initPeerConnection (عرض واحد شامل)
            if (!pc || pc.connectionState === 'closed' || pc.connectionState === 'failed') {
                initPeerConnection(targetId);
            }
            activeTargetDeviceId = targetId;

            if (offerInFlight) {
                console.log("[WebRTC] عرض آخر قيد الطيران — تجاهُل الطلب المتزامن");
                return Promise.resolve();
            }
            offerInFlight = true;

            return pc.createOffer().then(offer => pc.setLocalDescription(offer))
            .then(() => {
                pc.__expectingAnswer = true; // B5 — الإجابة القادمة تقابل هذا العرض تحديداً
                ws.send(JSON.stringify({
                    type: "offer",
                    from: myDeviceId,
                    to: targetId,
                    sdp: pc.localDescription.sdp,
                    sdpType: "OFFER"
                }));
                showToast("تم إرسال عرض WebRTC للهاتف المضيف...", "info");
                updateWebRTCDiagnosticUI();
            }).catch(err => {
                showToast("فشل إنشاء عرض WebRTC: " + err.message, "error");
                updateWebRTCDiagnosticUI();
                throw err;
            }).finally(() => { offerInFlight = false; });
        }

        /**
         * إنشاء عرض WebRTC مع إعادة المحاولة التلقائية عند الفشل.
         */
        async function createWebRTCOfferWithRetry(targetId, maxRetries = 3) {
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                    await createWebRTCOffer(targetId);
                    
                    // انتظار اتصال ICE مع timeout
                    await waitForIceConnection(15000);
                    return true;
                } catch (e) {
                    console.error(`WebRTC connection attempt ${attempt} failed:`, e);
                    if (attempt < maxRetries) {
                        showToast(`محاولة الاتصال ${attempt} فشلت، إعادة المحاولة...`, "warning");
                        await new Promise(r => setTimeout(r, 2000 * attempt));
                        // تنظيف قبل المحاولة التالية
                        if (pc) { 
                            try { pc.close(); } catch (_) {}
                            pc = null; 
                        }
                    } else {
                        showToast("فشل إنشاء اتصال WebRTC بعد عدة محاولات", "error");
                        throw e;
                    }
                }
            }
        }

        /**
         * انتظار اكتمال اتصال ICE مع مهلة زمنية.
         * 🔧 B5 — يُغلّف معالِج حالة ICE الدائم بدل استبداله (كان يتركه null نهائياً
         * بعد الانتهاء فيعطّل إعادة تشغيل ICE التلقائي عند الفشل اللاحق).
         */
        function waitForIceConnection(timeoutMs) {
            return new Promise((resolve, reject) => {
                if (!pc) return reject(new Error("لا يوجد اتصال PeerConnection"));

                if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                    return resolve();
                }

                const prevHandler = pc.oniceconnectionstatechange;
                const timer = setTimeout(() => {
                    pc.oniceconnectionstatechange = prevHandler; // استعادة المعالج الأصلي
                    reject(new Error(`انتهت مهلة اتصال ICE بعد ${timeoutMs}ms`));
                }, timeoutMs);

                const handler = (ev) => {
                    if (prevHandler) prevHandler.call(pc, ev); // توثيق الحالة كما كانت
                    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
                        clearTimeout(timer);
                        pc.oniceconnectionstatechange = prevHandler;
                        resolve();
                    } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
                        clearTimeout(timer);
                        pc.oniceconnectionstatechange = prevHandler;
                        reject(new Error(`حالة اتصال ICE: ${pc.iceConnectionState}`));
                    }
                };

                pc.oniceconnectionstatechange = handler;
            });
        }

        let pendingRemoteIceCandidates = [];
        // 🔧 B5 — حرس عروض منفردة: منع إصدرار عرضَين متتاليين قبل إجابة السابق (Glare)
        let offerInFlight = false;

        /**
         * دالة اختبار الاتصال بخوادم Google STUN وفحص منافذ UDP عبر الكونسول أو الواجهة
         * يتم استدعاؤها في كونسول المتصفح عبر: testStunConnectivity() أو testGoogleStunServer()
         */
        window.testStunConnectivity = function(customStunUrl) {
            console.log("%c[STUN Diagnostic Test] بدء فحص الاتصال بخوادم Google STUN...", "color: #38bdf8; font-weight: bold; font-size: 14px;");
            const stunUrls = customStunUrl ? [customStunUrl] : [
                appConfig.stunServer || DEFAULT_CONFIG.stunServer,
                "stun:stun1.l.google.com:19302",
                "stun:stun2.l.google.com:19302",
                "stun:stun3.l.google.com:19302",
                "stun:stun4.l.google.com:19302"
            ];

            console.log("[STUN Diagnostic Test] خوادم STUN المعتمدة للفحص:", stunUrls);
            showHintOnce("stun-check", "بدء اختبار خوادم Google STUN والتحقق من فتح منافذ UDP...");

            return new Promise((resolve) => {
                let testPc = null;
                const gatheredSrflx = [];
                const allCandidates = [];
                let isFinished = false;

                const finishTest = () => {
                    if (isFinished) return;
                    isFinished = true;
                    if (testPc) {
                        try { testPc.close(); } catch (_) {}
                    }

                    if (gatheredSrflx.length > 0) {
                        const successMsg = `نجح اختبار STUN! تم جمع (${gatheredSrflx.length}) مرشح من نوع srflx (عبر Google STUN UDP بنجاح).`;
                        console.log(`%c[STUN SUCCESS] ${successMsg}`, "color: #4ade80; font-weight: bold; font-size: 13px;");
                        console.table(gatheredSrflx);
                        showToast(`نجح اختبار Google STUN! منافذ UDP تعمل بكفاءة (${gatheredSrflx.length} مرشح خارجي).`, "success");
                        resolve({ success: true, reflexiveCandidates: gatheredSrflx, allCandidates: allCandidates });
                    } else {
                        const warnMsg = "تحذير: لم يتم العثور على أي مرشح srflx! قد تكون منافذ UDP محظورة في هذه الشبكة أو أن خادم STUN غير متاح.";
                        console.warn(`%c[STUN WARNING] ${warnMsg}`, "color: #fbbf24; font-weight: bold; font-size: 13px;");
                        console.table(allCandidates);
                        showToast("تنبيه: تعذر استقبال مرشحات Reflexive من STUN (تحقق من جدار الحماية أو منافذ UDP).", "warning");
                        resolve({ success: false, reason: warnMsg, allCandidates: allCandidates });
                    }
                };

                try {
                    testPc = new RTCPeerConnection({
                        iceServers: stunUrls.map(u => ({ urls: u }))
                    });

                    try {
                        testPc.addTransceiver('audio', { direction: 'recvonly' });
                        testPc.addTransceiver('video', { direction: 'recvonly' });
                    } catch (_) {}

                    testPc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const c = event.candidate;
                            const candInfo = {
                                candidate: c.candidate,
                                type: c.type,
                                protocol: c.protocol,
                                address: c.address,
                                port: c.port,
                                relatedAddress: c.relatedAddress,
                                relatedPort: c.relatedPort
                            };
                            allCandidates.push(candInfo);
                            console.log(`[STUN Candidate] نوع: ${c.type} | بروتوكول: ${c.protocol} | عنوان: ${c.address}:${c.port}`);

                            if (c.type === "srflx") {
                                gatheredSrflx.push(candInfo);
                                console.log(`%c[STUN Reflexive Discovered] عنوان IP العام عبر STUN: ${c.address}:${c.port} (${c.protocol})`, "color: #34d399; font-weight: bold;");
                            }
                        } else {
                            console.log("[STUN Diagnostic Test] اكتمال مرحلة جمع مرشحات الفحص (null candidate).");
                            finishTest();
                        }
                    };

                    testPc.onicecandidateerror = (event) => {
                        console.error("[STUN Candidate Error]", event.errorCode, event.errorText, event.url);
                    };

                    testPc.createDataChannel("stunCheckChannel");
                    testPc.createOffer().then(offer => testPc.setLocalDescription(offer))
                    .catch(err => {
                        console.error("[STUN Offer Error]", err);
                        finishTest();
                    });

                    setTimeout(() => {
                        if (!isFinished) {
                            console.log("[STUN Diagnostic Test] انتهاء مهلة جمع المرشحات (Timeout). فحص النتائج...");
                            finishTest();
                        }
                    }, 5000);

                } catch (e) {
                    console.error("[STUN Initialization Error]", e);
                    finishTest();
                }
            });
        };
        // تيسير استدعاء الدالة من الكونسول باسم بديل
        window.testGoogleStunServer = window.testStunConnectivity;

        function initPeerConnection(targetId) {
            if (pc) {
                try { pc.close(); } catch (_) {}
            }
            pendingRemoteIceCandidates = [];
            localCandidatesCount = 0;
            remoteCandidatesCount = 0;
            lastCandidateType = "غير محدد";
            updateWebRTCDiagnosticUI();

            const rtcConfig = {
                iceServers: [
                    { urls: appConfig.stunServer || DEFAULT_CONFIG.stunServer },
                    { urls: "stun:stun1.l.google.com:19302" },
                    { urls: "stun:stun2.l.google.com:19302" },
                    { urls: "stun:stun3.l.google.com:19302" },
                    { urls: "stun:stun4.l.google.com:19302" }
                ],
                iceTransportPolicy: "all",
                bundlePolicy: "max-bundle",
                sdpSemantics: "unified-plan"
            };

            console.log(`%c[WebRTC Init] تهيئة RTCPeerConnection للمضيف [${targetId}] بخوادم STUN:`, "color: #38bdf8; font-weight: bold;", rtcConfig.iceServers);

            pc = new RTCPeerConnection(rtcConfig);

            try {
                // 🔧 B5 — اتجاه sendrecv يسمح للمضيف بإرفاق مساراته لاحقاً بلا تفاوض إضافي:
                // (قبل التغيير كان recvonly فلا يستطيع المضيف الإرسال مطلقاً بعد الإجابة)
                pc.addTransceiver('video', { direction: 'sendrecv' });
                pc.addTransceiver('audio', { direction: 'sendrecv' });
            } catch (e) {
                console.warn("[WebRTC Transceiver Warning]:", e);
            }

            // 🔧 B5 — قناة البيانات تُنشأ داخل التهيئة قبل أي عرض حتى يُحمل العرض الأول
            // مقطع application من دون تفاوض ثانٍ (كان يولد عرضاً إضافياً عاصفةً)
            try {
                dataChannel = pc.createDataChannel("bridgeData", { ordered: true });
                setupDataChannelEvents();
            } catch (dcErr) {
                console.warn("[WebRTC DataChannel Warning]:", dcErr);
            }

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    const c = event.candidate;
                    localCandidatesCount++;
                    if (c.type) lastCandidateType = `${c.type} (${c.protocol || 'udp'})`;
                    updateWebRTCDiagnosticUI();

                    console.log(`%c[ICE Gathering Local] جمع مرشح محلي: type=${c.type}, proto=${c.protocol}, address=${c.address || 'hidden'}:${c.port}, mid=${c.sdpMid}, line=${c.sdpMLineIndex}`, "color: #38bdf8;");
                    console.log("[ICE Candidate String]", c.candidate);

                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const payload = {
                            type: "ice",
                            from: myDeviceId,
                            to: targetId,
                            sdp: c.candidate,
                            sdpMid: c.sdpMid,
                            sdpMLineIndex: c.sdpMLineIndex
                        };
                        ws.send(JSON.stringify(payload));
                        console.log(`%c[ICE Relayed] تم إرسال مرشح ICE بنجاح إلى خادم الإشارات لترحيله للمضيف: ${targetId}`, "color: #34d399;");
                    } else {
                        console.error(`%c[ICE Relay Error] تعذر ترحيل المرشح؛ WebSocket غير متصل (الحالة: ${ws ? ws.readyState : 'غير مهيأ'})`, "color: #f87171; font-weight: bold;");
                    }
                } else {
                    console.log("%c[ICE Gathering Complete] اكتمل جمع مرشحات ICE المحلية لجهاز التحكم (Null Candidate).", "color: #a78bfa; font-weight: bold;");
                    updateWebRTCDiagnosticUI();
                }
            };

            pc.onicegatheringstatechange = () => {
                console.log(`%c[ICE Gathering State] تغيرت حالة جمع المرشحات إلى: ${pc.iceGatheringState}`, "color: #f59e0b; font-weight: bold;");
                updateWebRTCDiagnosticUI();
            };

            let iceRestartAttempts = 0;

            pc.oniceconnectionstatechange = () => {
                console.log(`%c[ICE Connection State] تغيرت حالة اتصال ICE إلى: ${pc.iceConnectionState}`, "color: #ec4899; font-weight: bold;");
                updateWebRTCDiagnosticUI();
                if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") {
                    showToast("اتصال WebRTC P2P مباشر مع المضيف جاهز تماماً!", "success");
                    iceRestartAttempts = 0;
                } else if (pc.iceConnectionState === "failed" || pc.iceConnectionState === "disconnected") {
                    console.warn("[ICE Connection State] انقطع أو فشل اتصال ICE المباشر. قد يكون بسبب إعدادات جدار الحماية أو حظر UDP.");
                    // محاولة ICE Restart تلقائية عند الفشل
                    if (pc.iceConnectionState === "failed" && iceRestartAttempts < 3) {
                        iceRestartAttempts++;
                        console.log(`%c[ICE Restart] محاولة إعادة تشغيل ICE (${iceRestartAttempts}/3)...`, "color: #f59e0b; font-weight: bold;");
                        setTimeout(() => {
                            if (pc && pc.signalingState !== "closed") {
                                performIceRestart(pc, activeTargetDeviceId);
                            }
                        }, 1000 * iceRestartAttempts);
                    }
                }
            };

            /**
             * تنفيذ ICE Restart لإعادة التفاوض وتجاوز عقبات NAT.
             */
            async function performIceRestart(peerConnection, targetId) {
                try {
                    console.log("%c[ICE Restart] جاري إنشاء عرض جديد مع ICE restart...", "color: #38bdf8; font-weight: bold;");
                    const offer = await peerConnection.createOffer({ iceRestart: true });
                    await peerConnection.setLocalDescription(offer);
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                            type: "offer",
                            from: myDeviceId,
                            to: targetId,
                            sdp: peerConnection.localDescription.sdp,
                            sdpType: "OFFER",
                            iceRestart: true
                        }));
                        peerConnection.__expectingAnswer = true; // B5 — الإجابة تبدو حية لهذا العرض أيضًا
                        showToast("تم إرسال عرض ICE restart لإعادة إنشاء الاتصال P2P", "info");
                    }
                } catch (e) {
                    console.error("[ICE Restart Error]", e);
                    showToast("فشل ICE Restart: " + e.message, "error");
                }
            }

            /**
             * 🔧 B5 — معلَق التوفيق التلقائي مُعطَّل: العروض تُرسل فقط صراحةً من
             * createWebRTCOffer/performIceRestart — الإرسال التلقائي هنا كان
             * يولّد 3 عروض متتالية (سطران recvonly + قناة البيانات + العرض الصريح)
             * فتُلف المضيف بين الإغلاق وإعادة البناء فيفلت تطبيق الإجابة.
             */
            pc.onnegotiationneeded = () => {
                console.log("[WebRTC Negotiation] تجاهُل إرسال تلقائي (منع العواصف) — سيُرسل عرض صريح عند الطلب فقط");
            };

            pc.onicecandidateerror = (event) => {
                console.warn(`[ICE Candidate Error] فشل الاتصال بخادم STUN: url=${event.url}, code=${event.errorCode}, errorText=${event.errorText}`);
            };

            pc.ontrack = (event) => {
                console.log(`%c[WebRTC ontrack] استلام مسار وسائط: kind=${event.track.kind}`, "color: #22c55e; font-weight: bold;");
                if (!remoteMediaStream) {
                    remoteMediaStream = new MediaStream();
                }
                const existing = remoteMediaStream.getTracks().find(t => t.kind === event.track.kind);
                if (existing) {
                    try { remoteMediaStream.removeTrack(existing); } catch (_) {}
                }
                remoteMediaStream.addTrack(event.track);

                const videoEl = document.getElementById("remote-video");
                const audioEl = document.getElementById("remote-audio");

                if (event.track.kind === 'video' && videoEl) {
                    videoEl.srcObject = remoteMediaStream;
                    videoEl.classList.remove('hidden');
                    const placeholder = document.getElementById("video-placeholder");
                    if (placeholder) placeholder.classList.add('hidden');
                    videoEl.play().catch(e => console.log("Video auto-play policy:", e));
                    showToast("تم استقبال وعرض بث الفيديو الحي بنجاح! 🎥", "success");
                } else if (event.track.kind === 'audio') {
                    if (audioEl) {
                        audioEl.srcObject = remoteMediaStream;
                        audioEl.play().catch(e => console.log("Audio auto-play policy:", e));
                    }
                    showToast("تم استقبال الصوت الحي من الميكروفون! 🎙️", "success");
                    try { attachLiveAudioMeter(); } catch (_) {}
                }
                updateWebRTCDiagnosticUI();
            };

            pc.onconnectionstatechange = () => {
                console.log(`%c[WebRTC PeerConnection State] -> ${pc.connectionState}`, "color: #06b6d4; font-weight: bold;");
                updateWebRTCDiagnosticUI();
                if (pc.connectionState === "connected") {
                    showToast("اتصال WebRTC P2P مباشر جاهز تماماً!", "success");
                }
            };

            pc.onsignalingstatechange = () => {
                updateWebRTCDiagnosticUI();
            };
        }

        function handleRemoteOffer(msg) {
            if (!msg || !msg.sdp) return;
            const fromId = msg.from;
            if (!pc || pc.connectionState === 'closed' || pc.connectionState === 'failed') {
                initPeerConnection(fromId);
            }
            pc.setRemoteDescription(new RTCSessionDescription({ type: "offer", sdp: msg.sdp }))
            .then(() => pc.createAnswer())
            .then(answer => pc.setLocalDescription(answer))
            .then(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "answer",
                        from: myDeviceId,
                        to: fromId,
                        sdp: pc.localDescription.sdp,
                        sdpType: "ANSWER"
                    }));
                }
                showToast("تم استقبال وتأكيد العرض المباشر من المضيف", "info");
                updateWebRTCDiagnosticUI();
                if (pendingRemoteIceCandidates.length > 0) {
                    pendingRemoteIceCandidates.forEach(cand => {
                        pc.addIceCandidate(cand).catch(e => console.error("ICE error:", e));
                    });
                    pendingRemoteIceCandidates = [];
                }
            }).catch(err => {
                console.error("Handle Remote Offer error:", err);
            });
        }

        function handleRemoteAnswer(msg) {
            if (!pc) return;
            if (!pc.__expectingAnswer) {
                console.warn("[WebRTC Signaling] إجابة بلا عرض معلق منها — تُهمل (حماية من الإجابات المتأخرة عهدةً)", msg);
                return;
            }
            console.log(`%c[WebRTC Signaling] استلام إجابة (Answer) من المضيف. جاري تطبيق Remote Description...`, "color: #6366f1; font-weight: bold;");
            pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.sdp }))
            .then(() => {
                pc.__expectingAnswer = false;
                console.log("%c[WebRTC Handshake] تم تطبيق Remote Description بنجاح وتأكيد القناة المباشرة!", "color: #10b981; font-weight: bold;");
                showToast("تمت المصافحة وتأكيد القناة المباشرة!", "success");
                updateWebRTCDiagnosticUI();

                if (pendingRemoteIceCandidates.length > 0) {
                    console.log(`[WebRTC ICE Drain] إضافة (${pendingRemoteIceCandidates.length}) مرشحات ICE كانت معلقة في قائمة الانتظار...`);
                    pendingRemoteIceCandidates.forEach(cand => {
                        pc.addIceCandidate(cand)
                        .then(() => console.log("[WebRTC ICE Drained] تم تطبيق مرشح معلق بنجاح"))
                        .catch(e => console.error("[WebRTC ICE Drain Error] خطأ إضافة مرشح معلق:", e));
                    });
                    pendingRemoteIceCandidates = [];
                }
            }).catch(err => {
                pc.__expectingAnswer = false;
                console.error("[WebRTC Remote Answer Error]", err);
                showToast("خطأ في تطبيق إجابة المضيف: " + err.message, "error");
                updateWebRTCDiagnosticUI();
            });
        }

        function handleRemoteCandidate(msg) {
            console.log(`%c[WebRTC Remote ICE Received] استلام مرشح ICE من المضيف عبر السيرفر:`, "color: #8b5cf6;", msg);
            if (!msg.sdp) {
                console.warn("[WebRTC Remote ICE] تم تجاهل مرشح فارغ.");
                return;
            }

            remoteCandidatesCount++;
            updateWebRTCDiagnosticUI();

            const candidate = new RTCIceCandidate({
                candidate: msg.sdp,
                sdpMid: msg.sdpMid,
                sdpMLineIndex: msg.sdpMLineIndex
            });

            if (pc && pc.remoteDescription && pc.remoteDescription.type) {
                pc.addIceCandidate(candidate)
                .then(() => console.log("%c[WebRTC ICE Candidate Applied] تم تطبيق مرشح ICE من المضيف بنجاح!", "color: #34d399;"))
                .catch(e => console.error("[WebRTC ICE Add Error] خطأ في تطبيق مرشح ICE:", e));
            } else {
                console.log("[WebRTC ICE Queued] لم يتم اكتمال ضبط Remote Description بعد، تمت إضافة المرشح لقائمة الانتظار المؤقتة.");
                pendingRemoteIceCandidates.push(candidate);
            }
        }

        let activeFileDownloads = {};
        let deviceInfoResolver = null;

        function waitForDeviceInfoResponse(timeoutMs = 3500) {
            return new Promise((resolve) => {
                if (latestDeviceInfo && latestDeviceInfo.batteryLevel !== undefined) {
                    resolve(latestDeviceInfo);
                    return;
                }
                const timer = setTimeout(() => {
                    deviceInfoResolver = null;
                    resolve(latestDeviceInfo);
                }, timeoutMs);

                deviceInfoResolver = (data) => {
                    clearTimeout(timer);
                    deviceInfoResolver = null;
                    resolve(data);
                };
            });
        }

        function handleBinaryChunk(buffer) {
            if (!buffer || buffer.byteLength < 17) return;
            try {
                const view = new DataView(buffer);
                const type = view.getInt8(0);
                if (type !== 1) return;

                const messageId = view.getInt32(1);
                const seq = view.getInt32(5);
                const payloadLen = view.getInt32(13);

                const chunkData = buffer.slice(17, 17 + payloadLen);

                if (!activeFileDownloads[messageId]) {
                    activeFileDownloads[messageId] = [];
                }
                activeFileDownloads[messageId].push(chunkData);
            } catch (e) {
                console.error("Binary chunk handling error:", e);
            }
        }

        // ============================================================
        //        🎬 B8 — مشغّل وسائط احترافي + سحب المحتوى القطعي
        //   (فيديو/صوت/صورة من المعرض/المجلدات/الخزنة المفكوكة)
        //        + موجة الصوت (صامت/مُصوات) + لقطات من المشغل والبث الحي
        //        + Google Drive: رفع يدوي مفرد/متعدد + مزامنة تلقائية
        // ============================================================
        function rbMimeFromName(n) {
            const s = String(n || '').toLowerCase();
            const map = [['jpg', 'image/jpeg'], ['jpeg', 'image/jpeg'], ['png', 'image/png'], ['gif', 'image/gif'], ['webp', 'image/webp'], ['bmp', 'image/bmp'], ['mp4', 'video/mp4'], ['webm', 'video/webm'], ['3gp', 'video/3gpp'], ['mkv', 'video/x-matroska'], ['mov', 'video/quicktime'], ['mp3', 'audio/mpeg'], ['m4a', 'audio/mp4'], ['aac', 'audio/aac'], ['ogg', 'audio/ogg'], ['opus', 'audio/ogg'], ['wav', 'audio/wav'], ['flac', 'audio/flac'], ['amr', 'audio/amr'], ['json', 'application/json'], ['txt', 'text/plain'], ['pdf', 'application/pdf']];
            const ext = s.includes('.') ? s.split('.').pop().split('?')[0] : '';
            const hit = map.find(p => p[0] === ext);
            return hit ? hit[1] : 'application/octet-stream';
        }
        function rbFmtMB(bytes) {
            const b = Number(bytes) || 0;
            if (b >= 1048576) return (b / 1048576).toFixed(1) + 'MB';
            if (b >= 1024) return (b / 1024).toFixed(0) + 'KB';
            return b + 'B';
        }
        function rbMpFmtTime(t) {
            t = Math.max(0, Math.floor(Number(t) || 0));
            const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
            return (h > 0 ? h + ':' + String(m).padStart(2, '0') : String(m)) + ':' + String(s).padStart(2, '0');
        }
        function rbMpBucketOf(kind) { return kind === 'video' ? 'videos' : (kind === 'audio' ? 'audio' : 'images'); }
        function rbDataUrlToBlob(dataUrl) {
            try {
                const parts = String(dataUrl).split(',');
                const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
                const bin = atob(parts[1]);
                const u8 = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
                return new Blob([u8], { type: mime });
            } catch (_) { return null; }
        }

        // —— سحب محتوى كامل قطعياً من الهاتف عبر قناة البيانات (رأس started/completed من W1) ——
        function pullHostContent(o) {
            return new Promise((resolve, reject) => {
                try {
                    const dc = dataChannel;
                    if (!dc || dc.readyState !== 'open') {
                        showToast('سحب المحتوى يحتاج الربط الحي (DataChannel) مفتوحاً — فعّل الربط الحي مع المضيف أولاً', 'warning');
                        return reject(new Error('DataChannel closed'));
                    }
                    const reqId = 100000 + Math.floor(Math.random() * 100000); // نطاق مستقل عن sendRPCCommand
                    const isFile = (o.fileId !== undefined && o.fileId !== null);
                    const cmd = isFile ? 'file_open' : (o.path ? 'storage_open' : 'vault_open');
                    const params = isFile ? { fileId: String(o.fileId), bucket: o.bucket || 'images' }
                        : (o.path ? { path: o.path } : { kind: o.vaultKind, name: o.vaultName });
                    activeFileDownloads[reqId] = [];
                    const startedAt = Date.now();
                    window.__rbContentHeaders = window.__rbContentHeaders || {};
                    const timer = setInterval(() => {
                        try {
                            const hdr = window.__rbContentHeaders[reqId];
                            const parts = activeFileDownloads[reqId] || [];
                            let got = 0; parts.forEach(p => { got += p.byteLength; });
                            const st = document.getElementById('mp-status');
                            if (hdr && hdr.size > 0 && st) {
                                st.textContent = Math.min(100, Math.round((got / hdr.size) * 100)) + '% • ' + rbFmtMB(got) + ' / ' + rbFmtMB(hdr.size);
                            }
                            if (hdr && hdr.size > 0 && got >= hdr.size) {
                                clearInterval(timer);
                                delete window.__rbContentHeaders[reqId];
                                const blobParts = activeFileDownloads[reqId] || [];
                                delete activeFileDownloads[reqId];
                                resolve({ blob: new Blob(blobParts, { type: o.mime || 'application/octet-stream' }), size: got, name: hdr.name || o.name || '' });
                                return;
                            }
                            if (Date.now() - startedAt > 180000) {
                                clearInterval(timer);
                                delete activeFileDownloads[reqId];
                                delete window.__rbContentHeaders[reqId];
                                reject(new Error('انتهت مهلة سحب المحتوى (180 ثانية)'));
                            }
                        } catch (e2) { clearInterval(timer); reject(e2); }
                    }, 300);
                    try { dc.send(JSON.stringify({ id: reqId, cmd: cmd, params: params })); }
                    catch (e3) { clearInterval(timer); delete activeFileDownloads[reqId]; reject(e3); }
                } catch (e) { reject(e); }
            });
        }

        // —— موجة الصوت: قمم + RMS مع تمييز الفواصل الصامتة ——
        async function mpBuildWaveform(blob) {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) { mpStatus('المتصفح لا يدعم تحليل الموجة', true); return; }
                const ac = new AC();
                const arr = await blob.arrayBuffer();
                const buf = await ac.decodeAudioData(arr.slice(0));
                try { ac.close(); } catch (_) {}
                const ch = buf.getChannelData(0);
                const N = 260;
                const step = Math.max(1, Math.floor(ch.length / N));
                const bars = [];
                for (let i = 0; i < N; i++) {
                    const s = i * step, e2 = Math.min(ch.length, s + step);
                    let peak = 0, sum = 0, cnt = 0;
                    for (let j = s; j < e2; j++) { const w = Math.abs(ch[j]); if (w > peak) peak = w; sum += w * w; cnt++; }
                    bars.push({ peak: peak, rms: cnt ? Math.sqrt(sum / cnt) : 0 });
                }
                mpState.waveBars = bars;
                const c = document.getElementById('mp-wave');
                if (!c) return;
                c.width = Math.max(320, (c.clientWidth || 600) * 2);
                c.height = 220;
                c.onclick = (ev) => {
                    try {
                        const r = c.getBoundingClientRect();
                        const p = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
                        const a = document.getElementById('mp-audio');
                        if (a && a.duration && isFinite(a.duration)) a.currentTime = p * a.duration;
                    } catch (_) {}
                };
                mpState.waveDrawn = true;
                mpDrawWaveform(-1);
                const a = document.getElementById('mp-audio');
                if (a) a.play().catch(() => {});
            } catch (e) { mpStatus('تعذر تحليل الموجة: ' + String(e && e.message || e), true); }
        }
        function mpDrawWaveform(hoverPct) {
            const c = document.getElementById('mp-wave');
            if (!c || !mpState.waveBars) return;
            const ctx = c.getContext('2d');
            const W = c.width, H = c.height, mid = H / 2;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(148,163,184,0.25)';
            ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(W, mid); ctx.stroke();
            const bars = mpState.waveBars;
            const bw = W / bars.length;
            for (let i = 0; i < bars.length; i++) {
                const b = bars[i];
                const h = Math.max(2, b.peak * (H * 0.92));
                const silent = b.rms < 0.02;
                ctx.fillStyle = silent ? '#3f4a5c' : (i / bars.length <= (hoverPct >= 0 ? hoverPct : 0) ? '#14b8a6' : '#2dd4bf');
                ctx.fillRect(i * bw + 1, mid - h / 2, Math.max(1.5, bw - 2), h);
            }
            ctx.fillStyle = 'rgba(148,163,184,0.8)';
            ctx.font = '18px monospace';
            ctx.fillText('الصامت ⌐ رمادي، المُصوَّت ⌐ تركوازي', 14, 24);
        }

        // —— مقياس مستوى الصوت الحي (AnalyserNode على الدفق الوارد — بلا صدى) ——
        function attachLiveAudioMeter() {
            try {
                if (window.__rbLiveMeter) return;
                if (!remoteMediaStream || !remoteMediaStream.getAudioTracks().length) return;
                const host = document.createElement('div');
                host.className = 'fixed bottom-3 left-3 z-[75] bg-slate-900/95 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden';
                host.style.width = '200px';
                host.innerHTML = `
                    <div class="flex items-center justify-between px-2.5 py-1.5 border-b border-slate-800 bg-slate-950/80">
                        <p class="text-[10px] font-bold text-teal-300">📊 مستوى الصوت الحي</p>
                        <button onclick="stopLiveAudioMeter()" class="text-slate-500 hover:text-white text-xs px-1">✕</button>
                    </div>
                    <canvas id="rb-lam-c" width="392" height="88" style="width:196px;height:44px;display:block"></canvas>`;
                document.body.appendChild(host);
                const AC = window.AudioContext || window.webkitAudioContext;
                const ac = new AC();
                const src = ac.createMediaStreamSource(remoteMediaStream);
                const an = ac.createAnalyser();
                an.fftSize = 512;
                src.connect(an); // لا نصل للوجهة — بلا صدى
                window.__rbLiveMeter = { host: host, raf: 0, ac: ac };
                const canvas = document.getElementById('rb-lam-c'), ctx = canvas.getContext('2d');
                const hist = new Array(62).fill(0);
                let hIdx = 0;
                const buf = new Uint8Array(an.fftSize);
                const tick = () => {
                    try {
                        if (!window.__rbLiveMeter) return;
                        an.getByteTimeDomainData(buf);
                        let sum = 0;
                        for (let i = 0; i < buf.length; i++) { const dv = (buf[i] - 128) / 128; sum += dv * dv; }
                        const rms = Math.sqrt(sum / buf.length);
                        hist[hIdx % 62] = rms; hIdx++;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        const bw = canvas.width / 62;
                        for (let i = 0; i < 62; i++) {
                            const v = hist[i];
                            const h = Math.max(2, v * canvas.height * 1.7);
                            ctx.fillStyle = v < 0.02 ? '#3f4a5c' : '#2dd4bf';
                            ctx.fillRect(i * bw + 1, canvas.height - h - 2, Math.max(1.5, bw - 2), h);
                        }
                        window.__rbLiveMeter.raf = requestAnimationFrame(tick);
                    } catch (_) {}
                };
                tick();
            } catch (e) { try { stopLiveAudioMeter(); } catch (_) {} }
        }
        function stopLiveAudioMeter() {

            try { if (m.ac) m.ac.close(); } catch (_) {}
            try { m.host.remove(); } catch (_) {}
            window.__rbLiveMeter = null;
        }

        function rbB64FromUint8(u8) {
            let bin = '';

        async function rbDriveUpload(name, blob, mime, quiet) {
            const cfg = rbDriveCfg();

        async function rbDriveSyncTick(manual) {
            try {
                const cfg = rbDriveCfg();
                if (!cfg.autoSync && !manual) return;
                if (!dataChannel || dataChannel.readyState !== 'open') {
                    if (manual) showToast('المزامنة تحتاج الربط الحي (DataChannel) مفتوحاً', 'warning');
                    return;
                }
                const kinds = [];
                if (cfg.syncCallRec) kinds.push('callrec');
                if (cfg.syncScreen) kinds.push('screen');
                if (cfg.syncShots) kinds.push('screenshots');
                if (cfg.syncLocation) kinds.push('location');
                if (!kinds.length) { if (manual) showToast('لم تحدد أنواع البيانات للمزامنة في الإعدادات', 'warning'); return; }
                const base = serverStateApiBase();
                const hostId = appConfig.targetDeviceId || '';
                if (!base || !hostId) { if (manual) showToast('حدد معرف الهاتف المضيف وعنوان الخادم أولاً', 'warning'); return; }
                if (manual) showToast('جولة مزامنة Drive بدأت…', 'info');
                const seen = rbDriveSeen();
                for (const k of kinds) {
                    try {
                        const r = await fetch(base + '/api/blob/list?device=' + encodeURIComponent(hostId) + '&kind=' + encodeURIComponent(k));
                        if (!r.ok) continue;
                        const js = await r.json();
                        const fresh = (js.items || []).filter(b => !seen.has(k + '/' + b.name)).slice(0, 25);
                        for (const b of fresh) {
                            const ok = await driveUploadVaultBlob(k, String(b.name || ''), true);
                            if (ok) { seen.add(k + '/' + String(b.name || '')); rbDriveMarkSeen(seen); }
                            else break;
                        }
                    } catch (_) {}
                }
                try { localStorage.setItem('rb_drive_lastsync_v1', String(Date.now())); } catch (_) {}
                if (manual) showToast('انتهت جولة المزامنة ✅', 'success');
                renderSettingsIfOpen();
            } catch (_) {}
        }
